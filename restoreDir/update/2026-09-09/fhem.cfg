define DOIF_WP_Laufzeiten DOIF (\
([LambdaWP:Verdichter_aktiv] eq "on") and\
[10s_20s_timer:tick] == 1)\
(\
{\
  my $now = time();;\
\
  my $vd    = ReadingsVal("LambdaWP","Verdichter_aktiv","off");;\
  my $state = ReadingsVal("LambdaWP","HP_OperatingState","");;\
\
  my $vd_last = ReadingsVal("$SELF","vd_last","off");;\
\
  if($vd eq "on" && $vd_last ne "on"){\
    my $cnt = ReadingsNum("$SELF","vd_start_counter",0) + 1;;\
    fhem("setreading $SELF vd_start_counter $cnt");;\
\
    fhem("setreading $SELF vd_last_start_ts $now");;\
\
    my @t = localtime($now);;\
    my $ts = sprintf("%02d:%02d:%02d",$t[2],$t[1],$t[0]);;\
    fhem("setreading $SELF letzter_start_um $ts");;\
  }\
\
  if($vd eq "on"){\
    my $start_ts = ReadingsNum("$SELF","vd_last_start_ts",0);;\
    my $dur = ($start_ts > 0) ? ($now - $start_ts) : 0;;\
\
    my $mm = int($dur/60);;\
    my $ss = $dur % 60;;\
\
    fhem("setreading $SELF vd_on_seit ".sprintf("%02d:%02d",$mm,$ss));;\
    fhem("setreading $SELF vd_on_seit_sec $dur");;\
  } else {\
    fhem("setreading $SELF vd_on_seit 00:00");;\
  }\
\
  fhem("setreading $SELF vd_last $vd");;\
\
  my $last_ts   = ReadingsNum("$SELF","mode_last_ts",$now);;\
  my $last_mode = ReadingsVal("$SELF","mode_last","idle");;\
\
  my $elapsed = $now - $last_ts;;\
  $elapsed = 0 if($elapsed < 0);;\
\
  if($last_mode ne "idle"){\
    my $sum = ReadingsNum("$SELF","runtime_${last_mode}_sec",0);;\
    $sum += $elapsed;;\
    fhem("setreading $SELF runtime_${last_mode}_sec $sum");;\
    fhem("setreading $SELF runtime_${last_mode}_min ".int($sum/60));;\
    fhem("setreading $SELF runtime_${last_mode}_h ".sprintf("%.1f",$sum/3600));;\
  }\
\
  my %map = (\
    "STBY" => "stby",\
    "CENTRAL_HEATING" => "heating",\
    "DHW" => "dhw",\
    "CC" => "cooling",\
    "CIRCULATE" => "circulate",\
    "DEFROST" => "defrost",\
    "OFF" => "off",\
    "FROST" => "frost",\
    "STBY-FROST" => "stby_frost",\
    "SUMMER" => "summer",\
    "HOLIDAY" => "holiday",\
    "ERROR" => "error",\
    "WARNING" => "warning",\
    "INFO-MESSAGE" => "info",\
    "TIME-BLOCK" => "time_block",\
    "RELEASE-BLOCK" => "release_block",\
    "MINTEMP-BLOCK" => "mintemp_block",\
    "FIRMWARE-DOWNLOAD" => "fw_download"\
  );;\
\
  my $mode = exists $map{$state} ? $map{$state} : "other";;\
\
  fhem("setreading $SELF mode_current $mode");;\
  fhem("setreading $SELF mode_last $mode");;\
  fhem("setreading $SELF mode_last_ts $now");;\
\
  my @modes = ("heating","dhw","defrost","cooling","circulate","stby","off","frost","stby_frost","summer","holiday","error","warning","info","time_block","release_block","mintemp_block","fw_download","other");;\
\
  my $total = 0;;\
\
  foreach my $m (@modes){\
    my $sec = ReadingsNum("$SELF","runtime_${m}_sec",0);;\
    $total += $sec;;\
  }\
\
  if($total > 0){\
    fhem("setreading $SELF runtime_total_sec $total");;\
    fhem("setreading $SELF runtime_total_h ".sprintf("%.1f",$total/3600));;\
\
    foreach my $m (@modes){\
      my $sec = ReadingsNum("$SELF","runtime_${m}_sec",0);;\
      my $share = 100 * $sec / $total;;\
      fhem("setreading $SELF share_${m} ".sprintf("%.1f",$share));;\
    }\
  }\
}\
)
