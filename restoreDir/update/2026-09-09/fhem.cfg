define DOIF_Bewaesserung DOIF ([+00:10] or [06:00] or [12:00] or [18:00])\
({\
  use Time::Local;;\
  use POSIX qw(floor);;\
\
  my $now  = time();;\
  my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
  my $DEV  = "DOIF_Bewaesserung";;\
\
  my $now_str = sprintf("%02d.%02d.%04d %02d:%02d:%02d",\
    $mday, $mon+1, $year+1900, $hour, $min, $sec);;\
\
  my $evap_faktor_sued = 1.0;;\
  my $evap_faktor_ost  = 0.7;;\
  my $evap_faktor_nord = 0.45;;\
\
  my $pumpe_l_min  = 30;;\
  my $flaeche_sued = 50;;\
  my $flaeche_ost  = 50;;\
  my $flaeche_nord = 50;;\
\
  my $soil_ziel         = 70;;\
  my $soil_index_pro_mm = 3.5;;\
  my $soil_index_cap    = 150;;\
\
  my $dauer_nord_min = 10;;\
  my $dauer_nord_max = 20;;\
\
  my $dauer_max_sued = 45;;\
  my $dauer_max_ost  = 32;;\
  my $dauer_max_nord = 20;;\
  my $dauer_min_alle = 3;;\
\
  my $soil_grenz_bedarf1 = 45;;\
  my $soil_grenz_bedarf2 = 30;;\
  my $soil_grenz_notfall = 15;;\
\
  my $watering_intervall_h          = 48;;\
  my $watering_intervall_fallback_h = 72;;\
\
  my $et_koeff_rad  = 0.008;;\
  my $et_koeff_temp = 0.06;;\
  my $et_koeff_wind = 0.10;;\
  my $et_temp_basis = 10;;\
  my $et_basis_min  = 0.05;;\
  my $et_basis_max  = 10.0;;\
\
  my $last_str  = ReadingsVal($DEV,"lastWater","");;\
  my $last_unix = 0;;\
\
  if($last_str ne "" && $last_str =~ /(\d+)\.(\d+)\.(\d+)\s+(\d+):(\d+):(\d+)/)\
  {\
    $last_unix = timelocal($6,$5,$4,$1,$2-1,$3-1900);;\
  }\
\
  if($last_unix == 0)\
  {\
    $last_unix = $now - (4 * 86400);;\
    my ($ls,$lm,$lh,$ld,$lmo,$ly) = localtime($last_unix);;\
    my $init_str = sprintf("%02d.%02d.%04d %02d:%02d:%02d",\
      $ld,$lmo+1,$ly+1900,$lh,$lm,$ls);;\
    fhem("setreading $DEV lastWater $init_str");;\
  }\
\
  my $stunden = ($now - $last_unix) / 3600;;\
\
  my $lastcalc_str  = ReadingsVal($DEV,"lastCalc","");;\
  my $lastcalc_unix = 0;;\
\
  if($lastcalc_str ne "" && $lastcalc_str =~ /(\d+)\.(\d+)\.(\d+)\s+(\d+):(\d+):(\d+)/)\
  {\
    $lastcalc_unix = timelocal($6,$5,$4,$1,$2-1,$3-1900);;\
  }\
\
  $lastcalc_unix = $now if($lastcalc_unix == 0);;\
\
  my $delta_h = ($now - $lastcalc_unix) / 3600;;\
  $delta_h = 0  if($delta_h < 0);;\
  $delta_h = 24 if($delta_h > 24);;\
\
  fhem("setreading $DEV lastCalc $now_str");;\
\
  my $soil_sued = ReadingsNum($DEV,"SoilIndex_sued", 75);;\
  my $soil_ost  = ReadingsNum($DEV,"SoilIndex_ost",  75);;\
  my $soil_nord = ReadingsNum($DEV,"SoilIndex_nord", 80);;\
\
  my $pv_now_w = ReadingsNum("GoodWe_Garage_Haus_West_5877","PV_Goodwe_Sued_Total_Power",0);;\
\
  my $bresser_verbunden = ReadingsNum("BresserWetter","verbindung_aussensensor",0);;\
  my $bresser_batterie_low = (ReadingsNum("BresserWetter","batterie_aussensensor",1) == 0) ? 1 : 0;;\
  my $bresser_alt = ((ReadingsAge("BresserWetter","temperatur_aussen",9999) > 600) || !$bresser_verbunden) ? 1 : 0;;\
\
  my $temp    = $bresser_alt ? ReadingsNum("DWD","fc0_${hour}_TTT",15) : ReadingsNum("BresserWetter","temperatur_aussen",15);;\
  my $wind_ms = $bresser_alt ? (ReadingsNum("DWD","fc0_${hour}_FX1",5) / 3.6) : ReadingsNum("BresserWetter","wind_10min_mittel_ms",1.5);;\
  my $hum     = $bresser_alt ? ReadingsNum("DWD","fc0_${hour}_Neff",70) : ReadingsNum("BresserWetter","feuchte_aussen",70);;\
  my $rad_wm2 = $bresser_alt ? ReadingsNum("DWD","fc0_${hour}_Rad1h",0) : ReadingsNum("BresserWetter","sonneneinstrahlung",0);;\
\
  my $tx = ReadingsNum("DWD","fc0_Tx",20);;\
\
  my $regen_tag_now  = ReadingsNum("BresserWetter","regen_tag",0);;\
  my $regen_tag_last = ReadingsNum($DEV,"lastRegenTag",$regen_tag_now);;\
\
  my $regen_run;;\
  if($regen_tag_now < $regen_tag_last)\
  {\
    $regen_run = $regen_tag_last;;\
  }\
  else\
  {\
    $regen_run = $regen_tag_now - $regen_tag_last;;\
  }\
  $regen_run = 0 if($bresser_alt);;\
\
  fhem("setreading $DEV lastRegenTag $regen_tag_now");;\
\
  my $regen_h = 0;;\
  if($bresser_alt)\
  {\
    for my $h (0..23)\
    {\
      my $key = sprintf("fc0_%d_RR1c", $h);;\
      $regen_h += ReadingsNum("DWD",$key,0);;\
    }\
  }\
  else\
  {\
    $regen_h = $regen_tag_now;;\
  }\
\
  my $regen_fc = 0;;\
\
  for my $d (1..2)\
  {\
    for my $h (0..23)\
    {\
      my $key = sprintf("fc%d_%d_RR1c", $d, $h);;\
      $regen_fc += ReadingsNum("DWD",$key,0);;\
    }\
  }\
\
  my $temp_delta = ($temp > $et_temp_basis)\
                  ? ($temp - $et_temp_basis) : 0;;\
\
  my $et_ref_basis = ($et_koeff_rad * $rad_wm2)\
    + ($et_koeff_temp * $temp_delta * (1 - $hum/100))\
    + ($et_koeff_wind * $wind_ms);;\
\
  $et_ref_basis = $et_basis_min\
    if($et_ref_basis < $et_basis_min);;\
  $et_ref_basis = $et_basis_max\
    if($et_ref_basis > $et_basis_max);;\
\
  my $et_sued = $et_ref_basis * $evap_faktor_sued;;\
  my $et_ost  = $et_ref_basis * $evap_faktor_ost;;\
  my $et_nord = $et_ref_basis * $evap_faktor_nord;;\
\
  my $evap_sued = $et_sued * ($delta_h / 24);;\
  my $evap_ost  = $et_ost  * ($delta_h / 24);;\
  my $evap_nord = $et_nord * ($delta_h / 24);;\
\
  $soil_sued = $soil_sued - ($evap_sued * $soil_index_pro_mm) + ($regen_run * $soil_index_pro_mm);;\
  $soil_ost  = $soil_ost  - ($evap_ost  * $soil_index_pro_mm) + ($regen_run * $soil_index_pro_mm);;\
  $soil_nord = $soil_nord - ($evap_nord * $soil_index_pro_mm) + ($regen_run * $soil_index_pro_mm);;\
\
  $soil_sued = $soil_index_cap if($soil_sued > $soil_index_cap);; $soil_sued = 0 if($soil_sued < 0);;\
  $soil_ost  = $soil_index_cap if($soil_ost  > $soil_index_cap);; $soil_ost  = 0 if($soil_ost  < 0);;\
  $soil_nord = $soil_index_cap if($soil_nord > $soil_index_cap);; $soil_nord = 0 if($soil_nord < 0);;\
\
  fhem("setreading $DEV SoilIndex_sued ".sprintf("%.1f",$soil_sued));;\
  fhem("setreading $DEV SoilIndex_ost  ".sprintf("%.1f",$soil_ost));;\
  fhem("setreading $DEV SoilIndex_nord ".sprintf("%.1f",$soil_nord));;\
\
  my $soil_min = $soil_sued;;\
  $soil_min = $soil_ost  if($soil_ost  < $soil_min);;\
  $soil_min = $soil_nord if($soil_nord < $soil_min);;\
\
  my $bedarf = 0;;\
  if($soil_min < $soil_grenz_bedarf1) { $bedarf = 1;; }\
  if($soil_min < $soil_grenz_bedarf2) { $bedarf = 2;; }\
\
  my $block       = 0;;\
  my $block_grund = "none";;\
\
  my $fhem_start    = ReadingsVal("global","startupdate",0);;\
  my $neustart_block = (($now - $fhem_start) < 300) ? 1 : 0;;\
\
  my $zisterne_leer = ReadingsVal("Zisterne_leer_erkannt","state","off");;\
\
  if($neustart_block)\
  {\
    $block       = 1;;\
    $block_grund = "neustart_schutz";;\
  }\
  elsif($zisterne_leer eq "on")\
  {\
    $block       = 1;;\
    $block_grund = "zisterne_leer";;\
  }\
  elsif($regen_h > 3)\
  {\
    $block       = 1;;\
    $block_grund = "regen_heute";;\
  }\
  elsif($regen_fc > 8)\
  {\
    $block       = 1;;\
    $block_grund = "regen_forecast";;\
  }\
\
  my $pv_ok   = ($pv_now_w > 500)  ? 1 : 0;;\
  my $pv_gut  = ($pv_now_w > 2000) ? 1 : 0;;\
  my $pv_peak = ($hour >= 10 && $hour <= 16) ? 1 : 0;;\
\
  my $dryness_frac = ($soil_grenz_bedarf1 - $soil_min) / ($soil_grenz_bedarf1 - $soil_grenz_notfall);;\
  $dryness_frac = 0 if($dryness_frac < 0);;\
  $dryness_frac = 1 if($dryness_frac > 1);;\
\
  my $dauer_nord = int($dauer_nord_min + $dryness_frac * ($dauer_nord_max - $dauer_nord_min) + 0.5);;\
  my $dauer_sued = int($dauer_nord * ($evap_faktor_sued / $evap_faktor_nord) + 0.5);;\
  my $dauer_ost  = int($dauer_nord * ($evap_faktor_ost  / $evap_faktor_nord) + 0.5);;\
\
  $dauer_sued = $dauer_min_alle  if($dauer_sued < $dauer_min_alle);;\
  $dauer_ost  = $dauer_min_alle  if($dauer_ost  < $dauer_min_alle);;\
  $dauer_nord = $dauer_min_alle  if($dauer_nord < $dauer_min_alle);;\
  $dauer_sued = $dauer_max_sued  if($dauer_sued > $dauer_max_sued);;\
  $dauer_ost  = $dauer_max_ost   if($dauer_ost  > $dauer_max_ost);;\
  $dauer_nord = $dauer_max_nord  if($dauer_nord > $dauer_max_nord);;\
\
  my $mm_sued = $dauer_sued * $pumpe_l_min / $flaeche_sued;;\
  my $mm_ost  = $dauer_ost  * $pumpe_l_min / $flaeche_ost;;\
  my $mm_nord = $dauer_nord * $pumpe_l_min / $flaeche_nord;;\
\
  my $next_unix = $last_unix + ($watering_intervall_h * 3600);;\
  my ($ns,$nm,$nh,$nd,$nmo,$ny) = localtime($next_unix);;\
  if($nh < 11)\
  {\
    $next_unix = timelocal(0,0,11,$nd,$nmo,$ny);;\
  }\
  elsif($nh > 15)\
  {\
    my $t = timelocal(0,0,11,$nd,$nmo,$ny) + 86400;;\
    ($ns,$nm,$nh,$nd,$nmo,$ny) = localtime($t);;\
    $next_unix = timelocal(0,0,11,$nd,$nmo,$ny);;\
  }\
  my ($ps,$pm,$ph,$pd,$pmo,$py) = localtime($next_unix);;\
  my $next_str = sprintf("%02d.%02d.%04d %02d:%02d",\
    $pd,$pmo+1,$py+1900,$ph,$pm);;\
\
  my $start  = 0;;\
  my $reason = "none";;\
\
  if($block == 0)\
  {\
    my $regen_plausibel = ($regen_h >= 2 || $regen_fc >= 5) ? 1 : 0;;\
    my $readings_alt    = ($stunden > 144) ? 1 : 0;;\
    if($soil_min < $soil_grenz_notfall && !$regen_plausibel && !$readings_alt)\
    {\
      $start  = 1;;\
      $reason = "dry_notfall";;\
    }\
    elsif($bedarf >= 1 && $stunden >= $watering_intervall_h && $pv_peak && $pv_ok)\
    {\
      $start  = 1;;\
      $reason = "dry_scheduled_pv";;\
    }\
    elsif($bedarf >= 1 && $stunden >= $watering_intervall_fallback_h)\
    {\
      $start  = 1;;\
      $reason = "dry_scheduled_timeout";;\
    }\
    else\
    {\
      if($soil_min < $soil_grenz_notfall)\
      {\
        $reason = ($readings_alt) ? "notfall_unterdrueckt_readings_alt"\
                                  : "notfall_unterdrueckt_regen";;\
      }\
      elsif($bedarf >= 1 && $stunden < $watering_intervall_h)\
      {\
        $reason = "intervall_nicht_erreicht";;\
      }\
      elsif($bedarf == 0)\
      {\
        $reason = "boden_ausreichend_feucht";;\
      }\
    }\
  }\
  else\
  {\
    $reason = "block_$block_grund";;\
  }\
\
  fhem("setreading $DEV dbg_zeit $now_str");;\
  fhem("setreading $DEV dbg_bresser_alt $bresser_alt");;\
  fhem("setreading $DEV dbg_bresser_batterie_low $bresser_batterie_low");;\
  fhem("setreading $DEV dbg_stunden_seit_watering ".sprintf("%.1f",$stunden));;\
  fhem("setreading $DEV dbg_delta_h ".sprintf("%.3f",$delta_h));;\
  fhem("setreading $DEV dbg_et_basis ".sprintf("%.3f",$et_ref_basis));;\
  fhem("setreading $DEV dbg_et_sued ".sprintf("%.3f",$et_sued));;\
  fhem("setreading $DEV dbg_et_ost ".sprintf("%.3f",$et_ost));;\
  fhem("setreading $DEV dbg_et_nord ".sprintf("%.3f",$et_nord));;\
  fhem("setreading $DEV dbg_evap_sued ".sprintf("%.3f",$evap_sued));;\
  fhem("setreading $DEV dbg_evap_ost ".sprintf("%.3f",$evap_ost));;\
  fhem("setreading $DEV dbg_evap_nord ".sprintf("%.3f",$evap_nord));;\
  fhem("setreading $DEV dbg_regen_heute ".sprintf("%.1f",$regen_h));;\
  fhem("setreading $DEV dbg_regen_forecast ".sprintf("%.1f",$regen_fc));;\
  fhem("setreading $DEV dbg_regen_run ".sprintf("%.2f",$regen_run));;\
  fhem("setreading $DEV dbg_temp $temp");;\
  fhem("setreading $DEV dbg_wind_ms ".sprintf("%.1f",$wind_ms));;\
  fhem("setreading $DEV dbg_luftfeuchte $hum");;\
  fhem("setreading $DEV dbg_strahlung $rad_wm2");;\
  fhem("setreading $DEV dbg_tx $tx");;\
  fhem("setreading $DEV dbg_pv_now_w $pv_now_w");;\
  fhem("setreading $DEV dbg_pv_ok $pv_ok");;\
  fhem("setreading $DEV dbg_pv_gut $pv_gut");;\
  fhem("setreading $DEV dbg_pv_peak $pv_peak");;\
  fhem("setreading $DEV dbg_mm_sued ".sprintf("%.1f",$mm_sued));;\
  fhem("setreading $DEV dbg_mm_ost ".sprintf("%.1f",$mm_ost));;\
  fhem("setreading $DEV dbg_mm_nord ".sprintf("%.1f",$mm_nord));;\
  fhem("setreading $DEV dbg_soil_min ".sprintf("%.1f",$soil_min));;\
  fhem("setreading $DEV dbg_bedarf $bedarf");;\
  fhem("setreading $DEV dbg_dryness_frac ".sprintf("%.2f",$dryness_frac));;\
  fhem("setreading $DEV dbg_block $block");;\
  fhem("setreading $DEV dbg_block_grund $block_grund");;\
  fhem("setreading $DEV dbg_next_watering $next_str");;\
  fhem("setreading $DEV dbg_start $start");;\
  fhem("setreading $DEV dbg_reason $reason");;\
  fhem("setreading $DEV dbg_zisterne_leer $zisterne_leer");;\
  fhem("setreading $DEV dbg_neustart_block $neustart_block");;\
  fhem("setreading $DEV dauer_sued $dauer_sued");;\
  fhem("setreading $DEV dauer_ost $dauer_ost");;\
  fhem("setreading $DEV dauer_nord $dauer_nord");;\
\
  if($start)\
  {\
    my @zone_dev = ("Bewaesserung_Zone_2_Suedwest","Bewaesserung_Zone_4_Sued","Bewaesserung_Zone_3_Suedost","Bewaesserung_Zone_1_Nord");;\
    my @zone_dur = ($dauer_sued,$dauer_sued,$dauer_ost,$dauer_nord);;\
\
    my $rot = ReadingsNum($DEV,"rotate_idx",0) % 4;;\
\
    fhem("delete bew_at2");;\
    fhem("delete bew_at3");;\
    fhem("delete bew_at4");;\
    fhem("delete bew_at5");;\
    fhem("delete bew_at6");;\
    fhem("set Bewaesserung_Zone_1_Nord off");;\
    fhem("set Bewaesserung_Zone_2_Suedwest off");;\
    fhem("set Bewaesserung_Zone_3_Suedost off");;\
    fhem("set Bewaesserung_Zone_4_Sued off");;\
\
    fhem("set myShelly_Huette_Zisterne on 0");;\
\
    my $gesamt = $dauer_sued + $dauer_sued + $dauer_ost + $dauer_nord;;\
\
    my $first = $zone_dev[$rot % 4];;\
\
    fhem("setreading $DEV PumpState 1");;\
    fhem("setreading $DEV Bewaesserung_Aktiv 1");;\
    fhem("setreading $DEV Bewaesserung_Start $now_str");;\
    fhem("setreading $DEV gesamtDauer $gesamt");;\
    fhem("setreading $DEV aktuelleZone ".(($rot % 4)+1));;\
    fhem("setreading $DEV aktuelleZoneName $first");;\
\
    fhem("set $first on");;\
    fhem("setreading $DEV aktuelleZone ".(($rot % 4)+1));;\
    fhem("setreading $DEV aktuelleZoneName $first");;\
\
    my $acc = 0;;\
    my $atn = 2;;\
    for my $i (1..3)\
    {\
      my $pidx = ($rot + $i - 1) % 4;;\
      my $cidx = ($rot + $i) % 4;;\
      $acc += $zone_dur[$pidx];;\
      fhem(\
        "defmod bew_at".$atn.\
        " at ".\
        Bew_fmt_offset($acc).\
        " set ".$zone_dev[$pidx].\
        " off;;;;".\
        "set ".$zone_dev[$cidx].\
        " on;;;;".\
        "setreading DOIF_Bewaesserung aktuelleZone ".($cidx+1).";;;;".\
        "setreading DOIF_Bewaesserung aktuelleZoneName ".$zone_dev[$cidx]\
      );;\
      $atn++;;\
    }\
    my $lidx = ($rot + 3) % 4;;\
    $acc += $zone_dur[$lidx];;\
    fhem(\
      "defmod bew_at".$atn.\
      " at ".Bew_fmt_offset($acc).\
      " set ".$zone_dev[$lidx].\
      " off;;;;".\
      "set myShelly_Huette_Zisterne off 0;;;;".\
      "setreading DOIF_Bewaesserung PumpState 0;;;;".\
      "setreading DOIF_Bewaesserung Bewaesserung_Aktiv 0;;;;".\
      "setreading DOIF_Bewaesserung aktuelleZone 0;;;;".\
      "setreading DOIF_Bewaesserung aktuelleZoneName keine;;;;".\
      "{fhem('setreading DOIF_Bewaesserung letzteBewaesserung '.FmtDateTime(time()))};;;;".\
      "{fhem('setreading DOIF_Bewaesserung Bewaesserung_Ende '.FmtDateTime(time()))}"\
    );;\
    $atn++;;\
\
    fhem("defmod bew_at".$atn." at ".Bew_fmt_offset($acc+1)." deletereading DOIF_Bewaesserung dbg_action");;\
\
    fhem("setreading $DEV rotate_idx ".(($rot+1)%4));;\
    fhem("setreading $DEV lastWater $now_str");;\
    fhem("setreading $DEV last_dauer_sued $dauer_sued");;\
    fhem("setreading $DEV last_dauer_ost $dauer_ost");;\
    fhem("setreading $DEV last_dauer_nord $dauer_nord");;\
    fhem("setreading $DEV last_reason $reason");;\
\
    my $ns_sued = $soil_sued + ($mm_sued * $soil_index_pro_mm);;\
    my $ns_ost  = $soil_ost  + ($mm_ost  * $soil_index_pro_mm);;\
    my $ns_nord = $soil_nord + ($mm_nord * $soil_index_pro_mm);;\
\
    $ns_sued = $soil_index_cap if($ns_sued > $soil_index_cap);;\
    $ns_ost  = $soil_index_cap if($ns_ost  > $soil_index_cap);;\
    $ns_nord = $soil_index_cap if($ns_nord > $soil_index_cap);;\
\
    fhem("setreading $DEV SoilIndex_sued ".sprintf("%.1f",$ns_sued));;\
    fhem("setreading $DEV SoilIndex_ost  ".sprintf("%.1f",$ns_ost));;\
    fhem("setreading $DEV SoilIndex_nord ".sprintf("%.1f",$ns_nord));;\
    fhem("setreading $DEV dbg_action watering_started");;\
  }\
  else\
  {\
    fhem("setreading $DEV dbg_action no_watering");;\
  }\
})
setuuid DOIF_Bewaesserung 69f05aa5-f33f-0e4e-97e0-32b4c4c5bf28165e
attr DOIF_Bewaesserung comment Das DOIF laeuft alle 10 Minuten sowie zusaetzlich um 06:00, 12:00 und 18:00 Uhr.\
Bei jedem Lauf durchlaeuft es immer dieselben Schritte und entscheidet am Ende,\
ob eine Bewaesserung gestartet wird. Es gibt drei klimatische Sektoren (Sued, Ost,\
Nord) und vier physische Ventilzonen (Suedwest und Sued teilen sich die Sued-Dauer).\
\
### 1. Wetter und Verdunstung\
Aus den DWD-Vorhersagewerten der aktuellen Stunde (Globalstrahlung, Wind, Temperatur,\
Luftfeuchte) wird eine vereinfachte Referenz-Verdunstung in mm/Tag berechnet\
(reduzierte Penman-artige Formel, begrenzt auf 0.05 bis 8.0 mm/Tag). Dieser Basiswert\
wird je Sektor mit einem Lagefaktor skaliert: Sued trocknet am schnellsten (1.0),\
Ost mittel (0.7), Nord am langsamsten (0.45).\
\
### 2. Bodenfeuchte-Konto (Decay)\
Fuer jeden Sektor wird ein Feuchte-Index von 0 bis 100 gefuehrt. Pro Lauf wird nur\
die Verdunstung *seit dem letzten Lauf* abgezogen (Zeitdifferenz aus lastCalc, gekappt\
auf 0 bis 24 Stunden gegen Uhr- oder Ausfallspruenge) und der Regen desselben Intervalls\
gutgeschrieben. Verdunstung, Regen und Bewaesserung rechnen einheitlich mit dem Faktor\
soil_index_pro_mm (3.5 Punkte je mm), sodass 1 mm Verdunstung genauso viele Punkte\
abzieht, wie 1 mm Bewaesserung gutschreibt. Der Index wird auf 0 bis 100 begrenzt.\
\
### 3. Bedarfsstufe\
Der niedrigste der drei Sektor-Indizes bestimmt die Bedarfsstufe:\
kein Bedarf (>= 45), mittel (< 45), kritisch (< 30). Die Notfallschwelle liegt bei 15.\
\
### 4. Sperren\
Nicht gegossen wird bei frischem FHEM-Neustart (< 300 s), leerer Zisterne,\
nennenswertem Regen heute (> 3 mm) oder kraeftigem Regen in der 2-Tages-Vorhersage\
(> 8 mm). Greift eine Sperre, ist der Grund in dbg_block_grund hinterlegt.\
\
### 5. Startentscheidung (Prioritaetskette)\
Ist keine Sperre aktiv, wird die erste zutreffende Regel von oben verwendet:\
1. Notfall: Index unter 15, kein plausibler Regen, Readings nicht veraltet (< 144 h).\
2. Kritisch + PV: Bedarf kritisch und gute PV im Mittagsfenster.\
3. Kritisch + Timeout: Bedarf kritisch und letzte Bewaesserung >= 48 h her.\
4. PV-Support: mittlerer Bedarf, >= 24 h her, sehr gute PV im Mittagsfenster.\
5. Smart-Timeout: dynamische Mindestpause ueberschritten, PV im Mittagsfenster ok.\
Trifft keine Regel zu, bleibt es bei "kein Start";; bei sehr trockenem Boden mit\
veralteten Readings wird der Grund nur als Diagnose gesetzt, ohne die obigen\
Regeln zu blockieren (kein Deadlock mehr).\
\
### 6. Mengen und Ablauf\
Aus dem Defizit (Abstand zum Ziel 70 plus ein Verdunstungspuffer) wird je Sektor eine\
mm-Menge und daraus ueber Pumpenleistung und Flaeche eine Laufzeit berechnet\
(Minimum 3 min, Maxima 30/20/15 min). Bei Start wird die Zisternenpumpe aktiviert und\
die vier Zonen werden ueber gestaffelte at-Jobs (bew_at2 bis bew_at6) nacheinander\
geschaltet. Welche Zone beginnt, bestimmt rotate_idx: nach jeder Bewaesserung rueckt\
der Startpunkt um eine Zone weiter (0 Suedwest, 1 Sued, 2 Suedost, 3 Nord, dann wieder 0).\
Nach dem Durchlauf werden die Feuchte-Konten um die ausgebrachte Menge hochgesetzt und\
lastWater neu gestempelt.\
\
### Steuerung / interner DOIF-Status\
- state: aktueller DOIF-Befehlszweig (z. B. cmd_1)\
- mode: DOIF aktiv (enabled) oder deaktiviert (disabled)\
- cmd: Nummer des zuletzt ausgefuehrten Befehlszweigs\
- cmd_nr: identisch zur aktiven Befehlsnummer (DOIF-intern)\
- cmd_event: Event, das den aktuellen Zweig ausgeloest hat (z. B. timer_1)\
- eventCount: interner DOIF-Ereigniszaehler\
- timer_01_c01 bis timer_04_c01: die vier geplanten Triggerzeitpunkte (+10 min, 06/12/18 Uhr)\
\
### Funktionale Kern-Readings\
- SoilIndex_sued: Feuchte-Konto Sektor Sued (0-100)\
- SoilIndex_ost: Feuchte-Konto Sektor Ost (0-100)\
- SoilIndex_nord: Feuchte-Konto Sektor Nord (0-100)\
- lastWater: Zeitstempel der letzten tatsaechlichen Bewaesserung\
- lastCalc: Zeitstempel des letzten Decay-Laufs (Basis fuer das Intervall)\
- rotate_idx: Index der Startzone fuer den naechsten Durchlauf (0-3)\
- dauer_sued: aktuell berechnete Laufzeit Sued in Minuten\
- dauer_ost: aktuell berechnete Laufzeit Ost in Minuten\
- dauer_nord: aktuell berechnete Laufzeit Nord in Minuten\
- last_dauer_sued: Sued-Laufzeit der letzten Bewaesserung\
- last_dauer_ost: Ost-Laufzeit der letzten Bewaesserung\
- last_dauer_nord: Nord-Laufzeit der letzten Bewaesserung\
- last_reason: Ausloesegrund der letzten Bewaesserung\
\
### Debug: Zeit und Verdunstung\
- dbg_zeit: Zeitstempel des aktuellen Laufs\
- dbg_stunden_seit_watering: Stunden seit der letzten Bewaesserung\
- dbg_delta_h: Zeit seit dem letzten Decay-Lauf in Stunden (gekappt 0-24)\
- dbg_et_basis: Referenz-Verdunstung in mm/Tag (ungewichtet, nach Cap)\
- dbg_et_sued: gewichtete Verdunstung Sued in mm/Tag\
- dbg_et_ost: gewichtete Verdunstung Ost in mm/Tag\
- dbg_et_nord: gewichtete Verdunstung Nord in mm/Tag\
- dbg_evap_sued: Verdunstung Sued in diesem Lauf in mm\
- dbg_evap_ost: Verdunstung Ost in diesem Lauf in mm\
- dbg_evap_nord: Verdunstung Nord in diesem Lauf in mm\
\
### Debug: Regen\
- dbg_regen_heute: Regensumme heute (Vorhersage/Ist) in mm\
- dbg_regen_forecast: Regensumme der naechsten zwei Tage in mm\
- dbg_regen_run: Regen-Gutschrift in diesem Lauf in mm\
\
### Debug: Wetter-Rohwerte\
- dbg_temp: Lufttemperatur der aktuellen Stunde in Grad C\
- dbg_wind_ms: Windgeschwindigkeit in m/s\
- dbg_luftfeuchte: relative Luftfeuchte in Prozent\
- dbg_strahlung: Globalstrahlung der aktuellen Stunde\
- dbg_tx: vorhergesagte Tageshoechsttemperatur in Grad C\
\
### Debug: PV\
- dbg_pv_now_w: aktuelle PV-Leistung in Watt\
- dbg_pv_ok: PV ueber 500 W (1/0)\
- dbg_pv_gut: PV ueber 2000 W (1/0)\
- dbg_pv_peak: Mittagsfenster 10-16 Uhr aktiv (1/0)\
\
### Debug: Defizit und Mengen\
- dbg_deficit_sued: Wasserdefizit Sued in Indexpunkten\
- dbg_deficit_ost: Wasserdefizit Ost in Indexpunkten\
- dbg_deficit_nord: Wasserdefizit Nord in Indexpunkten\
- dbg_mm_sued: benoetigte Wassermenge Sued in mm\
- dbg_mm_ost: benoetigte Wassermenge Ost in mm\
- dbg_mm_nord: benoetigte Wassermenge Nord in mm\
- dbg_mm_pro_durchgang: Altwert/Restbestand (wird aktuell nicht mehr aktiv gesetzt)\
- dbg_et_puffer_sued: Verdunstungspuffer Sued in mm (Vorhalt fuers Defizit)\
- dbg_et_puffer_ost: Verdunstungspuffer Ost in mm\
- dbg_et_puffer_nord: Verdunstungspuffer Nord in mm\
\
### Debug: Entscheidung\
- dbg_soil_min: niedrigster der drei Sektor-Indizes (massgeblich)\
- dbg_bedarf: Bedarfsstufe 0 (kein) / 1 (mittel) / 2 (kritisch)\
- dbg_block: Sperre aktiv (1) oder nicht (0)\
- dbg_block_grund: Grund der Sperre (none, regen_heute, zisterne_leer, ...)\
- dbg_min_hours: dynamische Mindestpause bis zur naechsten Bewaesserung in Stunden\
- dbg_dry_score: Trockenheits-Score aus Index und Verdunstung\
- dbg_next_watering: geschaetzter naechster Bewaesserungstermin\
- dbg_start: Entscheidung gegossen ja (1) / nein (0)\
- dbg_reason: Ausloese- oder Nicht-Ausloesegrund im Klartext\
- dbg_action: watering_started oder no_watering\
- dbg_zisterne_leer: Status der Zisterne-leer-Erkennung (on/off)\
- dbg_neustart_block: FHEM-Neustart-Schutz aktiv (1/0)
attr DOIF_Bewaesserung do always
