define DOIF_PV_Werte_vergleichen DOIF (\
   [:01]\
)\
(\
{\
my ($sec,$min,$hour) = localtime(time());;\
\
my $last_hour = ReadingsNum("$SELF","last_hour_done",-1);;\
\
if($hour != $last_hour)\
{\
  fhem("setreading $SELF last_hour_done $hour");;\
\
  my $h_last = $hour - 1;;\
  $h_last = 23 if($h_last < 0);;\
\
  my $pv_real = ReadingsNum("HA_SDM630M_PV_Erzeugung","statEnergy_import__kWhHourLast",0);;\
\
  my $pv_forecast = ReadingsNum("DOIF_PV_forecast_Batterie_laden","today_".$hour."_pv",0);;\
\
  if($pv_forecast > 0.1)\
  {\
    my $diff = $pv_real - $pv_forecast;;\
\
    my $ratio = 0;;\
    $ratio = $pv_real / $pv_forecast if($pv_forecast > 0);;\
\
    fhem("setreading $SELF pv_real_$h_last ".sprintf("%.2f",$pv_real));;\
    fhem("setreading $SELF pv_fc_$h_last ".sprintf("%.2f",$pv_forecast));;\
    fhem("setreading $SELF pv_diff_$h_last ".sprintf("%.2f",$diff));;\
    fhem("setreading $SELF pv_ratio_$h_last ".sprintf("%.2f",$ratio));;\
  }\
}\
}\
)
