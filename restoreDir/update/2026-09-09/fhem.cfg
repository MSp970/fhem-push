\
Ausschalttemp_VD_bei_Heizbetrieb:HP_.* {\
  sprintf("%.1f",\
    ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0)\
    + ReadingsNum("LambdaWP","Ausschalthysterese_buffer",0)\
    + ReadingsNum("LambdaWP","PV_HK_Offset",0)\
  );;\
},\
\
Temp_diff_Ausschaltung_VD_bei_Heizbetrieb:HP_.* {\
  (ReadingsNum("LambdaWP","Ausschalttemp_VD_bei_Heizbetrieb",0)\
   - ReadingsNum("LambdaWP","BufferHighTemp",0)) > 0\
  ? sprintf("%.1f",\
      ReadingsNum("LambdaWP","Ausschalttemp_VD_bei_Heizbetrieb",0)\
      - ReadingsNum("LambdaWP","BufferHighTemp",0)\
    )\
  : 0\
},\
\
Einschalttemp_VD_bei_Heizbetrieb:HP_.* {\
  sprintf("%.1f",\
    ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0)\
        + ReadingsNum("LambdaWP","Einschalthysterese_buffer",0)\
    );;\
},\
\
Temp_diff_Einschaltung_VD_bei_Heizbetrieb:HP_.* {\
  (ReadingsNum("LambdaWP","BufferHighTemp",0)\
   - ReadingsNum("LambdaWP","Einschalttemp_VD_bei_Heizbetrieb",0)) > 0\
  ? sprintf("%.1f",\
      ReadingsNum("LambdaWP","BufferHighTemp",0)\
      - ReadingsNum("LambdaWP","Einschalttemp_VD_bei_Heizbetrieb",0)\
    )\
  : 0\
},\
\
Einschalttemp_VD_bei_DHW_Betrieb:HP_.* {\
  sprintf("%.1f",\
    ReadingsNum("LambdaWP","BoilerMaxTempSetpoint",0)\
    + ReadingsNum("LambdaWP","Einschalthysterese_DHW",0)\
    );;\
},\
\
