        }\
        else\
        {\
          fhem("setreading $DEV active_mode phase_unlock_pending");;\
          return;;\
        }\
      }\
    }\
\
    if(!$phase_lock)\
    {\
      my $PV_BACK_DELAY  = ReadingsNum("openWB_Garage_links_Control","pvBackDelay",60);;\
      my $PV_BACK_PUFFER = ReadingsNum("openWB_Garage_links_Control","pvBackPuffer",400);;\
      my $pv_back_timer  = ReadingsNum($DEV,"pv_back_timer",0);;\
\
      if($grid <= -$stopReserve && $einspeis > ($reserve + 1400 + $PV_BACK_PUFFER))\
      {\
        if($pv_back_timer == 0)\
        {\
          fhem("setreading $DEV pv_back_timer ".int($now));;\
          $pv_back_timer = $now;;\
        }\
        if(($now - $pv_back_timer) >= $PV_BACK_DELAY)\
        {\
          if($send_ok)\
          {\
            fhem("set openWB_Garage_links_Control chargemode pv") unless $manualStopLockActive;;\
            fhem("setreading $DEV last_send_time ".int($now));;\
            fhem("setreading $DEV pv_stop_timer 0");;\
            fhem("setreading $DEV pv_back_timer 0");;\
            fhem("setreading $DEV active_mode instant_to_pv");;\
            return;;\
          }\
        }\
        else\
        {\
          fhem("setreading $DEV active_mode instant_to_pv_wait");;\
        }\
      }\
      else\
      {\
        if($pv_back_timer != 0)\
        {\
          fhem("setreading $DEV pv_back_timer 0");;\
        }\
      }\
    }\
\
    my $surplus_real = $einspeis + $power;;\
    fhem("setreading $DEV surplus_real ".int($surplus_real));;\
    if($cur_int <= $minA && $surplus_real < $stopReserve)\
    {\
      if($phases == 3)\
      {\
        if($pv_stop_timer == 0)\
        {\
          fhem("setreading $DEV pv_stop_timer ".int($now));;\
          $pv_stop_timer = $now;;\
        }\
        if(($now - $pv_stop_timer) >= 15)\
        {\
          if($send_ok)\
          {\
            fhem("set openWB_Garage_links_Control chargemode stop");;\
            fhem("setreading $DEV last_send_time ".int($now));;\
            fhem("setreading $DEV cmd_stop_sent ".int($now));;\
            fhem("setreading $DEV stop_reason low_surplus_3p");;\
            fhem("setreading $DEV pv_stop_timer ".int($now));;\
            fhem("setreading $DEV phase_lock 0");;\
            fhem("setreading $DEV phase_lock_since 0");;\
            fhem("setreading $DEV active_mode stop_then_pv");;\
          }\
        }\
        else\
        {\
          fhem("setreading $DEV active_mode low_surplus_3p_wait");;\
        }\
      }\
      else\
      {\
        if($pv_stop_timer == 0)\
        {\
          fhem("setreading $DEV pv_stop_timer ".int($now));;\
          $pv_stop_timer = $now;;\
        }\
        if(($now - $pv_stop_timer) >= 10)\
        {\
          if($send_ok)\
          {\
            fhem("set openWB_Garage_links_Control chargemode stop");;\
            fhem("setreading $DEV last_send_time ".int($now));;\
            fhem("setreading $DEV cmd_stop_sent ".int($now));;\
            fhem("setreading $DEV stop_reason low_surplus_1p");;\
            fhem("setreading $DEV pv_stop_timer 0");;\
            fhem("setreading $DEV phase_lock 0");;\
            fhem("setreading $DEV phase_lock_since 0");;\
            fhem("setreading $DEV active_mode low_surplus_1p_stop");;\
          }\
        }\
        else\
        {\
          fhem("setreading $DEV active_mode low_surplus_1p_wait");;\
        }\
      }\
      return;;\
    }\
\
    fhem("setreading $DEV pv_stop_timer 0");;\
\
    my $volatile_mode = ($vol_zuschlag > 0 || $evu_bezug_erkannt) ? 1 : 0;;\
    fhem("setreading $DEV volatile_mode $volatile_mode");;\
\
    my $bezug_hold_active = ($bezug_peak > 0) ? 1 : 0;;\
    fhem("setreading $DEV bezug_hold_active $bezug_hold_active");;\
\
    my $UP_GAIN_EFF;;\
    my $UP_STEP_MAX_EFF;;\
    my $UP_DB_EFF;;\
    my $up_interval_eff;;\
\
    if($bezug_hold_active)\
    {\
      $UP_GAIN_EFF     = ReadingsNum("openWB_Garage_links_Control","bezugUpGain",0.4);;\
      $UP_STEP_MAX_EFF = ReadingsNum("openWB_Garage_links_Control","bezugUpStepMax",2);;\
      $UP_DB_EFF       = ReadingsNum("openWB_Garage_links_Control","bezugUpDeadbandA",0.4);;\
      $up_interval_eff = ReadingsNum("openWB_Garage_links_Control","bezugUpIntervalSec",4);;\
    }\
    elsif($volatile_mode)\
    {\
      $UP_GAIN_EFF     = $UP_GAIN * 0.5;;\
      $UP_STEP_MAX_EFF = int($UP_STEP_MAX / 2 + 0.5);;\
      $UP_STEP_MAX_EFF = 1 if($UP_STEP_MAX_EFF < 1);;\
      $UP_DB_EFF       = $UP_DB * 2;;\
      $up_interval_eff = ReadingsNum("openWB_Garage_links_Control","upMinIntervalVolSec",6);;\
    }\
    else\
    {\
      $UP_GAIN_EFF     = $UP_GAIN;;\
      $UP_STEP_MAX_EFF = $UP_STEP_MAX;;\
      $UP_DB_EFF       = $UP_DB;;\
      $up_interval_eff = ReadingsNum("openWB_Garage_links_Control","upMinIntervalSec",2);;\
    }\
\
    my $DN_STEP_MAX_EFF = $volatile_mode ? ($DN_STEP_MAX + 4) : $DN_STEP_MAX;;\
    my $DN_DB_EFF       = $volatile_mode ? ($DN_DB * 0.5) : $DN_DB;;\
\
    my $send_ok_up = ($now - $last_send) >= $up_interval_eff;;\
\
    my $grid_set = $GRID_ALLOW - $reserve_dyn;;\
    my $err_w    = $grid - $grid_set;;\
    my $delta_a  = -$err_w / $phasePower;;\
\
    my $step    = 0;;\
    my $use_send = $send_ok;;\
\
    if($delta_a > $UP_DB_EFF)\
    {\
      $step = POSIX::floor($delta_a * $UP_GAIN_EFF);;\
      $step = 1 if($step < 1);;\
      $step = $UP_STEP_MAX_EFF if($step > $UP_STEP_MAX_EFF);;\
      $use_send = $send_ok_up;;\
    }\
    elsif($delta_a < -$DN_DB_EFF)\
    {\
      $step = POSIX::ceil($delta_a);;\
      $step = -$DN_STEP_MAX_EFF if($step < -$DN_STEP_MAX_EFF);;\
      $step = -1 if($step > -1);;\
      $use_send = $send_ok_dn;;\
    }\
\
    $target_int = $cur_int + $step;;\
    $target_int = $minA if($target_int < $minA);;\
    $target_int = $maxA if($target_int > $maxA);;\
\
    my $change = abs($target_int - $cur_int);;\
    if($change >= 1 && $use_send)\
    {\
      fhem("set openWB_Garage_links_Control chargecurrent $target_int");;\
      fhem("setreading $DEV last_send_time ".int($now));;\
      fhem("setreading $DEV last_sent_current $target_int");;\
    }\
    fhem("setreading $DEV targetA $target_int");;\
    fhem("setreading $DEV step ".int($step));;\
    fhem("setreading $DEV delta_a ".sprintf("%.2f",$delta_a));;\
    fhem("setreading $DEV active_mode ".($phase_lock ? "phase_lock_control" : "instant_control"));;\
    return;;\
  }\
\
  if(ReadingsVal($DEV,"active_mode","") eq "stop_then_pv" && $cm eq "stop")\
  {\
    my $stop_since = ReadingsNum($DEV,"pv_stop_timer",0);;\
    if(($now - $stop_since) >= 15 && $send_ok)\
    {\
      fhem("set openWB_Garage_links_Control chargemode pv") unless $manualStopLockActive;;\
      fhem("setreading $DEV last_send_time ".int($now));;\
      fhem("setreading $DEV pv_stop_timer 0");;\
      fhem("setreading $DEV active_mode pv_restart");;\
    }\
    else\
    {\
      fhem("setreading $DEV active_mode stop_then_pv");;\
    }\
    return;;\
  }\
\
  fhem("setreading $DEV active_mode unknown_state");;\
  return;;\
}\
)
