  my $val = ReadingsNum("GoodWe_Garage_Haus_West_5877", "Akku_Mode", -1);;\
  return "Akku disconnected" if $val == 0;;\
  return "Standby"           if $val == 1;;\
  return "Discharging"       if $val == 2;;\
  return "Charging"          if $val == 3;;\
  return "Waiting for charge" if $val == 4;;\
  return "Waiting for discharge" if $val == 5;;\
  return "Unknown ($val)";;\
},\
