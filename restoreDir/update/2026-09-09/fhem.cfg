define DOIF_Batterie_Ladestrom_Max DOIF (\
  [DOIF_GoodWe_simple:p1] or\
  [DOIF_GoodWe_simple:p2] or\
  [+00:02:59]\
)\
(\
{\
  my $now = time();;\
\
  my $p5877 = ReadingsNum("DOIF_GoodWe_simple","p1",0);;\
  my $p5876 = ReadingsNum("DOIF_GoodWe_simple","p2",0);;\
  \
 my $pv_active = ReadingsNum("DOIF_GoodWe_simple","pv_active",0);;\
  if(!$pv_active)\
  {\
    $p5877 = 0;;\
    $p5876 = 0;;\
  }\
\
  $p5877 = 0 if(abs($p5877) < 40);;\
  $p5876 = 0 if(abs($p5876) < 20);;\
\
  my $u5877 = ReadingsNum("GoodWe_Garage_Haus_West_5877","Battery1_Voltage",52);;\
  my $u5876 = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Battery1_Voltage",52);;\
\
  my $i5877 = 0;;\
  my $i5876 = 0;;\
\
  if($p5877 > 0 && $u5877 > 0)\
  {\
    $i5877 = $p5877 / $u5877;;\
    $i5877 = int($i5877 * 10) / 10;;\
    $i5877 += 0.4;;\
  }\
\
  if($p5876 > 0 && $u5876 > 0)\
  {\
    $i5876 = $p5876 / $u5876;;\
    $i5876 = int($i5876 * 10) / 10;;\
    $i5876 += 0.4;;\
  }\
\
  my $last5877 = ReadingsNum("$SELF","last_i5877",-999);;\
  my $last5876 = ReadingsNum("$SELF","last_i5876",-999);;\
\
  my $last_send = ReadingsNum("$SELF","last_exec",0);;\
\
  if(\
       ($now - $last_send >= 15)\
    && (\
         abs($i5877 - $last5877) >= 0.1\
      || abs($i5876 - $last5876) >= 0.1\
    )\
  )\
  {\
    fhem("set GoodWe_Garage_Haus_West_5877 Batterie_Ladestrom_Max $i5877");;\
    fhem("set GoodWe_Haus_Ost_Mitte_5876 Batterie_Ladestrom_Max $i5876");;\
\
    fhem("setreading $SELF last_exec $now");;\
    fhem("setreading $SELF last_i5877 $i5877");;\
    fhem("setreading $SELF last_i5876 $i5876");;\
  }\
\
  fhem("setreading $SELF DOIF_GoodWe_simple_p1 $p5877");;\
  fhem("setreading $SELF DOIF_GoodWe_simple_p2 $p5876");;\
\
  fhem("setreading $SELF Batterie_Ladestrom_Max5877 $i5877");;\
  fhem("setreading $SELF Batterie_Ladestrom_Max5876 $i5876");;\
\
  return;;\
}\
)
