###############################################################################
# 4) SNAPSHOT ANTEILE  -  taeglich 23:58:00
#    Summiert deine vorhandene PV/Bat/EVU-Zuordnung der 5 Verbrauchszaehler
#    (stat0Energie_*_kWhMonth/Year) und bildet die Prozentanteile.
#      Last = PV + Bat + EVU ;  Anteil = jeweils / Last * 100
#      Autarkie = (PV + Bat) / Last * 100
###############################################################################

define Anteil_Snapshot at *23:58:00 {\
my @z = (["HA_SDM630M_Allgemein","Allg"],["HA_SDM630M_Wohnung_EG","EG"],["HA_SDM630M_Wohnung_OG","OG"],["HA_SDM630M_Heatpump","HP"],["HA_SDM630M_Wohnung_OG","WB"]);;\
my ($pvM,$batM,$evuM,$pvY,$batY,$evuY)=(0,0,0,0,0,0);;\
foreach my $e (@z){\
my ($dev,$p)=@$e;;\
$pvM  += ReadingsNum($dev,"stat0Energie_${p}_PV_kWhMonth",0);;\
$batM += ReadingsNum($dev,"stat0Energie_${p}_Batterie_kWhMonth",0);;\
$evuM += ReadingsNum($dev,"stat0Energie_${p}_EVU_kWhMonth",0);;\
$pvY  += ReadingsNum($dev,"stat0Energie_${p}_PV_kWhYear",0);;\
$batY += ReadingsNum($dev,"stat0Energie_${p}_Batterie_kWhYear",0);;\
$evuY += ReadingsNum($dev,"stat0Energie_${p}_EVU_kWhYear",0);;\
}\
my $lastM=$pvM+$batM+$evuM;;\
my $lastY=$pvY+$batY+$evuY;;\
if($lastM>0.01){\
fhem(sprintf("setreading Anteil_Verbrauch PV_Monat %.1f",100.0*$pvM/$lastM));;\
fhem(sprintf("setreading Anteil_Verbrauch Bat_Monat %.1f",100.0*$batM/$lastM));;\
fhem(sprintf("setreading Anteil_Verbrauch EVU_Monat %.1f",100.0*$evuM/$lastM));;\
fhem(sprintf("setreading Anteil_Verbrauch Autarkie_Monat %.1f",100.0*($pvM+$batM)/$lastM));;\
fhem(sprintf("setreading Anteil_Verbrauch Verbrauch_Monat %.1f",$lastM));;\
}\
if($lastY>0.01){\
fhem(sprintf("setreading Anteil_Verbrauch PV_Jahr %.1f",100.0*$pvY/$lastY));;\
fhem(sprintf("setreading Anteil_Verbrauch Bat_Jahr %.1f",100.0*$batY/$lastY));;\
fhem(sprintf("setreading Anteil_Verbrauch EVU_Jahr %.1f",100.0*$evuY/$lastY));;\
fhem(sprintf("setreading Anteil_Verbrauch Autarkie_Jahr %.1f",100.0*($pvY+$batY)/$lastY));;\
fhem(sprintf("setreading Anteil_Verbrauch Verbrauch_Jahr %.1f",$lastY));;\
}\
}
