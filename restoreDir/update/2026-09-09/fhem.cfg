define Lambda_Wiedereinschaltsperre DOIF (\
([10s_20s_timer:tick])\
)\
(\
{\
  my $DEV = "Lambda_Wiedereinschaltsperre";;\
\
  fhem("setreading $DEV dbg_Verdichter_aktiv ".ReadingsVal("LambdaWP","Verdichter_aktiv",""));;\
  fhem("setreading $DEV dbg_OperatingState ".ReadingsVal("LambdaWP","HP_OperatingState",""));;\
  fhem("setreading $DEV dbg_BufferHighTemp ".ReadingsNum("LambdaWP","BufferHighTemp",0));;\
  fhem("setreading $DEV dbg_TargetFlow ".ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0));;\
  fhem("setreading $DEV dbg_FlowTemp ".ReadingsNum("LambdaWP","HC_FlowTemp",0));;\
  fhem("setreading $DEV dbg_VD_aus_min ".ReadingsNum("WP_Timer","VD_aus_min",0));;\
  fhem("setreading $DEV dbg_VD_dyn_pause ".ReadingsNum("WP_Timer","VD_dyn_pause",0));;\
\
  my $target_minus6 =\
    ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0) - 6.0;;\
\
  fhem("setreading $DEV dbg_TargetMinus6 $target_minus6");;\
\
  fhem("setreading $DEV dbg_BufferMinusTarget ".\
       (\
         ReadingsNum("LambdaWP","BufferHighTemp",0) -\
         ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0)\
       ));;\
\
  fhem("setreading $DEV dbg_FlowMinusTarget ".\
       (\
         ReadingsNum("LambdaWP","HC_FlowTemp",0) -\
         ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0)\
       ));;\
\
  my $block_bedingung =\
  (\
    ReadingsVal("LambdaWP","Verdichter_aktiv","") eq "off" &&\
    ReadingsVal("LambdaWP","HP_OperatingState","") ne "DHW" &&\
    ReadingsNum("LambdaWP","BufferHighTemp",0) >\
      ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0) &&\
    ReadingsNum("LambdaWP","HC_FlowTemp",0) > 33.0\
  ) ? 1 : 0;;\
\
  fhem("setreading $DEV dbg_block_bedingung $block_bedingung");;\
\
  my $freigabe_bedingung =\
  (\
    (\
      ReadingsVal("LambdaWP","HP_OperatingState","") eq "OFF" ||\
      ReadingsVal("LambdaWP","HP_OperatingState","") eq "STBY-FROST" ||\
      ReadingsVal("LambdaWP","HP_OperatingState","") eq "FROST" ||\
      ReadingsVal("LambdaWP","HP_OperatingState","") eq "STBY"\
    )\
    &&\
    ReadingsNum("LambdaWP","HC_FlowTemp",0) < $target_minus6\
    &&\
    ReadingsNum("LambdaWP","BufferHighTemp",0) < $target_minus6\
    &&\
    ReadingsNum("WP_Timer","VD_aus_min",0) >\
      ReadingsNum("WP_Timer","VD_dyn_pause",0)\
  ) ? 1 : 0;;\
\
  fhem("setreading $DEV dbg_freigabe_bedingung $freigabe_bedingung");;\
\
  if($block_bedingung)\
  {\
    fhem("set Blockierkriterium_VD_erreicht on");;\
    fhem("set LambdaWP Buffer_MaxTempSetpoint 25.0");;\
  }\
  elsif($freigabe_bedingung)\
  {\
    fhem("set Blockierkriterium_VD_erreicht off");;\
    fhem("set LambdaWP Buffer_MaxTempSetpoint 60.0");;\
  }\
}\
)
