fhem(sprintf("setreading PV_Ertrag_GoodWe_5877 Tag %.1f",$gw77d));;\
fhem(sprintf("setreading PV_Ertrag_GoodWe_5877 Monat %.1f",$gw77m));;\
fhem(sprintf("setreading PV_Ertrag_GoodWe_5877 Jahr %.0f",$gw77y));;\
my @dy = (["Huette_NW","PV_Huette_NW_1600W"],["Huette_NO","PV_Huette_NO_1600W"],["Huette_SW","PV_Huette_SW_1600W"],["Huette_SO","PV_Huette_SO_800W"],["Gaube_Nord","Gaube_Nord"],["Gaube_Sued_Mitte","PV_Gaube_Sued_Mitte1600W"],["Gaube_Sued_Ost","PV_Gaube_Sued_Ost1600W"]);;\
