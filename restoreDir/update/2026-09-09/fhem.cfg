define di_fhempy_watchdog DOIF ([+00:01:00])\
(\
{\
    my $DEV = "di_fhempy_watchdog";;\
    my $now = time();;\
\
    my $STUCK_INSTALL_MIN       = 25;;\
    my $STUCK_OFFLINE_MIN       = 30;;\
    my $SOFT_RETRY_INTERVAL_MIN = 15;;\
    my $HARD_RESTART_AFTER_ATTEMPTS = 3;;\
    my $HARD_RESTART_COOLDOWN_H = 24;;\
\
    my $state   = ReadingsVal("fhempy_local","state","");;\
    my $stateTs = ReadingsTimestamp("fhempy_local","state","1970-01-01 00:00:00");;\
    my $stateAge = $now - time_str2num($stateTs);;\
    my $installStuck = ($state =~ /^Installing/ && $stateAge > $STUCK_INSTALL_MIN*60) ? 1 : 0;;\
\
    my $offlineStuck = 0;;\
    my $offlineDev = "";;\
    foreach my $d (devspec2array("TYPE=fhempy"))\
    {\
        my $st = ReadingsVal($d,"state","");;\
        my $ts = ReadingsTimestamp($d,"state","1970-01-01 00:00:00");;\
        my $age = $now - time_str2num($ts);;\
        if($st =~ /offline/i && $age > $STUCK_OFFLINE_MIN*60)\
        {\
            $offlineStuck = 1;;\
            $offlineDev = $d;;\
        }\
    }\
\
    my $unhealthy = ($installStuck || $offlineStuck) ? 1 : 0;;\
\
    fhem("setreading $DEV wd_last_check ".int($now));;\
    fhem("setreading $DEV wd_status ".($unhealthy ? "unhealthy" : "ok"));;\
\
    if($unhealthy)\
    {\
        my $firstSeen = ReadingsNum($DEV,"wd_first_seen",0);;\
        if($firstSeen == 0)\
        {\
            fhem("setreading $DEV wd_first_seen ".int($now));;\
            fhem("setreading $DEV wd_attempts 0");;\
            $firstSeen = $now;;\
        }\
        my $attempts = ReadingsNum($DEV,"wd_attempts",0);;\
        my $lastAttempt = ReadingsNum($DEV,"wd_last_attempt_t",0);;\
\
        if(($now - $lastAttempt) > $SOFT_RETRY_INTERVAL_MIN*60)\
        {\
            $attempts += 1;;\
            fhem("set fhempy_local restart");;\
            fhem("setreading $DEV wd_attempts $attempts");;\
            fhem("setreading $DEV wd_last_attempt_t ".int($now));;\
            my $reason = $installStuck ? "stuck installing" : "offline: $offlineDev";;\
            fhem("setreading $DEV wd_last_action ".TimeNow()." soft restart #$attempts ($reason)");;\
\
            my $lastHard = ReadingsNum($DEV,"wd_last_hard_restart_t",0);;\
            if($attempts >= $HARD_RESTART_AFTER_ATTEMPTS && ($now - $lastHard) > $HARD_RESTART_COOLDOWN_H*3600)\
            {\
                fhem("setreading $DEV wd_last_action ".TimeNow()." HARD RESTART triggered ($reason)");;\
                fhem("setreading $DEV wd_last_hard_restart_t ".int($now));;\
                fhem("setreading $DEV wd_attempts 0");;\
                fhem("setreading $DEV wd_first_seen 0");;\
                fhem("shutdown restart");;\
            }\
        }\
    }\
    else\
    {\
        my $firstSeen = ReadingsNum($DEV,"wd_first_seen",0);;\
        if($firstSeen > 0)\
        {\
            fhem("setreading $DEV wd_last_action ".TimeNow()." recovered");;\
        }\
        fhem("setreading $DEV wd_first_seen 0");;\
        fhem("setreading $DEV wd_attempts 0");;\
    }\
}\
)
setuuid di_fhempy_watchdog 6a8d3796-f33f-0e4e-5aec-e758725991525266
attr di_fhempy_watchdog alias fhempy Watchdog
attr di_fhempy_watchdog comment Ueberwacht fhempy_local (Python-Binding). Erkennt zwei Fehlerbilder: (1) state bleibt >25min bei "Installing..." haengen, (2) irgendein TYPE=fhempy Geraet meldet >30min "offline". Bei Erkennung: alle 15min "set fhempy_local restart" (sanft). Nach 3 erfolglosen Versuchen (~1h) automatischer kompletter FHEM-Neustart (shutdown restart), max 1x pro 24h. Readings: wd_status (ok/unhealthy), wd_last_check, wd_last_action, wd_attempts, wd_first_seen, wd_last_attempt_t, wd_last_hard_restart_t. Erstellt 2026-08-25 nach fhempy-Ausfall vom 23.-25.08.
attr di_fhempy_watchdog room 00 Tobi,Services,fhempy
attr di_fhempy_watchdog stateFormat wd_status (Versuche: wd_attempts)
