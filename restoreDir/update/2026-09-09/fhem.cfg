     (($L76 < 20000 || $L77 < 20000)\
      ? "begrenzt" : "offen"));;\
fhem("setreading $DEV last_write ".int($now));;\
fhem("setreading $DEV last_write_hms ".\
     strftime("%d.%m. %H:%M:%S",localtime($now)));;\
}
setuuid di_EinspeiseLimit_Refresh 6a58cc8d-f33f-0e4e-e84f-2c85c9cd03ef4718
attr di_EinspeiseLimit_Refresh do always
attr di_EinspeiseLimit_Refresh room 01 PV
define di_PV_Jahresbilanz DOIF ([+01:00])\
({\
  my $sj = 26500;;\
  my $ej = 24000;;\
  my $ist = ReadingsNum("HA_SDM630M_PV_Erzeugung","Erz_PV_Energie_kWh_year",0);;\
  my @nl = localtime;;\
  my $cy = $nl[5] + 1900;;\
  my $zae = ReadingsNum("HA_SDM630M_Nergie","Energy_export__kWh",0);;\
  my $sy = ReadingsNum("di_PV_Jahresbilanz","einsp_start_jahr",0);;\
  my $zs = ReadingsNum("di_PV_Jahresbilanz","einsp_zaehler_start_jahr",0);;\
\
  ## Jahreswechsel-Automatik (selbstkorrigierend, ohne Zaehler zu zerstoeren)\
  if ($sy > 0 && $sy != $cy && $zae > 0) {\
    fhem("setreading di_PV_Jahresbilanz einsp_start_jahr $cy");;\
    fhem("setreading di_PV_Jahresbilanz einsp_zaehler_start_jahr $zae");;\
    $zs = $zae;;\
  }\
  elsif ($sy <= 0) {\
    fhem("setreading di_PV_Jahresbilanz einsp_start_jahr $cy");;\
  }\
\
  ## Einspeisung seit Jahresanfang aus absolutem Zaehler\
  my $eist = $zae - $zs;;\
  $eist = 0 if ($eist < 0);;\
\
  ## Saisonale Monatsverteilung (Sued/45 Grad), Soll-Anteil bis heute\
  my @p = (3, 5, 8.5, 11, 12.5, 12.5, 12.5, 11.5, 9.5, 7, 4, 3);;\
  my @lt = localtime;;\
  my $d = $lt[3];;\
  my $m = $lt[4] + 1;;\
  my $y = $lt[5] + 1900;;\
  my @dim = (31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31);;\
  $dim[1] = 29 if ($y % 4 == 0 && ($y % 100 != 0 || $y % 400 == 0));;\
  my $cum = 0;;\
  $cum += $p[$_] for (0 .. $m - 2);;\
  my $ant = ($cum + $p[$m - 1] * $d / $dim[$m - 1]) / 100;;\
\
  ## Erzeugung\
  my $soll = $sj * $ant;;\
  my $hr   = $ant > 0 ? $ist / $ant : 0;;\
\
  ## Einspeisung\
  my $esoll = $ej * $ant;;\
  my $ehr   = $ant > 0 ? $eist / $ant : 0;;\
\
  ## Ausgleichs-Prognose: wann holt die Soll-Kurve den Ist-Wert wieder ein\
  my $eabw = $eist - $esoll;;\
  my $ausgl_txt;;\
  my $ausgl_tage = 0;;\
  if ($eabw <= 0) {\
    $ausgl_txt  = "bereits_im_Plan";;\
    $ausgl_tage = 0;;\
  }\
  else {\
    my $ziel_ant = $ej > 0 ? $eist / $ej : 99;;\
    if ($ziel_ant >= 1) {\
      $ausgl_txt  = "erst_naechstes_Jahr";;\
      $ausgl_tage = -1;;\
    }\
    else {\
      my $dd = $d;;\
      my $mm = $m;;\
      my $yy = $y;;\
      my $tage = 0;;\
      my $found = 0;;\
      for (my $i = 0;; ;; $i++) {\
        my @di = (31, ($yy % 4 == 0 && ($yy % 100 != 0 || $yy % 400 == 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31);;\
        my $c2 = 0;;\
        $c2 += $p[$_] for (0 .. $mm - 2);;\
        my $a2 = ($c2 + $p[$mm - 1] * $dd / $di[$mm - 1]) / 100;;\
        if ($a2 >= $ziel_ant) { $found = 1;; last;; }\
        $dd++;;\
        $tage++;;\
        if ($dd > $di[$mm - 1]) { $dd = 1;; $mm++;; if ($mm > 12) { $mm = 1;; $yy++;; } }\
        if ($i > 800) { last;; }\
      }\
      if ($found) {\
        $ausgl_tage = $tage;;\
        my $ts = time() + $tage * 86400;;\
        $ausgl_txt = FmtDateTime($ts);;\
        $ausgl_txt =~ s/ .*//;;\
      }\
      else {\
        $ausgl_txt  = "erst_naechstes_Jahr";;\
        $ausgl_tage = -1;;\
      }\
    }\
  }\
\
  ## Readings schreiben\
  my $h = $defs{"di_PV_Jahresbilanz"};;\
  readingsBeginUpdate($h);;\
  readingsBulkUpdate($h, "ist_kwh_erz_PV_Energie_akt_Jahr",              sprintf("%.0f", $ist));;\
  readingsBulkUpdate($h, "soll_bis_heute_kwh_theor_erz_PV_E_bei_26500pa",sprintf("%.0f", $soll));;\
  readingsBulkUpdate($h, "ist_prozent_jahressoll_bez_auf_26500kWh",      sprintf("%.1f", $ist / $sj * 100));;\
  readingsBulkUpdate($h, "soll_prozent_erz_E_bis_heute_bez_auf_26500pa", sprintf("%.1f", $ant * 100));;\
  readingsBulkUpdate($h, "rest_soll_kwh_bis_JE_bis_26500",               sprintf("%.0f", $sj - $soll));;\
  readingsBulkUpdate($h, "hochrechnung_jahr_kwh_max_Gesamt_PV_E_bis_JE", sprintf("%.0f", $hr));;\
  readingsBulkUpdate($h, "hochrechnung_rest_kwh_max_verbl_PV_E_bis_JE",  sprintf("%.0f", $hr - $ist));;\
  readingsBulkUpdate($h, "performance_prozent_erz_E_bez_auf_26500kWh",   sprintf("%.1f", $hr / $sj * 100));;\
  readingsBulkUpdate($h, "tats_einsp_ist_kwh_seit_YTD",                  sprintf("%.0f", $eist));;\
  readingsBulkUpdate($h, "einsp_soll_bis_heute_kwh_bez_auf_26500kWh",    sprintf("%.0f", $esoll));;\
  readingsBulkUpdate($h, "einsp_abweichung_zuviel_Einspeisung_kwh",      sprintf("%.0f", $eist - $esoll));;\
  readingsBulkUpdate($h, "einsp_hochrechnung_jahr_kwh_bis_JE",           sprintf("%.0f", $ehr));;\
  readingsBulkUpdate($h, "einsp_prozent_jahressoll_bez_auf_26500kWh",    sprintf("%.1f", $eist / $ej * 100));;\
  readingsBulkUpdate($h, "einsp_ausgleich_datum",      $ausgl_txt);;\
  readingsBulkUpdate($h, "einsp_ausgleich_tage",       $ausgl_tage);;\
  readingsEndUpdate($h, 1);;\
})
setuuid di_PV_Jahresbilanz 6a58d5b9-f33f-0e4e-9886-d7f6eecb9d983626
attr di_PV_Jahresbilanz comment Der DOIF berechnet stündlich eine Jahresbilanz für PV-Erzeugung und Netzeinspeisung, in folgenden Schritten:\
\
Jahreswechsel-Behandlung: Beim ersten Lauf überhaupt wird das aktuelle Jahr als Referenz gespeichert. Ändert sich das Jahr (Neujahr) und liegt bereits ein gültiger Zählerstand vor, wird automatisch ein neuer Referenzpunkt (Jahr + aktueller Zählerstand) gesetzt – selbstkorrigierend, ohne den fortlaufenden Zähler selbst anzutasten.\
\
Einspeisung seit Jahresbeginn: Differenz aus aktuellem Zählerstand und dem zu Jahresbeginn gemerkten Stand. Negative Werte (z. B. durch Zählerreset) werden auf 0 abgefangen.\
\
Saisonale Sollkurve: Eine fest hinterlegte prozentuale Monatsverteilung (passend zur Süd/45°-Ausrichtung der Anlage) wird bis zum aktuellen Tag aufsummiert, wobei der laufende Monat taggenau linear interpoliert wird. Schaltjahre werden bei der Bestimmung der Monatslängen berücksichtigt. Daraus ergibt sich ein "Soll-Anteil des Jahres, der bis heute erreicht sein sollte".\
\
Soll- und Hochrechnungswerte: Für Erzeugung und Einspeisung wird jeweils ein Jahresziel hinterlegt. Multipliziert mit dem Soll-Anteil ergibt das den Sollwert bis heute. Der Ist-Wert geteilt durch den Soll-Anteil ergibt eine lineare Jahresendprognose (Hochrechnung).\
\
Ausgleichsprognose (nur Einspeisung): Liegt die Ist-Einspeisung bereits über dem Soll, wird ermittelt, wann die Sollkurve den aktuellen Ist-Anteil wieder "einholt". Dazu simuliert eine Schleife Tag für Tag vorwärts (inkl. Monats-/Jahreswechsel und Schaltjahrlogik), bis der kumulierte Soll-Anteil den Zielwert erreicht. Ausgabe: Datum + Anzahl Tage.\
Edge Cases: Ist ≤ Soll → sofort "im Plan";; würde der Zielanteil erst über 100 % liegen (d.h. erst im Folgejahr erreichbar) → Sonderstatus statt Datum;; die Simulationsschleife hat eine harte Obergrenze an Iterationen als Notbremse, falls kein Treffer gefunden wird.\
\
**Aktuell befüllte Readings (aus dem laufenden DEF):**\
\
- ist_kwh_erz_PV_Energie_akt_Jahr — Ist-Erzeugung des laufenden Jahres in kWh\
- soll_bis_heute_kwh_theor_erz_PV_E_bei_26500pa — Soll-Erzeugung bis heute, bezogen auf das 26.500-kWh-Jahresziel\
- ist_prozent_jahressoll_bez_auf_26500kWh — Ist-Erzeugung in % des 26.500-kWh-Jahresziels\
- soll_prozent_erz_E_bis_heute_bez_auf_26500pa — Soll-Anteil des Jahres in %, der laut Saisonkurve bis heute erreicht sein sollte\
- rest_soll_kwh_bis_JE_bis_26500 — verbleibende Soll-Erzeugung bis Jahresende (26.500-kWh-Ziel minus Soll bis heute)\
- hochrechnung_jahr_kwh_max_Gesamt_PV_E_bis_JE — Jahresendprognose der Erzeugung, linear aus Ist ÷ Soll-Anteil hochgerechnet\
- hochrechnung_rest_kwh_max_verbl_PV_E_bis_JE — laut Hochrechnung noch zu erwartende Erzeugung bis Jahresende\
- performance_prozent_erz_E_bez_auf_26500kWh — Hochrechnung in % des 26.500-kWh-Ziels (Anlagenperformance)\
- tats_einsp_ist_kwh_seit_YTD — Ist-Einspeisung seit Jahresanfang in kWh\
- einsp_soll_bis_heute_kwh_bez_auf_26500kWh — Soll-Einspeisung bis heute, bezogen auf das Einspeise-Jahresziel\
- einsp_abweichung_zuviel_Einspeisung_kwh — Abweichung Ist minus Soll bei der Einspeisung (Überschuss/Defizit)\
- einsp_hochrechnung_jahr_kwh_bis_JE — Jahresendprognose der Einspeisung\
- einsp_prozent_jahressoll_bez_auf_26500kWh — Ist-Einspeisung in % des Einspeise-Jahresziels\
- einsp_ausgleich_datum — Datum, an dem die Sollkurve die aktuelle Einspeisungs-Überschreitung wieder einholt\
- einsp_ausgleich_tage — Anzahl Tage bis zu diesem Ausgleich\
\
**Intern gesetzt (per setreading, nicht im Bulk-Update):**\
\
- einsp_start_jahr — Referenzjahr für die Jahresanfangs-Zählerstandsmessung\
- einsp_zaehler_start_jahr — absoluter Zählerstand zu Jahresbeginn (Basis für die YTD-Einspeisung)\

