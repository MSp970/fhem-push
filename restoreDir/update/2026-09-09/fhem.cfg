define Lambda_VD_slope DOIF (\
([10s_20s_timer:tick]) and\
(\
[LambdaWP:BufferHighTemp] or\
[LambdaWP:HP_OperatingState] or\
[LambdaWP:Verdichter_aktiv]\
)\
)\
(\
{\
  my $vd    = ReadingsVal("LambdaWP","Verdichter_aktiv","off");;\
  my $state = ReadingsVal("LambdaWP","HP_OperatingState","");;\
  my $t_now = time();;\
\
  my $cycle = ReadingsNum("$SELF","VD_cycle_active",0);;\
  my $t_ref = ReadingsNum("$SELF","VD_ref_time",0);;\
  my $bt_ref = ReadingsNum("$SELF","VD_ref_buffer",0);;\
\
  my $defrost_active = ReadingsNum("$SELF","VD_defrost_active",0);;\
  my $defrost_start  = ReadingsNum("$SELF","VD_defrost_start",0);;\
  my $defrost_sum    = ReadingsNum("$SELF","VD_defrost_sum",0);;\
\
  my $bt_now = ReadingsNum("LambdaWP","BufferHighTemp",0);;\
  \
  my $last_state = ReadingsVal("$SELF","VD_last_state","");;\
\
  if(\
    $vd eq "on" &&\
    (\
      $cycle == 0 ||\
      ($last_state ne "CENTRAL_HEATING" && $state eq "CENTRAL_HEATING")\
    )\
  ) {\
    fhem("setreading $SELF VD_ref_time $t_now");;\
    fhem("setreading $SELF VD_ref_buffer $bt_now");;\
    fhem("setreading $SELF VD_cycle_active 1");;\
    fhem("setreading $SELF VD_defrost_sum 0");;\
    fhem("setreading $SELF VD_last_start $t_now");;\
    $t_ref = $t_now;;\
    $bt_ref = $bt_now;;\
    $cycle = 1;;\
    $defrost_sum = 0;;\
  }\
\
  if($vd ne "on" && $cycle == 1) {\
    if($defrost_active == 1) {\
      $defrost_sum += ($t_now - $defrost_start);;\
      fhem("setreading $SELF VD_defrost_sum $defrost_sum");;\
      fhem("setreading $SELF VD_defrost_active 0");;\
    }\
    fhem("setreading $SELF VD_cycle_active 0");;\
    fhem("setreading $SELF VD_last_stop $t_now");;\
  }\
\
  if($cycle == 1) {\
    if($state eq "DEFROST" && $defrost_active == 0) {\
      fhem("setreading $SELF VD_defrost_active 1");;\
      fhem("setreading $SELF VD_defrost_start $t_now");;\
      $defrost_active = 1;;\
      $defrost_start = $t_now;;\
    }\
\
    if($state ne "DEFROST" && $defrost_active == 1) {\
      $defrost_sum += ($t_now - $defrost_start);;\
      fhem("setreading $SELF VD_defrost_sum $defrost_sum");;\
      fhem("setreading $SELF VD_defrost_active 0");;\
      $defrost_active = 0;;\
    }\
  }\
\
  my $runtime_sec_raw = ($t_ref > 0) ? ($t_now - $t_ref) : 0;;\
  my $runtime_sec = $runtime_sec_raw - $defrost_sum;;\
  $runtime_sec = 0 if($runtime_sec < 0);;\
\
  my $runtime_min = $runtime_sec / 60;;\
\
  my $deltaT = $bt_now - $bt_ref;;\
\
  my $slope = ($runtime_min > 0) ? ($deltaT / $runtime_min) : 0;;\
\
  my $slope_avg = ReadingsNum("$SELF","VD_slope_avg",0);;\
  my $alpha = 0.2;;\
  $slope_avg = ($slope_avg == 0) ? $slope : ($alpha * $slope + (1-$alpha) * $slope_avg);;\
\
  my $delta_avg = ReadingsNum("$SELF","VD_delta_avg",0);;\
  $delta_avg = ($delta_avg == 0) ? $deltaT : ($alpha * $deltaT + (1-$alpha) * $delta_avg);;\
\
  fhem("setreading $SELF VD_dbg_vd $vd");;\
  fhem("setreading $SELF VD_dbg_state $state");;\
  fhem("setreading $SELF VD_dbg_cycle $cycle");;\
  fhem("setreading $SELF VD_dbg_t_ref $t_ref");;\
  fhem("setreading $SELF VD_dbg_t_now $t_now");;\
  fhem("setreading $SELF VD_dbg_runtime_raw $runtime_sec_raw");;\
  fhem("setreading $SELF VD_dbg_defrost_sum $defrost_sum");;\
  fhem("setreading $SELF VD_dbg_runtime_eff $runtime_sec");;\
  fhem("setreading $SELF VD_dbg_bt_ref $bt_ref");;\
  fhem("setreading $SELF VD_dbg_bt_now $bt_now");;\
  fhem("setreading $SELF VD_dbg_deltaT $deltaT");;\
  fhem("setreading $SELF VD_dbg_slope ".sprintf("%.4f",$slope));;\
  fhem("setreading $SELF VD_dbg_slope_avg ".sprintf("%.4f",$slope_avg));;\
  fhem("setreading $SELF VD_dbg_delta_avg ".sprintf("%.2f",$delta_avg));;\
\
  fhem("setreading $SELF VD_last_state $state");;\
\
  return unless ($vd eq "on");;\
  return unless ($cycle == 1);;\
  return unless ($state ne "DEFROST");;\
  return unless ($t_ref > 0);;\
  return unless ($runtime_min >= 1);;\
  return if ($bt_ref == 0);;\
  return if (abs($deltaT) > 20);;\
\
  fhem("setreading $SELF VD_runtime ".sprintf("%.2f",$runtime_min));;\
  fhem("setreading $SELF VD_runtime_sec $runtime_sec");;\
  fhem("setreading $SELF VD_slope ".sprintf("%.4f",$slope));;\
  fhem("setreading $SELF VD_slope_avg ".sprintf("%.4f",$slope_avg));;\
  fhem("setreading $SELF VD_delta_t ".sprintf("%.1f",$deltaT));;\
  fhem("setreading $SELF VD_delta_avg ".sprintf("%.1f",$delta_avg));;\
}\
)
