define Lambda_PV_Manipulation DOIF (\
  [PV_30s_timer:tick]\
)\
(\
{\
  my $mode = ReadingsVal("PV_Fake_Mode","state","real");;\
\
  my $grid = ReadingsNum(\
    "HA_SDM630M_Nergie",\
    "Power_Sum__W1",\
    0\
  );;\
\
  my $pv = ReadingsNum(\
    "HA_SDM630M_Nergie",\
    "Theor_Einspeiseleistung",\
    0\
  );;\
\
  my $now = time();;\
\
  my $pulse_active = (($now % 60) < 20) ? 1 : 0;;\
\
  my $lastVal = ReadingsNum(\
    "Lambda_PV_Manipulation",\
    "lastVal",\
    -999999\
  );;\
\
  my $lastTime = ReadingsNum(\
    "Lambda_PV_Manipulation",\
    "lastTime",\
    0\
  );;\
\
  my $forceUpdate = ($now - $lastTime >= 120);;\
\
  my $fake = 0;;\
\
  my $limit_bezug       = 5600;;\
  my $limit_einspeisung = 21600;;\
\
  if ($mode eq "einspeisung_fake") {\
\
    my $einspeisung = abs($pv);;\
\
    $einspeisung = $limit_einspeisung\
      if ($einspeisung > $limit_einspeisung);;\
\
    $fake = -$einspeisung;;\
\
  } elsif ($mode eq "bezug_fake") {\
\
    my $bezug   = abs($grid);;\
    my $real_pv = -$grid;;\
\
    if ($bezug < 100 && $real_pv > 500) {\
      $bezug = $real_pv;;\
    }\
\
    $bezug = $limit_bezug\
      if ($bezug > $limit_bezug);;\
\
    $fake = $bezug;;\
\
  } else {\
    return;;\
  }\
\
  my $modbusVal = ($fake < 0)\
    ? 65536 - abs($fake)\
    : int($fake);;\
\
  if (\
    $pulse_active\
    && $pv > 100\
    && $modbusVal >= 0\
    && $modbusVal < 65000\
  ) {\
    $modbusVal += 100;;\
  }\
\
  return if (\
    defined $lastVal\
    && abs($modbusVal - $lastVal) < 20\
    && !$pulse_active\
    && !$forceUpdate\
  );;\
\
  fhem("set LambdaWP 0emActualPower $modbusVal");;\
\
  fhem("setreading PV_Fake_Mode Power_an_WP $fake");;\
  fhem("setreading Lambda_PV_Manipulation lastVal $modbusVal");;\
  fhem("setreading Lambda_PV_Manipulation lastTime $now");;\
  fhem("setreading Lambda_PV_Manipulation evu_uebergabe $grid");;\
}\
)\

