      }\
\
      if($pv_jahr >= 0)\
      {\
        $pv_jahr = sprintf("%.1f",$pv_jahr);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Jahr_${prefix}_PV", $pv_jahr, 1);;\
      }\
\
      if($evu_jahr >= 0)\
      {\
        $evu_jahr = sprintf("%.1f",$evu_jahr);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Jahr_${prefix}_EVU", $evu_jahr, 1);;\
      }\
\
      if($bat_jahr >= 0)\
