$vol_zuschlag_roh = $vol_zuschlag_roh * $VOL_RESERVE_FACTOR;;\
\
my $vol_zuschlag = ReadingsNum($DEV,"vol_zuschlag",0);;\
my $vol_low_since = ReadingsNum($DEV,"vol_low_since",0);;\
\
if($vol_zuschlag_roh > $vol_zuschlag)\
{\
$vol_zuschlag = $vol_zuschlag_roh;;\
fhem("setreading $DEV vol_low_since 0");;\
$vol_low_since = 0;;\
}\
elsif($vol_zuschlag_roh <= 0)\
{\
if($vol_low_since == 0)\
{\
fhem("setreading $DEV vol_low_since ".int($now));;\
