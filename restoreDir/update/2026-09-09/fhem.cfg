}\
$vol_low_since = 0;;\
}\
\
fhem("setreading $DEV vol_zuschlag ".sprintf("%.0f",$vol_zuschlag));;\
\
my $reserve_dyn = $reserve + $vol_zuschlag;;\
fhem("setreading $DEV reserve_dyn ".sprintf("%.0f",$reserve_dyn));;\
\
my $BEZUG_FAKTOR = ReadingsNum("openWB_Garage_rechts_Control","bezugSpikeFaktor",2.0);;\
my $BEZUG_ZIEL_RESERVE = ReadingsNum("openWB_Garage_rechts_Control","bezugZielReserve",2000);;\
