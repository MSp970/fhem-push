define incrDailyCounter at *00:00:00 {\
my $name="dailyCounter_Zaehlereinbau_vor_Tagen";;\
use Time::Local;;\
my $ed=ReadingsVal($name,"einbau_datum","2025-01-16");;\
my ($y,$m,$d)=split(/-/,$ed);;\
my $einbau=timelocal(0,0,0,$d,$m-1,$y);;\
my @n=localtime();;\
my $today=timelocal(0,0,0,$n[3],$n[4],$n[5]);;\
my $tage=int(($today-$einbau)/86400);;\
my $ende25=timelocal(0,0,0,31,11,2025);;\
my $tage25=int(($ende25-$einbau)/86400);;\
fhem("setreading $name Zaehlereinbau_vor_Tagen $tage");;\
fhem("setreading $name Zaehlereinbau_vor_Tagen_zum_31_12_25 $tage25");;\
}
