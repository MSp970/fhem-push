setuuid Beschattung_Config 6a4358ac-f33f-0e4e-dd95-a5367e9e0fa49c9b
attr Beschattung_Config alias Beschattung Automatik
attr Beschattung_Config cmdIcon Auto:rc_GREEN ManuellSperre:rc_RED
attr Beschattung_Config comment Die Automatik fährt die Markise abhängig von Sonnenstand, Temperatur und Wetter. Sie prüft bei jedem Trigger\
eine feste Prioritätskette und stoppt beim ersten Treffer:\
Modus≠Automatik → Wind → Regen (+Nachlauf) → Winter → Abend → Sonne → sonst AUS.\
Sicherheitsgründe (Wind/Regen) und Saisonsperren (Winter) haben Vorrang und fahren die Markise ein (pct 0).\
Im Sonne-Zweig wird beschattet (pct ZielPosition), wenn alle Bedingungen gleichzeitig passen: Sonne hoch genug,\
im Azimutfenster, außen warm genug, innen warm genug und nicht zu bewölkt. Wind und Bewölkung haben eine\
Hysterese (Ein-/Aus-Schwelle), damit die Markise bei Grenzwerten nicht ständig hin- und herfährt. Alle Mess- und\
Statuswerte werden zur Anzeige ins Dummy zurückgeschrieben.\
Parameter (Wertebereich → Wirkung)\
Steuerung\
\
Modus Automatik/Aus → Aus = Hand, keinerlei Fahrbefehle, Status MANUELL.\
ZielPosition 0–100 % → Beschattungsposition bei Sonne (höher = weiter ausgefahren).\
AbendPosition 0–100 % → Position unterhalb SunAltEnde (meist 0 = eingefahren).\
\
Sonnenstand\
\
SunAltStart 0–90° → Mindest-Sonnenhöhe für Beschattung;; darunter keine Sonne.\
SunAltEnde 0–90° → Sonnenhöhe, ab der „Abend" gilt;; sollte deutlich kleiner als SunAltStart sein (~5–8°).\
AzimutStart 0–360° → linke Grenze des Sonnenfensters (Himmelsrichtung, ab der beschattet wird).\
AzimutEnde 0–360° → rechte Grenze;; Beschattung nur zwischen Start und Ende.\
\
Temperatur\
\
AussenTempMin °C → erst ab dieser Außentemperatur beschatten.\
InnenTempStart °C → erst ab dieser Innentemperatur beschatten.\
\
Wind (Hysterese)\
\
WindEin km/h → ab hier Markise einfahren + sperren (Schutz).\
WindAus km/h → erst unter diesem Wert Sperre wieder lösen;; muss kleiner als WindEin sein.\
\
Regen\
\
RegenEin mm → ab dieser Regenmenge einfahren + sperren.\
RegenNachlauf min → wie lange nach Regenende noch gesperrt bleibt.\
\
Bewölkung (Hysterese)\
\
WolkenEin 0–100 % → über diesem Wert keine Beschattung starten (zu bedeckt).\
WolkenAus 0–100 % → bei aktiver Beschattung erst über diesem höheren Wert abbrechen.\
\
Saison\
\
Winterbetrieb on/off → Hauptschalter Wintersperre (off = ignoriert).\
WinterMonatVon / WinterMonatBis 1–12 → Sperrzeitraum;; Von>Bis = über Jahreswechsel (z. B. 10→4).\
\
Noch ohne Funktion im DOIF (Readings vorhanden, aber nicht ausgewertet): Nachfuehrung, MorgenPosition,\
AbendVerzoegerung, SperrzeitManuell, FahrPause.\
\
Komfort / Verhalten\
\
Nachfuehrung on/off → Komfortbeschattung (Sonne-Zweig) an/aus;; off lässt Wind-, Regen- und Wintersperre\
weiter aktiv. Unterschied zu Modus=Aus, das die komplette Automatik abschaltet.\
MorgenPosition 0–100 % → Position bei tiefer Sonne im Osten (Azimut < 180°, unter SunAltEnde);; Status MORGEN.\
Meist 0.\
AbendVerzoegerung min → Wartezeit am Abend, bevor von der aktuellen Position auf AbendPosition eingefahren wird;;\
verhindert vorschnelles Einfahren bei kurzem Höhen-Unterschreiten. Gilt nur abends, nicht morgens.\
SperrzeitManuell min → nach manuellem Verstellen der Markise pausiert die Automatik so lange (Status HANDMODE);;\
Wind und Regen überstimmen die Sperre. 0 = aus.\
FahrPause min → Mindestabstand zwischen zwei Komfort-Fahrbefehlen (Entprellung);; Sicherheitsfahrten\
(Wind/Regen/Winter) ignorieren die Pause. 0 = aus.\
\
Dazu die internen Status-Readings, die der DOIF selbst pflegt (nicht einstellen, nur zur Diagnose):\
\
AbendZeit → Unix-Zeit, seit der die Abendbedingung anliegt (für AbendVerzoegerung);; 0 = inaktiv.\
ManuellZeit → Unix-Zeit des letzten erkannten Handeingriffs (für SperrzeitManuell).\
LetzteFahrt → Unix-Zeit des letzten Fahrbefehls (für FahrPause).\
LetzteSollPos → zuletzt kommandierte Position;; Abweichung der echten pct davon löst die Handerkennung aus.\

