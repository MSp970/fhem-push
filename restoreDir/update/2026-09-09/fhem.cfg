        $bat_jahr = sprintf("%.1f",$bat_jahr);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Jahr_${prefix}_Batterie", $bat_jahr, 1);;\
      }\
    }\
  }\
\
  my $tag_einsp = ReadingsNum(\
    "HA_SDM630M_Nergie",\
    "statSald_Einspeiseenergie_kWhDayLast",\
    -1\
  );;\
\
  my $tag_bezug = ReadingsNum(\
