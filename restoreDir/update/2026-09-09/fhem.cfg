0PV_Anteil_proz:.* {\
  my $pv    = ReadingsNum("HA_SDM630M_Nergie","PV_DC_Deye_Leistung_A9_total",0);;;;\
  my $bat   = ReadingsNum("HA_SDM630M_Nergie","Batterie_Leistung_A9_total",0);;;;\
  my $netz  = ReadingsNum("HA_SDM630M_Nergie","Power_Sum__W",0);;;;\
\
  $pv  = 0 if $pv < 0;;;;\
  my $bat_ent  = $bat  > 0 ? $bat  : 0;;;;\
  my $netz_bez = $netz > 0 ? $netz : 0;;;;\
\
  my $verbrauch = $netz_bez + $bat_ent + $pv;;;;\
  return 0 if $verbrauch <= 0;;;;\
\
  my $pv_used = $pv;;;;\
  $pv_used = $verbrauch if $pv > $verbrauch;;;;\
\
  sprintf("%.1f",100*$pv_used/$verbrauch)\
},\
0Batterie_Anteil_proz:.* {\
  my $pv    = ReadingsNum("HA_SDM630M_Nergie","PV_DC_Deye_Leistung_A9_total",0);;;;\
  my $bat   = ReadingsNum("HA_SDM630M_Nergie","Batterie_Leistung_A9_total",0);;;;\
  my $netz  = ReadingsNum("HA_SDM630M_Nergie","Power_Sum__W",0);;;;\
\
  $pv = 0 if $pv < 0;;;;\
  my $bat_ent  = $bat  > 0 ? $bat  : 0;;;;\
  my $netz_bez = $netz > 0 ? $netz : 0;;;;\
\
  my $pv_used = $pv + ($netz < 0 ? $netz : 0);;;;\
  $pv_used = 0 if $pv_used < 0;;;;\
\
  my $verbrauch = $pv_used + $bat_ent + $netz_bez;;;;\
  return 0 if $verbrauch <= 0;;;;\
\
  sprintf("%.1f",100*$bat_ent/$verbrauch)\
},\
