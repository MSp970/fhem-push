define Garagentuer_gross dummy
setuuid Garagentuer_gross 6a87fb82-f33f-0e4e-c0d3-2d86be9189236b2e
attr Garagentuer_gross devStateIcon offen:fts_door_open@red geschlossen:fts_door@green
