define di_BresserWetter_Watchdog DOIF ([+00:01] or [BresserWetter:batterie_aussensensor] or [BresserWetter:verbindung_aussensensor])\
({\
  my $now = time();;\
  my $mail_intervall = 6*3600;;\
  my $entprell = 5*60;;\
  my $offline_grenze = 10*60;;\
  my $bat = ReadingsNum("BresserWetter","batterie_aussensensor",1);;\
  my $con = ReadingsNum("BresserWetter","verbindung_aussensensor",1);;\
  my $age = ReadingsAge("BresserWetter","lastUpdate",99999);;\
  my @checks = (\
    { key=>"Batterie",   fail=>($bat==0),               msg=>"Aussensensor-Batterie schwach (7-in-1). Bitte AA-Batterien tauschen (empfohlen: Lithium)." },\
    { key=>"Funk",       fail=>($con==0),               msg=>"Funkverbindung Konsole <-> 7-in-1 Aussensensor verloren." },\
    { key=>"Konsole",    fail=>($age>$offline_grenze),  msg=>"Konsole meldet sich nicht mehr. Kein Push seit ".int($age/60)." Minuten." }\
  );;\
  foreach my $c (@checks) {\
    my $key = $c->{key};;\
    my $first_seen = ReadingsNum("di_BresserWetter_Watchdog","fail_${key}_seit",0);;\
    my $last_mail  = ReadingsNum("di_BresserWetter_Watchdog","mail_${key}_zuletzt",0);;\
    my $state_prev = ReadingsVal("di_BresserWetter_Watchdog","status_${key}","OK");;\
    if($c->{fail}) {\
      if($first_seen == 0) {\
        fhem("setreading di_BresserWetter_Watchdog fail_${key}_seit $now");;\
        next;;\
      }\
      if(($now-$first_seen) < $entprell) { next;; }\
      if(($now-$last_mail) < $mail_intervall && $state_prev eq "ALARM") { next;; }\
      SendMail("[FHEM Wetter] ALARM $key", $c->{msg}."\n\nZeitpunkt: ".FmtDateTime($now)."\nZustand seit: ".FmtDateTime($first_seen));;\
      SendWhatsApp("[FHEM ALARM $key] ".$c->{msg});;\
      fhem("setreading di_BresserWetter_Watchdog mail_${key}_zuletzt $now");;\
      fhem("setreading di_BresserWetter_Watchdog status_${key} ALARM");;\
    } else {\
      if($state_prev eq "ALARM") {\
        SendMail("[FHEM Wetter] Entwarnung $key", "$key wieder normal.\n\nZeitpunkt: ".FmtDateTime($now));;\
        SendWhatsApp("[FHEM Entwarnung $key] wieder normal");;\
      }\
      fhem("setreading di_BresserWetter_Watchdog fail_${key}_seit 0");;\
      fhem("setreading di_BresserWetter_Watchdog status_${key} OK");;\
    }\
  }\
  fhem("setreading di_BresserWetter_Watchdog lastCheck ".FmtDateTime($now));;\
})
