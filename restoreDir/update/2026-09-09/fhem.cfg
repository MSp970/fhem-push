define di_Energie_Archiv DOIF ([00:01:00])\
{\
  my @t = localtime(time());;\
\
  my $jahr   = $t[5] + 1900;;\
  my $monat  = $t[4] + 1;;\
  my $tag    = $t[3];;\
\
  my @devs = (\
    "HA_SDM630M_Allgemein",\
    "HA_SDM630M_Heatpump",\
    "HA_SDM630M_PV_Erzeugung",\
    "HA_SDM630M_Wohnung_EG",\
    "HA_SDM630M_Wohnung_OG",\
    "OpenWB"\
  );;\
\
  foreach my $dev (@devs)\
  {\
    my $name = $dev;;\
    $name =~ s/HA_SDM630M_//g;;\
\
    my $tag_wert = ReadingsNum(\
      $dev,\
      "statEnergy_import__kWhDayLast",\
      -1\
    );;\
\
    if($tag_wert >= 0)\
    {\
      $tag_wert = sprintf("%.1f",$tag_wert);;\
\
      readingsSingleUpdate(\
        $defs{"Energie_Archiv"},\
        "Tag_${name}",\
        $tag_wert,\
        1\
      );;\
    }\
\
    if($tag == 1)\
    {\
      my $monat_wert = ReadingsNum(\
        $dev,\
        "statEnergy_import__kWhMonthLast",\
        -1\
      );;\
\
      if($monat_wert >= 0)\
      {\
        $monat_wert = sprintf("%.1f",$monat_wert);;\
\
        readingsSingleUpdate(\
          $defs{"Energie_Archiv"},\
          "Monat_${name}",\
          $monat_wert,\
          1\
        );;\
      }\
    }\
\
    if($monat == 1 && $tag == 1)\
    {\
      my $jahr_wert = ReadingsNum(\
        $dev,\
        "statEnergy_import__kWhYearLast",\
        -1\
      );;\
\
      if($jahr_wert >= 0)\
      {\
        $jahr_wert = sprintf("%.1f",$jahr_wert);;\
\
        readingsSingleUpdate(\
          $defs{"Energie_Archiv"},\
          "Jahr_${name}",\
          $jahr_wert,\
          1\
        );;\
      }\
    }\
  }\
\
  my @cfgs = (\
    "HA_SDM630M_Allgemein|Allg|stat0Energie_Allg_PV_kWh|stat0Energie_Allg_EVU_kWh|stat0Energie_Allg_Batterie_kWh",\
    "HA_SDM630M_Heatpump|HP|stat0Energie_HP_PV_kWh|stat0Energie_HP_EVU_kWh|stat0Energie_HP_Batterie_kWh",\
    "HA_SDM630M_Wohnung_EG|EG|stat0Energie_EG_PV_kWh|stat0Energie_EG_EVU_kWh|stat0Energie_EG_Batterie_kWh",\
    "HA_SDM630M_Wohnung_OG|OG|stat0Energie_OG_PV_kWh|stat0Energie_OG_EVU_kWh|stat0Energie_OG_Batterie_kWh",\
    "OpenWB|OpenWB_OG|stat0Energie_OpenWB_OG_PV_kWh|stat0Energie_OpenWB_OG_EVU_kWh|stat0Energie_OpenWB_OG_Batterie_kWh"\
  );;\
\
  foreach my $cfg (@cfgs)\
  {\
    my ($dev,$prefix,$pv_base,$evu_base,$bat_base) =\
      split(/\|/,$cfg);;\
\
    my $pv_tag = ReadingsNum(\
      $dev,\
      $pv_base."DayLast",\
      -1\
    );;\
\
    my $evu_tag = ReadingsNum(\
      $dev,\
      $evu_base."DayLast",\
      -1\
    );;\
\
    my $bat_tag = ReadingsNum(\
      $dev,\
      $bat_base."DayLast",\
      -1\
    );;\
\
    if($pv_tag >= 0)\
    {\
      $pv_tag = sprintf("%.1f",$pv_tag);;\
\
      readingsSingleUpdate(\
        $defs{"Energie_Archiv"},\
        "Tag_${prefix}_PV",\
        $pv_tag,\
        1\
      );;\
    }\
\
    if($evu_tag >= 0)\
    {\
      $evu_tag = sprintf("%.1f",$evu_tag);;\
\
      readingsSingleUpdate(\
        $defs{"Energie_Archiv"},\
        "Tag_${prefix}_EVU",\
        $evu_tag,\
        1\
      );;\
    }\
\
    if($bat_tag >= 0)\
    {\
      $bat_tag = sprintf("%.1f",$bat_tag);;\
\
      readingsSingleUpdate(\
        $defs{"Energie_Archiv"},\
        "Tag_${prefix}_Batterie",\
        $bat_tag,\
        1\
      );;\
    }\
\
    if($tag == 1)\
    {\
      my $pv_monat = ReadingsNum($dev, $pv_base."MonthLast", -1);;\
      my $evu_monat = ReadingsNum($dev, $evu_base."MonthLast", -1);;\
      my $bat_monat = ReadingsNum($dev, $bat_base."MonthLast", -1);;\
\
      if($pv_monat >= 0 && $evu_monat >= 0 && $bat_monat >= 0)\
      {\
        my $total_monat = $pv_monat + $evu_monat + $bat_monat;;\
        if($total_monat > 0)\
        {\
          my $p_pv  = sprintf("%.1f", ($pv_monat / $total_monat) * 100);;\
          my $p_evu = sprintf("%.1f", ($evu_monat / $total_monat) * 100);;\
          my $p_bat = sprintf("%.1f", ($bat_monat / $total_monat) * 100);;\
\
          readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_PV_Prozent", $p_pv, 1);;\
          readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_EVU_Prozent", $p_evu, 1);;\
          readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_Batterie_Prozent", $p_bat, 1);;\
        }\
      }\
\
      if($pv_monat >= 0)\
      {\
        $pv_monat = sprintf("%.1f",$pv_monat);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_PV", $pv_monat, 1);;\
      }\
\
      if($evu_monat >= 0)\
      {\
        $evu_monat = sprintf("%.1f",$evu_monat);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_EVU", $evu_monat, 1);;\
      }\
\
      if($bat_monat >= 0)\
      {\
        $bat_monat = sprintf("%.1f",$bat_monat);;\
        readingsSingleUpdate($defs{"Energie_Archiv"}, "Monat_${prefix}_Batterie", $bat_monat, 1);;\
      }\
    }\
\
    if($monat == 1 && $tag == 1)\
    {\
      my $pv_jahr = ReadingsNum($dev, $pv_base."YearLast", -1);;\
      my $evu_jahr = ReadingsNum($dev, $evu_base."YearLast", -1);;\
      my $bat_jahr = ReadingsNum($dev, $bat_base."YearLast", -1);;\
\
      if($pv_jahr >= 0 && $evu_jahr >= 0 && $bat_jahr >= 0)\
