define di_EinspeiseLimit_Refresh DOIF ([+01:00:00] or [EMS_Control:maxFeedInW5876]\
or [EMS_Control:maxFeedInW5877])\
{\
use POSIX qw(strftime);;\
my $now = time();;\
my $DEV = "di_EinspeiseLimit_Refresh";;\
my $L76 = ReadingsNum("EMS_Control",\
                      "maxFeedInW5876",20000);;\
my $L77 = ReadingsNum("EMS_Control",\
                      "maxFeedInW5877",20000);;\
