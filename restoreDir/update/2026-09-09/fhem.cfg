attr DOIF_Zonenabh_Bew_Sued_25min room Bewässerung
define DHW_Steuerung DOIF (\
  [LambdaWP:HP_OperatingState] or\
  [LambdaWP:Verdichter_aktiv] or\
  [LambdaWP:BoilerHighTemp] or\
  [LambdaWP:BoilerLowTemp] or\
  [LambdaWP:BufferHighTemp] or\
  [LambdaWP:HP_akt_elektr_Leistungsaufnahme] or\
  [HA_SDM630M_Nergie:Einspeiseleistung] or\
  [+00:01:00]\
)\
(\
{\
  my $BOILER_DEFAULT  = 44.0;;\
  my $BUFFER_DEFAULT  = 60.0;;\
  my $BOOST_DHW       = 54.0;;\
  my $NOTFALL_SET     = 35.0;;\
  my $BOOST_DAUER_S   = 1800;;\
\
  my $PV_BOOST_SET    = 58.0;;\
  my $BOILERLOW_RESET = 52.0;;\
\
  my $BOILERHIGH_VOLL  = 57.0;;\
  my $BOILERHIGH_START = 55.0;;\
\
  my $PV_SCHWELLE_W   = 2500;;\
  my $PV_HALTE_W      = 1200;;\
  my $PV_AUS_W        = 500;;\
  my $PV_STABIL_S     = 300;;\
\
  my $PV_MITTAG_W     = 2000;;\
  my $PV_WEG_S        = 1200;;\
\
  my $PV_FENSTER_START = 12;;\
  my $PV_FENSTER_ENDE  = 16;;\
\
  my $FRUEHJAHR_MONAT = 5;;\
  my $HERBST_MONAT    = 9;;\
\
  my $MITTAG_START    = 13;;\
  my $MITTAG_ENDE     = 15;;\
\
  my $DHW_START_TEMP  = 42.0;;\
\
  my @t = localtime(time());;\
\
  my $jahr   = $t[5] + 1900;;\
  my $monat  = $t[4] + 1;;\
  my $tag    = $t[3];;\
  my $stunde = $t[2];;\
\
  my $heute = sprintf(\
    "%04d-%02d-%02d",\
    $jahr,\
    $monat,\
    $tag\
  );;\
\
  my $heizperiode = ($monat >= 10 || $monat <= 4);;\
\
  my $mode       = ReadingsVal("LambdaWP","HP_OperatingState","STBY");;\
  my $vd         = ReadingsVal("LambdaWP","Verdichter_aktiv","off");;\
\
  my $boilerHigh = ReadingsNum("LambdaWP","BoilerHighTemp",0);;\
  my $boilerLow  = ReadingsNum("LambdaWP","BoilerLowTemp",0);;\
  my $boilerSet  = ReadingsNum(\
    "LambdaWP",\
    "BoilerMaxTempSetpoint",\
    $BOILER_DEFAULT\
  );;\
\
  my $bufferHigh = ReadingsNum("LambdaWP","BufferHighTemp",0);;\
  my $bufferSet  = ReadingsNum(\
    "LambdaWP",\
    "Buffer_MaxTempSetpoint",\
    $BUFFER_DEFAULT\
  );;\
\
  my $hcSoll = ReadingsNum(\
    "LambdaWP",\
    "HC_Target_temp_flow_line",\
    0\
  );;\
\
  my $hcIst = ReadingsNum(\
    "LambdaWP",\
    "HC_FlowTemp",\
    0\
  );;\
\
  my $einspeis = ReadingsNum(\
    "HA_SDM630M_Nergie",\
    "Einspeiseleistung",\
    0\
  );;\
\
  my $wpEl = ReadingsNum(\
    "LambdaWP",\
    "HP_akt_elektr_Leistungsaufnahme",\
    0\
  );;\
\
  $wpEl = $wpEl * 1000 if $wpEl < 50;;\
\
  my $surplus = $einspeis + $wpEl;;\
\
  my $now = time();;\
\
  my $aktiver_modus = ReadingsVal(\
    "DHW_Steuerung",\
    "aktiver_modus",\
    "keiner"\
  );;\
\
  my $boost_seit = ReadingsNum(\
    "DHW_Steuerung",\
    "boost_seit",\
    0\
  );;\
\
  my $pv_seit = ReadingsNum(\
    "DHW_Steuerung",\
    "pv_stabil_seit",\
    0\
  );;\
\
  my $notfall_aktiv = ReadingsNum(\
    "DHW_Steuerung",\
    "notfall_aktiv",\
    0\
  );;\
\
  my $mittag_dhw_tag = ReadingsVal(\
    "DHW_Steuerung",\
    "mittag_dhw_tag",\
    ""\
  );;\
\
  my $pvHkOffset = ReadingsNum(\
    "LambdaWP",\
    "PV_HK_Offset",\
    0\
  );;\
\
  my $hcAusschalt =\
    $hcSoll + 10 + $pvHkOffset;;\
\
  my $bufferMinA =\
    $hcSoll + 2;;\
\
  if($einspeis >= $PV_SCHWELLE_W)\
  {\
    if($pv_seit == 0)\
    {\
      fhem(\
        "setreading DHW_Steuerung pv_stabil_seit $now"\
      );;\
\
      $pv_seit = $now;;\
    }\
  }\
  else\
  {\
    if($pv_seit != 0)\
    {\
      fhem(\
        "setreading DHW_Steuerung pv_stabil_seit 0"\
      );;\
\
      $pv_seit = 0;;\
    }\
  }\
\
  my $pv_stabil =\
  (\
    $pv_seit > 0 &&\
    ($now - $pv_seit) >= $PV_STABIL_S\
  );;\
\
  my $pv_weg_seit = ReadingsNum(\
    "DHW_Steuerung",\
    "pv_weg_seit",\
    0\
  );;\
\
  if($surplus < $PV_AUS_W)\
  {\
    if($pv_weg_seit == 0)\
    {\
      fhem(\
        "setreading DHW_Steuerung pv_weg_seit $now"\
      );;\
\
      $pv_weg_seit = $now;;\
    }\
  }\
  else\
  {\
    if($pv_weg_seit != 0)\
    {\
      fhem(\
        "setreading DHW_Steuerung pv_weg_seit 0"\
      );;\
\
      $pv_weg_seit = 0;;\
    }\
  }\
\
  my $pv_weg_lange =\
  (\
    $pv_weg_seit > 0 &&\
    ($now - $pv_weg_seit) >= $PV_WEG_S\
  );;\
\
  my $boiler_ziel = undef;;\
  my $buffer_ziel = undef;;\
\
  my $boilerLow_reset_aktiv = 0;;\
\
  my $mittag_fenster =\
    $stunde >= $MITTAG_START &&\
    $stunde <  $MITTAG_ENDE;;\
\
  my $pv_fenster =\
    $stunde >= $PV_FENSTER_START &&\
    $stunde <  $PV_FENSTER_ENDE;;\
\
  my $notfall_bedingung =\
    $boilerHigh > 46.0 &&\
    ($bufferHigh < ($hcSoll + 2) || $hcIst < ($hcSoll - 2.0)) &&\
    $mode eq "DHW" &&\
    $vd eq "on";;\
\
  if($notfall_bedingung && !$notfall_aktiv)\
  {\
    $boiler_ziel = $NOTFALL_SET;;\
\
    fhem(\
      "setreading DHW_Steuerung notfall_aktiv 1"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus notfall"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    $aktiver_modus = "notfall";;\
    $notfall_aktiv = 1;;\
  }\
  elsif($notfall_aktiv)\
  {\
    my $notfall_reset =\
      $boilerHigh <= 44.0 ||\
      ($bufferHigh > ($hcSoll + 4) && $hcIst > ($hcSoll - 1.0)) ||\
      $mode ne "DHW";;\
\
    if($notfall_reset)\
    {\
      fhem(\
        "setreading DHW_Steuerung notfall_aktiv 0"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung aktiver_modus keiner"\
      );;\
\
      $notfall_aktiv = 0;;\
      $aktiver_modus = "keiner";;\
\
      $boiler_ziel = $BOILER_DEFAULT;;\
    }\
    else\
    {\
      fhem(\
        "setreading DHW_Steuerung dbg_grund notfall_haelt"\
      );;\
    }\
  }\
\
  my $mittag_haltbar =\
    $aktiver_modus eq "M" &&\
    $mittag_fenster &&\
    $boilerLow < 43.0;;\
\
  if(\
    $boost_seit > 0 &&\
    ($now - $boost_seit) >= $BOOST_DAUER_S &&\
    !$mittag_haltbar &&\
    !(\
      ($aktiver_modus eq "M" || $aktiver_modus eq "C") &&\
      $boilerLow <= $BOILERLOW_RESET\
    )\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  if(\
    $aktiver_modus eq "A" &&\
    $boilerLow >= $BOILER_DEFAULT\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
\
  if(\
    (\
      $aktiver_modus eq "M" ||\
      $aktiver_modus eq "C"\
    ) &&\
    $boilerLow > $BOILERLOW_RESET\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund boilerLow_reset"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
\
    $boilerLow_reset_aktiv = 1;;\
  }\
\
  if(\
    (\
      $aktiver_modus eq "M" ||\
      $aktiver_modus eq "C"\
    ) &&\
    $vd ne "on" &&\
    $boilerHigh >= $BOILERHIGH_VOLL\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund boilerHigh_voll"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  if(\
    $aktiver_modus eq "C" &&\
    $pv_weg_lange\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund PV_weg_C_ende"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  if(\
    $aktiver_modus eq "S_DHW" &&\
    $boilerHigh >= 50.0\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund S_DHW_ziel_erreicht"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  if(\
    $aktiver_modus eq "M" &&\
    !$mittag_fenster &&\
    $vd ne "on"\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund Mittag_Fenster_Ende"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  if(\
    $aktiver_modus eq "C" &&\
    !$pv_fenster &&\
    $vd ne "on"\
  )\
  {\
    fhem(\
      "setreading DHW_Steuerung aktiver_modus keiner"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung boost_seit 0"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund PV_Fenster_Ende"\
    );;\
\
    $aktiver_modus = "keiner";;\
    $boost_seit    = 0;;\
\
    $boiler_ziel = $BOILER_DEFAULT;;\
  }\
\
  my $saison_ok =\
    $monat >= $FRUEHJAHR_MONAT &&\
    $monat <= $HERBST_MONAT;;\
\
  my $mittag_ok =\
    $stunde >= $MITTAG_START &&\
    $stunde < $MITTAG_ENDE;;\
\
  my $dhw_bedarf =\
    $boilerLow < $DHW_START_TEMP;;\
\
  my $pv_mittag_ok =\
    $einspeis >= $PV_MITTAG_W;;\
\
  my $wp_steht =\
    $vd ne "on";;\
\
  my $modeMittag =\
  (\
    $saison_ok &&\
    $mittag_ok &&\
    $wp_steht &&\
    $dhw_bedarf &&\
    $pv_mittag_ok\
  );;\
\
  my $modeC =\
    $pv_stabil &&\
    $boilerLow < $BOILERLOW_RESET &&\
    $boilerHigh < $BOILERHIGH_START;;\
\
  if(\
    $aktiver_modus eq "keiner" &&\
    !$notfall_aktiv &&\
    !$boilerLow_reset_aktiv &&\
    ReadingsNum("Anlaeufe_heute_Verdichter","state",0) < 1\
  )\
  {\
    if($modeMittag)\
    {\
      $boiler_ziel = $PV_BOOST_SET;;\
\
      fhem(\
        "setreading DHW_Steuerung aktiver_modus M"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung boost_seit $now"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung mittag_dhw_tag $heute"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung dbg_grund Mittag_DHW"\
      );;\
    }\
    elsif($modeC && $vd ne "on" && $pv_fenster)\
    {\
      $boiler_ziel = $PV_BOOST_SET;;\
\
      fhem(\
        "setreading DHW_Steuerung aktiver_modus C"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung boost_seit $now"\
      );;\
\
      fhem(\
        "setreading DHW_Steuerung dbg_grund PV_boost_C_kalt"\
      );;\
    }\
    elsif($vd eq "on")\
    {\
      my $modeA =\
        $heizperiode &&\
        $bufferHigh >= ($hcAusschalt - 3) &&\
        $bufferHigh >= $bufferMinA &&\
        $boilerLow < $BOILER_DEFAULT;;\
\
      my $modeB =\
        $heizperiode &&\
        $boilerLow >= $BOILER_DEFAULT &&\
        $bufferHigh < ($BUFFER_DEFAULT - 3);;\
\
      my $steer_dhw_to_ch =\
        $mode eq "DHW" &&\
        $bufferHigh < ($hcSoll - 4) &&\
        $einspeis < 1000;;\
\
      my $steer_ch_to_dhw =\
        $mode eq "CENTRAL_HEATING" &&\
        $bufferHigh > ($hcSoll + 5) &&\
        $boilerLow < ($boilerSet - 5) &&\
        $einspeis > 4000;;\
\
      if($steer_dhw_to_ch)\
      {\
        $boiler_ziel = $BOILER_DEFAULT;;\
\
        fhem(\
          "setreading DHW_Steuerung aktiver_modus S_CH"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung boost_seit $now"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung dbg_grund Steuer_DHW_zu_Heizen"\
        );;\
      }\
      elsif($steer_ch_to_dhw)\
      {\
        $boiler_ziel = 50.0;;\
\
        fhem(\
          "setreading DHW_Steuerung aktiver_modus S_DHW"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung boost_seit $now"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung dbg_grund Steuer_Heizen_zu_DHW"\
        );;\
      }\
      elsif($modeC && $pv_fenster)\
      {\
        $boiler_ziel = $PV_BOOST_SET;;\
\
        fhem(\
          "setreading DHW_Steuerung aktiver_modus C"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung boost_seit $now"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung dbg_grund PV_boost_C"\
        );;\
      }\
      elsif($modeA)\
      {\
        $boiler_ziel = $BOOST_DHW;;\
\
        fhem(\
          "setreading DHW_Steuerung aktiver_modus A"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung boost_seit $now"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung dbg_grund DHW_vorab_A"\
        );;\
      }\
      elsif($modeB)\
      {\
        $boiler_ziel = $NOTFALL_SET;;\
\
        fhem(\
          "setreading DHW_Steuerung aktiver_modus B"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung boost_seit $now"\
        );;\
\
        fhem(\
          "setreading DHW_Steuerung dbg_grund Puffer_vorab_B"\
        );;\
      }\
      else\
      {\
        fhem(\
          "setreading DHW_Steuerung dbg_grund keine_bedingung"\
        );;\
      }\
    }\
  }\
\
  if(\
    (\
      $aktiver_modus eq "M" ||\
      $aktiver_modus eq "C"\
    ) &&\
    $boilerLow <= $BOILERLOW_RESET &&\
    !defined($boiler_ziel)\
  )\
  {\
    $boiler_ziel = $PV_BOOST_SET;;\
\
    fhem(\
      "setreading DHW_Steuerung dbg_grund PV_boost_rearm"\
    );;\
  }\
\
  my $dhw_aktiv =\
  (\
    $aktiver_modus eq "M" ||\
    $aktiver_modus eq "C" ||\
    $mode eq "DHW"\
  );;\
\
  my $pv_einspeisend = ($surplus >= $PV_HALTE_W);;\
\
  if($dhw_aktiv && $pv_einspeisend && !$notfall_aktiv && !$boilerLow_reset_aktiv)\
  {\
    if($aktiver_modus eq "B")\
    {\
      fhem(\
        "setreading DHW_Steuerung aktiver_modus keiner"\
      );;\
\
      $aktiver_modus = "keiner";;\
    }\
\
    fhem(\
      "setreading DHW_Steuerung pv_dhw_halten 1"\
    );;\
\
    if($boost_seit > 0 && ($now - $boost_seit) >= $BOOST_DAUER_S && !$mittag_haltbar)\
    {\
      fhem(\
        "setreading DHW_Steuerung boost_seit $now"\
      );;\
\
      $boost_seit = $now;;\
    }\
  }\
  else\
  {\
    fhem(\
      "setreading DHW_Steuerung pv_dhw_halten 0"\
    );;\
  }\
\
  my $boilerSetIst = ReadingsNum(\
    "LambdaWP",\
    "BoilerMaxTempSetpoint",\
    $BOILER_DEFAULT\
  );;\
\
  if(\
    defined($boiler_ziel) &&\
    abs($boilerSetIst - $boiler_ziel) > 0.1\
  )\
  {\
    fhem(\
      "set LambdaWP BoilerMaxTempSetpoint $boiler_ziel"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung letzter_boiler_set $boiler_ziel"\
    );;\
\
    fhem(\
      "sleep 2;; get LambdaWP BoilerMaxTempSetpoint"\
    );;\
  }\
\
  if(!defined($boiler_ziel))\
  {\
    my $wpNow    = ReadingsNum("LambdaWP","BoilerMaxTempSetpoint",$BOILER_DEFAULT);;\
    my $dummyNow = ReadingsNum("Boiler_Maxtemp","targetTemp",-1);;\
\
    if(abs($wpNow - $dummyNow) > 1.0)\
    {\
      fhem("setreading Boiler_Maxtemp targetTemp $wpNow");;\
    }\
  }\
\
  if(\
    defined($buffer_ziel) &&\
    abs($bufferSet - $buffer_ziel) > 0.1\
  )\
  {\
    fhem(\
      "set LambdaWP Buffer_MaxTempSetpoint $buffer_ziel"\
    );;\
\
    fhem(\
      "setreading DHW_Steuerung letzter_buffer_set $buffer_ziel"\
    );;\
  }\
\
  my $boost_rest =\
  (\
    $boost_seit > 0\
  )\
  ?\
  int(\
    ($BOOST_DAUER_S - ($now - $boost_seit)) / 60\
  )\
  :\
  0;;\
\
  fhem(\
    "setreading DHW_Steuerung boost_rest_min $boost_rest"\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_hcAusschalt ".\
    sprintf("%.1f",$hcAusschalt)\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_bufferMinA ".\
    sprintf("%.1f",$bufferMinA)\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_pv_stabil ".\
    ($pv_stabil ? 1 : 0)\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_einspeis $einspeis"\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_surplus $surplus"\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_modeMittag ".\
    ($modeMittag ? 1 : 0)\
  );;\
\
  fhem(\
    "setreading DHW_Steuerung dbg_heizperiode ".\
    ($heizperiode ? 1 : 0)\
  );;\
}\
)
