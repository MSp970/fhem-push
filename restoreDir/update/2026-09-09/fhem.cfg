define di_openWB_auto_rechts DOIF ([1s_2s_timer:tick] == 0 or [1s_2s_timer:tick] == 1)\
(\
{\
my $now = time();;\
my $DEV = "di_openWB_auto_rechts";;\
\
my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
\
my $grid = ReadingsNum("HA_SDM630M_Nergie","Power_Sum__W1",0);;\
\
my $grid_prev = ReadingsNum($DEV,"grid_prev",$grid);;\
my $grid_d = abs($grid - $grid_prev);;\
my $grid_vol = ReadingsNum($DEV,"grid_vol",0);;\
$grid_vol = (0.7 * $grid_vol) + (0.3 * $grid_d);;\
fhem("setreading $DEV grid_prev ".int($grid));;\
fhem("setreading $DEV grid_vol ".int($grid_vol));;\
\
my $EVU_BEZUG_SCHWELLE = ReadingsNum("openWB_Garage_rechts_Control","evuBezugSchwelle",20);;\
my $evu_bezug_erkannt = ($grid > $EVU_BEZUG_SCHWELLE) ? 1 : 0;;\
fhem("setreading $DEV evu_bezug_erkannt $evu_bezug_erkannt");;\
\
my $bat1 = ReadingsNum("GoodWe_Garage_Haus_West_5877","Power_Battery",0);;\
my $bat2 = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Power_Battery",0);;\
my $bat_total = $bat1 + $bat2;;\
\
my $reserve = ReadingsNum("openWB_Garage_rechts_Control","pvReserve",100);;\
my $stopReserve = ReadingsNum("openWB_Garage_rechts_Control","pvStopReserve",300);;\
\
my $cm = ReadingsVal("OpenWB_Garage_rechts","Ladepunkt_chargemode","stop");;\
$cm = "instant" if($cm eq "instant_charging");;\
$cm = "pv" if($cm eq "pv_charging");;\
my $realCm = $cm;;\
$realCm = "eco" if($realCm eq "eco_charging");;\
$realCm = "target" if($realCm eq "target_charging");;\
$realCm = "stop" if($realCm eq "standby");;\
my $ctrlCm = ReadingsVal("openWB_Garage_rechts_Control","chargemode","pv");;\
my $lockUntil = ReadingsVal("openWB_Garage_rechts_Control","manualStopLockUntil","");;\
my @ltNow = localtime(time());;\
my $nowStr = sprintf("%04d-%02d-%02d %02d:%02d:%02d",$ltNow[5]+1900,$ltNow[4]+1,$ltNow[3],$ltNow[2],$ltNow[1],$ltNow[0]);;\
my $manualStopLockActive = ($lockUntil ne "" && $nowStr lt $lockUntil) ? 1 : 0;;\
if($realCm ne "" && $realCm ne $ctrlCm)\
{\
my $cHash = $defs{"openWB_Garage_rechts_Control"};;\
readingsSingleUpdate($cHash,"chargemode",$realCm,0) if($cHash);;\
if($realCm eq "stop" && $ctrlCm ne "stop" && $cHash)\
{\
my $today8 = sprintf("%04d-%02d-%02d 08:00:00",$ltNow[5]+1900,$ltNow[4]+1,$ltNow[3]);;\
my $lockTs = $today8;;\
if($nowStr ge $today8)\
{\
my @ltTom = localtime(time()+86400);;\
$lockTs = sprintf("%04d-%02d-%02d 08:00:00",$ltTom[5]+1900,$ltTom[4]+1,$ltTom[3]);;\
}\
readingsSingleUpdate($cHash,"manualStopLockUntil",$lockTs,0);;\
}\
}\
my $charge_state = ReadingsVal("OpenWB_Garage_rechts","Ladepunkt_charge_state","False");;\
my $power = ReadingsNum("OpenWB_Garage_rechts","Ladeleistung_gesamt",0);;\
fhem("setreading openWB_Garage_rechts_Control power ".sprintf("%.1f",$power/1000));;\
\
my $ev_laedt_aktiv = ($charge_state eq "True" || $power > 50) ? 1 : 0;;\
\
my $iL1 = ReadingsNum("OpenWB_Garage_rechts","Ladestrom_L1",0);;\
my $iL2 = ReadingsNum("OpenWB_Garage_rechts","Ladestrom_L2",0);;\
my $iL3 = ReadingsNum("OpenWB_Garage_rechts","Ladestrom_L3",0);;\
\
my $phases_detected = 0;;\
$phases_detected++ if($iL1 > 1);;\
$phases_detected++ if($iL2 > 1);;\
$phases_detected++ if($iL3 > 1);;\
\
my $phases = ($phases_detected > 0)\
? $phases_detected\
: ReadingsNum("OpenWB_Garage_rechts","Ladepunkt_Anzahl_Phasen",1);;\
