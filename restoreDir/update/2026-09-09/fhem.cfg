attr GoodWe_Haus_Ost_Mitte_5876 userReadings Entladeenergie_heute_kWh:.*\
{\
sprintf("%.2f",\
  ReadingsNum($name,"Entladeenergie_kWh",0)\
- ReadingsNum($name,"Entladeenergie_start_12h",0)\
)\
},\
\
Batterie_Wirkungsgrad:.*\
{\
my $in  = ReadingsNum($name,"Ladeenergie_raw",0);;\
my $out = ReadingsNum($name,"Entladeenergie_raw",0);;\
$in > 0 ? sprintf("%.1f", $out/$in*100) : 0 \
},\
\
Batterie_Verluste_kWh:.*\
{\
sprintf("%.2f",(ReadingsNum($name,"Ladeenergie_kWh",0) - ReadingsNum($name,"Entladeenergie_kWh",0))) \
},\
\
Lade_Entlade_Verhaeltnis:.*\
{ \
my $in  = ReadingsNum($name,"Ladeenergie_raw",0);;\
my $out = ReadingsNum($name,"Entladeenergie_raw",0);;\
$in > 0 ? sprintf("%.2f", $out/$in) : 0 \
},\
\
Batterie_Zyklen:.*\
{ \
my $cap = ReadingsNum("EMS_Control","capacity1",10000);;\
my $out = ReadingsNum($name,"Entladeenergie_kWh",0);;\
$cap > 0 ? sprintf("%.2f", $out/$cap) : 0 \
},\
\
Max_Ladeleistung:.*\
{ \
my $p = ReadingsNum($name,"Ladeleistung",0);;\
my $max = ReadingsNum($name,"Max_Ladeleistung",0);;\
$p > $max ? $p : $max \
},\
\
Max_Entladeleistung:.*\
{ \
my $p = ReadingsNum($name,"Entladeleistung",0);;\
my $max = ReadingsNum($name,"Max_Entladeleistung",0);;\
$p > $max ? $p : $max \
},\
\
Ladeleistung:.* { ReadingsNum("GoodWe_Haus_Ost_Mitte_5876", "Power_Battery", 0) < 0 ? sprintf("%.0f", ReadingsNum("GoodWe_Haus_Ost_Mitte_5876", "Power_Battery", 0) * (-1)) : 0 },\
\
Entladeleistung:.* { ReadingsNum("GoodWe_Haus_Ost_Mitte_5876", "Power_Battery", 0) > 0 ? sprintf("%.0f", ReadingsNum("GoodWe_Haus_Ost_Mitte_5876", "Power_Battery", 0)) : 0 },\
\
Ladeenergie_raw:.* integral {ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Ladeleistung",0) ;; },\
\
