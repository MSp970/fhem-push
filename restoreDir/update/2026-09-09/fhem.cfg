attr Erkennung_HC_ueberschwingen comment Komplett neue Logik mit drei kombinierten Indikatoren — Score 0–3, Erkennung ab Score ≥ 2:\
Indikator 1 — Standardabweichung (σ ≥ 2.5K): Die letzten 90 Messwerte (15 Min bei 10s-Takt) werden im Ringpuffer gehalten.\
Hohe Streuung = schwingt = kein Heizbedarf. Mit deinen Readings (Flow 28–34°C): σ = 2.67K → Score +1.\
Indikator 2 — Nulldurchgänge (≥ 3): Wie oft kreuzt HC_FlowTemp die HC_Targettemp im Fenster? 9 Kreuzungen in 15 Min → eindeutig schwingend → Score +1.\
Indikator 3 — Zyklusdauer (< 20 Min): Kurze VD-Zyklen aus DOIF_WP_Laufzeiten:vd_on_seit_sec zeigen dass die WP schnell taktet → Puffer übernimmt,\
kein Haus-Heizbedarf → Score +1.\
Hysterese: on erst nach 120s stabilem Score ≥ 2, off erst nach 300s stabilem Score < 2 — verhindert Flackern beim Übergang.\
Guard: Läuft nur wenn Verdichter_aktiv=on UND HP_OperatingState=CENTRAL_HEATING — kein falsches Triggern bei DHW oder Standby.
attr Erkennung_HC_ueberschwingen do always
