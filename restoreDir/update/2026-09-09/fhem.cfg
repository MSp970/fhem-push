$L77 = 20000 if($L77 < 100);;\
fhem("set GoodWe_Haus_Ost_Mitte_5876 ".\
     "EMS_max_feed_in $L76");;\
fhem("set GoodWe_Garage_Haus_West_5877 ".\
     "EMS_max_feed_in $L77");;\
fhem("setreading $DEV limit_gesendet_5876 $L76");;\
fhem("setreading $DEV limit_gesendet_5877 $L77");;\
