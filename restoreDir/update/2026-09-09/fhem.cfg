define di_Markise_Automatik DOIF ([Beschattung_Config:Modus] or [Markise_WG:pct] or\
[Astrodaten:SunAlt] or [Astrodaten:SunAz] or\
[LambdaWP:AmbientTempCalc] or [InnenTempDummy:temperature] or\
[BresserWetter:regenrate] or [BresserWetter:windboe_kmh] or\
[BresserWetter:temperatur_aussen] or [BresserWetter:sonneneinstrahlung] or\
[RegenNowcast:regen_kommt_in_min] or [DWD:fc0_0_RR1c] or\
[DWD:fc0_0_Neff] or [WindSensor:wind])\
({\
my $modus = ReadingsVal("Beschattung_Config","Modus","Automatik");;\
my $sunAlt = ReadingsNum("Astrodaten","SunAlt",0);;\
my $sunAz = ReadingsNum("Astrodaten","SunAz",0);;\
my $inTemp = ReadingsNum("InnenTempDummy","temperature",25);;\
my $hour = (localtime())[2];;\
my $month = (localtime())[4]+1;;\
my $bwAge = ReadingsAge("BresserWetter","lastUpdate",99999);;\
my $bwOk = ($bwAge < 300) ? 1 : 0;;\
my $outTemp = $bwOk\
? ReadingsNum("BresserWetter","temperatur_aussen",0)\
: ReadingsNum("LambdaWP","AmbientTempCalc",0);;\
my $wind = $bwOk\
? ReadingsNum("BresserWetter","windboe_kmh",0)\
: ReadingsNum("WindSensor","wind",0);;\
my $rain = $bwOk\
? ReadingsNum("BresserWetter","regenrate",0)\
: ReadingsNum("DWD","fc0_${hour}_RR1c",0);;\
my $cloud;;\
my $cloudQuelle;;\
if($bwOk && $sunAlt >= 5) {\
my $solrad = ReadingsNum("BresserWetter","sonneneinstrahlung",0);;\
my $solradMax = 1000 * sin($sunAlt * 3.14159265/180);;\
$cloud = 100 * (1 - $solrad / $solradMax);;\
$cloud = 0 if($cloud < 0);;\
$cloud = 100 if($cloud > 100);;\
$cloud = int($cloud+0.5);;\
$cloudQuelle = "Bresser_Solrad";;\
} else {\
$cloud = ReadingsNum("DWD","fc0_${hour}_Neff",100);;\
$cloudQuelle = "DWD_Neff";;\
}\
my $sunAltMin = ReadingsNum("Beschattung_Config","SunAltStart",25);;\
my $sunAltEnd = ReadingsNum("Beschattung_Config","SunAltEnde",8);;\
my $azMin = ReadingsNum("Beschattung_Config","AzimutStart",180);;\
my $azMax = ReadingsNum("Beschattung_Config","AzimutEnde",290);;\
my $outLimit = ReadingsNum("Beschattung_Config","AussenTempMin",22);;\
my $inLimit = ReadingsNum("Beschattung_Config","InnenTempStart",24);;\
my $sunAltAus = ReadingsNum("Beschattung_Config","SunAltAus",20);;\
my $outAus = ReadingsNum("Beschattung_Config","AussenTempAus",16);;\
my $inAus = ReadingsNum("Beschattung_Config","InnenTempAus",22);;\
my $windEin = ReadingsNum("Beschattung_Config","WindEin",30);;\
my $windAus = ReadingsNum("Beschattung_Config","WindAus",20);;\
my $cloudIn = ReadingsNum("Beschattung_Config","WolkenEin",50);;\
my $cloudOut = ReadingsNum("Beschattung_Config","WolkenAus",70);;\
my $rainLimit = ReadingsNum("Beschattung_Config","RegenEin",0.1);;\
my $regenNach = ReadingsNum("Beschattung_Config","RegenNachlauf",15);;\
my $winterVon = ReadingsNum("Beschattung_Config","WinterMonatVon",10);;\
my $winterBis = ReadingsNum("Beschattung_Config","WinterMonatBis",4);;\
my $abendPos = ReadingsNum("Beschattung_Config","AbendPosition",0);;\
my $morgenPos = ReadingsNum("Beschattung_Config","MorgenPosition",0);;\
my $ziel = ReadingsNum("Beschattung_Config","ZielPosition",100);;\
my $nachf = ReadingsVal("Beschattung_Config","Nachfuehrung","on");;\
my $pct = ReadingsNum("Markise_WG","pct",0);;\
my $status = ReadingsVal("Beschattung_Config","BeschattungStatus","AUS");;\
my $istWinter = ($winterVon <= $winterBis)\
? ($month >= $winterVon && $month <= $winterBis)\
: ($month >= $winterVon || $month <= $winterBis);;\
my $manuellZeit = ReadingsNum("Beschattung_Config","ManuellZeit",0);;\
my $sperrManuell = ReadingsNum("Beschattung_Config","SperrzeitManuell",0)*60;;\
my $manuellRest = ($sperrManuell > 0 && (time()-$manuellZeit) < $sperrManuell)\
? int($sperrManuell - (time()-$manuellZeit)) : 0;;\
my $sunAltLim = ($status eq "SONNE") ? $sunAltAus : $sunAltMin;;\
my $b_hoehe = ($sunAlt >= $sunAltLim) ? 1 : 0;;\
my $b_azimut = ($sunAz >= $azMin && $sunAz <= $azMax) ? 1 : 0;;\
my $aussenLim = ($status eq "SONNE") ? $outAus : $outLimit;;\
my $b_aussen = ($outTemp >= $aussenLim) ? 1 : 0;;\
my $innenLim = ($status eq "SONNE") ? $inAus : $inLimit;;\
my $b_innen = ($inTemp >= $innenLim) ? 1 : 0;;\
my $cloudLim = ($status eq "SONNE") ? $cloudOut : $cloudIn;;\
my $b_wolken = ($cloud <= $cloudLim) ? 1 : 0;;\
my $b_nachf = ($nachf eq "on") ? 1 : 0;;\
fhem("setreading Beschattung_Config MarkisePct $pct");;\
{\
my $stand;;\
if($pct <= 5)\
{\
$stand = "eingefahren";;\
}\
elsif($pct >= 95)\
{\
$stand = "ausgefahren";;\
}\
elsif(abs($pct-25)<=10)\
{\
$stand = "Viertel";;\
}\
elsif(abs($pct-50)<=10)\
{\
$stand = "halb";;\
}\
elsif(abs($pct-75)<=10)\
{\
$stand = "Dreiviertel";;\
}\
else\
{\
$stand = "teilweise (${pct}%)";;\
}\
fhem("setreading Beschattung_Config MarkiseStand $stand");;\
}\
fhem("setreading Beschattung_Config SonneHoehe $sunAlt");;\
fhem("setreading Beschattung_Config SonneAzimut $sunAz");;\
fhem("setreading Beschattung_Config Bewoelkung $cloud");;\
fhem("setreading Beschattung_Config BewoelkungQuelle $cloudQuelle");;\
fhem("setreading Beschattung_Config Regen $rain");;\
fhem("setreading Beschattung_Config Wind $wind");;\
fhem("setreading Beschattung_Config InnenTemp $inTemp");;\
fhem("setreading Beschattung_Config AussenTemp $outTemp");;\
fhem("setreading Beschattung_Config WetterQuelle ".($bwOk?"BresserWetter":"Fallback_DWD_WindSensor"));;\
fhem("setreading Beschattung_Config WetterAlter $bwAge");;\
fhem("setreading Beschattung_Config dbg_Modus $modus");;\
fhem("setreading Beschattung_Config dbg_Stunde $hour");;\
fhem("setreading Beschattung_Config dbg_Winter ".($istWinter?1:0));;\
fhem("setreading Beschattung_Config dbg_ManuellRest $manuellRest");;\
fhem("setreading Beschattung_Config dbg_g_Hoehe $b_hoehe");;\
fhem("setreading Beschattung_Config dbg_g_Azimut $b_azimut");;\
fhem("setreading Beschattung_Config dbg_g_Aussen $b_aussen");;\
fhem("setreading Beschattung_Config dbg_g_Innen $b_innen");;\
fhem("setreading Beschattung_Config dbg_g_Wolken $b_wolken");;\
fhem("setreading Beschattung_Config dbg_g_Nachf $b_nachf");;\
fhem("setreading di_Markise_Automatik dbg_Modus $modus");;\
fhem("setreading di_Markise_Automatik dbg_Stunde $hour");;\
fhem("setreading di_Markise_Automatik dbg_Winter ".($istWinter?1:0));;\
fhem("setreading di_Markise_Automatik dbg_ManuellRest $manuellRest");;\
fhem("setreading di_Markise_Automatik dbg_Pct $pct");;\
fhem("setreading di_Markise_Automatik dbg_SonneHoehe $sunAlt");;\
fhem("setreading di_Markise_Automatik dbg_SonneAzimut $sunAz");;\
fhem("setreading di_Markise_Automatik dbg_AussenTemp $outTemp");;\
fhem("setreading di_Markise_Automatik dbg_InnenTemp $inTemp");;\
fhem("setreading di_Markise_Automatik dbg_Bewoelkung $cloud");;\
fhem("setreading di_Markise_Automatik dbg_BewoelkungQuelle $cloudQuelle");;\
fhem("setreading di_Markise_Automatik dbg_Regen $rain");;\
fhem("setreading di_Markise_Automatik dbg_Wind $wind");;\
fhem("setreading di_Markise_Automatik dbg_WetterQuelle ".($bwOk?"BresserWetter":"Fallback"));;\
fhem("setreading di_Markise_Automatik dbg_WetterAlter $bwAge");;\
fhem("setreading di_Markise_Automatik dbg_g_Hoehe $b_hoehe");;\
fhem("setreading di_Markise_Automatik dbg_g_Azimut $b_azimut");;\
fhem("setreading di_Markise_Automatik dbg_g_Aussen $b_aussen");;\
fhem("setreading di_Markise_Automatik dbg_g_Innen $b_innen");;\
fhem("setreading di_Markise_Automatik dbg_g_Wolken $b_wolken");;\
fhem("setreading di_Markise_Automatik dbg_g_Nachf $b_nachf");;\
my $fahre = sub {\
my ($zielpct, $force) = @_;;\
return if($pct == $zielpct);;\
my $now = time();;\
my $letzte = ReadingsNum("Beschattung_Config","LetzteFahrt",0);;\
my $pause = ReadingsNum("Beschattung_Config","FahrPause",0)*60;;\
if(!$force && ($now-$letzte) < $pause)\
{\
fhem("setreading Beschattung_Config Grund FahrPause");;\
return;;\
}\
fhem("set Markise_WG pct $zielpct");;\
fhem("setreading Beschattung_Config LetzteFahrt $now");;\
fhem("setreading Beschattung_Config LetzteSollPos $zielpct");;\
fhem("setreading Beschattung_Config FahrBis ".int($now + ReadingsNum("Beschattung_Config","FahrDauer",60)));;\
fhem("setreading Beschattung_Config LetzteAktion ".FmtDateTime($now));;\
};;\
my $sollPos = ReadingsNum("Beschattung_Config","LetzteSollPos",-1);;\
my $fahrBis = ReadingsNum("Beschattung_Config","FahrBis",0);;\
if($sollPos < 0)\
{\
fhem("setreading Beschattung_Config LetzteSollPos $pct");;\
}\
elsif(time() > $fahrBis && abs($pct-$sollPos) > 2)\
{\
fhem("setreading Beschattung_Config ManuellZeit ".time());;\
fhem("setreading Beschattung_Config LetzteSollPos $pct");;\
}\
if($modus ne "Automatik")\
{\
fhem("setreading Beschattung_Config BeschattungStatus MANUELL");;\
fhem("setreading Beschattung_Config Grund Handbetrieb");;\
return;;\
}\
if($wind >= $windEin)\
{\
$fahre->(0,1);;\
fhem("setreading Beschattung_Config BeschattungStatus WIND");;\
fhem("setreading Beschattung_Config Grund Wind");;\
return;;\
}\
if($status eq "WIND")\
{\
return if($wind > $windAus);;\
}\
\
my $fruehwarnAn = ReadingsVal("Beschattung_Config","RegenFruehwarn","on");;\
my $fruehwarnMin = ReadingsNum("Beschattung_Config","RegenFruehwarnEin",20);;\
my $ncMaxAge = ReadingsNum("Beschattung_Config","RegenNowcastMaxAge",720);;\
my $ncAge = ReadingsAge("RegenNowcast","regen_kommt_in_min",99999);;\
my $ncOk = ($ncAge < $ncMaxAge) ? 1 : 0;;\
my $kommtInMin = $ncOk ? ReadingsNum("RegenNowcast","regen_kommt_in_min",999) : 999;;\
my $kommtAus = ReadingsVal("RegenNowcast","regen_kommt_aus","-");;\
fhem("setreading Beschattung_Config dbg_FruehwarnMin $kommtInMin");;\
fhem("setreading Beschattung_Config dbg_FruehwarnAus $kommtAus");;\
fhem("setreading Beschattung_Config dbg_NowcastAlter $ncAge");;\
fhem("setreading Beschattung_Config dbg_NowcastOk $ncOk");;\
if($fruehwarnAn eq "on" && $ncOk && $kommtInMin <= $fruehwarnMin)\
{\
$fahre->(0,1);;\
fhem("setreading Beschattung_Config BeschattungStatus REGEN_FRUEHWARN");;\
fhem("setreading Beschattung_Config Grund Regen_Fruehwarnung_in_${kommtInMin}min_aus_${kommtAus}");;\
return;;\
}\
if($status eq "REGEN_FRUEHWARN" && $kommtInMin > $fruehwarnMin && $rain <= $rainLimit)\
{\
fhem("setreading Beschattung_Config BeschattungStatus AUS");;\
fhem("setreading Beschattung_Config Grund Fruehwarnung_vorbei");;\
}\
\
if($rain > $rainLimit)\
{\
$fahre->(0,1);;\
fhem("setreading Beschattung_Config RegenZeit ".time());;\
fhem("setreading Beschattung_Config BeschattungStatus REGEN");;\
fhem("setreading Beschattung_Config Grund Regen");;\
return;;\
}\
my $regenZeit = ReadingsNum("Beschattung_Config","RegenZeit",0);;\
if($status eq "REGEN")\
{\
if($rain > 0)\
{\
fhem("setreading Beschattung_Config RegenZeit ".time());;\
return;;\
}\
if((time()-$regenZeit) < ($regenNach*60))\
{\
fhem("setreading Beschattung_Config Grund Regen_Nachlauf");;\
return;;\
}\
}\
if($sperrManuell > 0 && (time()-$manuellZeit) < $sperrManuell)\
{\
fhem("setreading Beschattung_Config BeschattungStatus HANDMODE");;\
fhem("setreading Beschattung_Config Grund Handeingriff");;\
return;;\
}\
if($istWinter)\
{\
$fahre->(0,1);;\
fhem("setreading Beschattung_Config BeschattungStatus WINTER");;\
fhem("setreading Beschattung_Config Grund Winterbetrieb");;\
return;;\
}\
if($sunAlt <= $sunAltEnd)\
{\
if($sunAz < 180)\
{\
fhem("setreading Beschattung_Config AbendZeit 0");;\
$fahre->($morgenPos,0);;\
fhem("setreading Beschattung_Config BeschattungStatus MORGEN");;\
fhem("setreading Beschattung_Config Grund Morgen");;\
return;;\
}\
my $verz = ReadingsNum("Beschattung_Config","AbendVerzoegerung",0)*60;;\
my $abendZeit = ReadingsNum("Beschattung_Config","AbendZeit",0);;\
if($status ne "ABEND")\
{\
if($abendZeit == 0)\
{\
$abendZeit = time();;\
fhem("setreading Beschattung_Config AbendZeit $abendZeit");;\
}\
if((time()-$abendZeit) < $verz)\
{\
fhem("setreading Beschattung_Config Grund Abend_Verzoegerung");;\
return;;\
}\
}\
$fahre->($abendPos,0);;\
fhem("setreading Beschattung_Config AbendZeit 0");;\
fhem("setreading Beschattung_Config BeschattungStatus ABEND");;\
fhem("setreading Beschattung_Config Grund Abend");;\
return;;\
}\
fhem("setreading Beschattung_Config AbendZeit 0");;\
my $sonne = 1;;\
$sonne = 0 if(!$b_hoehe);;\
$sonne = 0 if(!$b_azimut);;\
$sonne = 0 if(!$b_aussen);;\
$sonne = 0 if(!$b_innen);;\
$sonne = 0 if(!$b_wolken);;\
$sonne = 0 if(!$b_nachf);;\
fhem("setreading Beschattung_Config dbg_Sonne $sonne");;\
fhem("setreading di_Markise_Automatik dbg_Sonne $sonne");;\
if($sonne == 1)\
{\
$fahre->($ziel,0);;\
fhem("setreading Beschattung_Config BeschattungStatus SONNE");;\
fhem("setreading Beschattung_Config Grund Sonne");;\
return;;\
}\
$fahre->(0,0);;\
fhem("setreading Beschattung_Config BeschattungStatus AUS");;\
fhem("setreading Beschattung_Config Grund Frei");;\
if(!$b_nachf)\
{\
fhem("setreading Beschattung_Config Sperrgrund Nachfuehrung_aus");;\
}\
elsif($wind >= $windEin)\
{\
fhem("setreading Beschattung_Config Sperrgrund Wind");;\
}\
elsif($rain > $rainLimit)\
{\
fhem("setreading Beschattung_Config Sperrgrund Regen");;\
}\
elsif($istWinter)\
{\
fhem("setreading Beschattung_Config Sperrgrund Winter");;\
}\
elsif(!$b_hoehe)\
{\
fhem("setreading Beschattung_Config Sperrgrund Sonnenhoehe");;\
}\
elsif(!$b_azimut)\
{\
fhem("setreading Beschattung_Config Sperrgrund Sonnenrichtung");;\
}\
elsif(!$b_aussen)\
{\
fhem("setreading Beschattung_Config Sperrgrund Aussentemperatur");;\
}\
elsif(!$b_innen)\
{\
fhem("setreading Beschattung_Config Sperrgrund Innentemperatur");;\
}\
elsif(!$b_wolken)\
{\
fhem("setreading Beschattung_Config Sperrgrund Bewoelkung");;\
}\
else\
{\
fhem("setreading Beschattung_Config Sperrgrund Keine");;\
}\
})
