define Lambda_DHW_vorab DOIF (\
(([+00:01:00]) or [LambdaWP:HP_OperatingState]) and\
(\
[LambdaWP:Verdichter_aktiv] eq "on"\
)\
)\
(\
{\
my $hpmode = ReadingsVal("LambdaWP","HP_OperatingState","");;\
my $buffer = ReadingsNum("LambdaWP","BufferHighTemp",0);;\
my $hc_target = ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0);;\
my $boilerLow = ReadingsNum("LambdaWP","BoilerLowTemp",0);;\
my $boilerHigh = ReadingsNum("LambdaWP","BoilerHighTemp",0);;\
my $boilerSet = ReadingsNum("LambdaWP","BoilerMaxTempSetpoint",0);;\
my $pv = ReadingsNum("Lambda_PV_Manipulation","evu_uebergabe",0);;\
\
my $now = time();;\
my $lastSwitch = ReadingsNum("LambdaWP","last_mode_switch",0);;\
my $min_runtime = 600;;\
\
my $lock_until = ReadingsNum("Lambda_DHW_vorab","mode_lock_until",0);;\
my $lock_active = ($now < $lock_until);;\
my $lock_time = 1800;;\
\
if($lastSwitch == 0)\
{\
  fhem("setreading LambdaWP last_mode_switch $now");;\
  $lastSwitch = $now;;\
}\
\
if(ReadingsNum("LambdaWP","default_boiler_set",-1) == -1)\
{\
  my $init = ReadingsNum("LambdaWP","BoilerMaxTempSetpoint",45);;\
  fhem("setreading LambdaWP default_boiler_set $init");;\
}\
\
my $default = ReadingsNum("LambdaWP","default_boiler_set",45);;\
\
if($lock_active)\
{\
  fhem("setreading $SELF dbg_lock_block 1");;\
  return;;\
}\
else\
{\
  fhem("setreading $SELF dbg_lock_block 0");;\
}\
\
my $cmds = "";;\
\
my $cond_runtime = (($now - $lastSwitch) > $min_runtime);;\
my $cond_not_defrost = ($hpmode ne "DEFROST");;\
\
my $cond_dhw_to_ch =\
(\
  $hpmode eq "DHW"\
  &&\
  $buffer < ($hc_target - 4)\
  &&\
  $pv > -1000\
);;\
\
my $cond_ch_to_dhw =\
(\
  $hpmode eq "CENTRAL_HEATING"\
  &&\
  $buffer > ($hc_target + 5)\
  &&\
  $boilerLow < ($boilerSet - 5)\
  &&\
  $pv < -4000\
);;\
\
my $cond_high_limit =\
(\
  $boilerSet > ($default + 2)\
  &&\
  $boilerHigh >= 50\
);;\
\
my $cond_reset =\
(\
  $hpmode eq "CENTRAL_HEATING"\
  &&\
  $pv > -800\
  &&\
  $boilerLow > ($default - 1)\
  &&\
  abs($boilerSet - $default) > 0.5\
);;\
\
my $dbg_reason = "none";;\
my $dbg_action = "none";;\
\
if($cond_not_defrost && $cond_runtime)\
{\
  if($cond_dhw_to_ch)\
  {\
    $dbg_reason = "DHW_to_CH";;\
    $dbg_action = "set_44";;\
\
    $cmds =\
    "setreading LambdaWP last_mode_switch $now;;;;".\
    "setreading LambdaWP last_auto_mode CENTRAL_HEATING;;;;".\
    "setreading $SELF mode_lock_until ".($now+$lock_time).";;;;".\
    "set LambdaWP BoilerMaxTempSetpoint 44";;\
  }\
\
  elsif($cond_ch_to_dhw)\
  {\
    $dbg_reason = "CH_to_DHW";;\
    $dbg_action = "set_50";;\
\
    $cmds =\
    "setreading LambdaWP last_mode_switch $now;;;;".\
    "setreading LambdaWP last_auto_mode DHW;;;;".\
    "setreading $SELF mode_lock_until ".($now+$lock_time).";;;;".\
    "set LambdaWP BoilerMaxTempSetpoint 50";;\
  }\
}\
\
if($cond_high_limit)\
{\
  $dbg_reason = "high_temp_limit";;\
  $dbg_action = "reset_default";;\
\
  $cmds .= ";;;;" if($cmds ne "");;\
  $cmds .= "set LambdaWP BoilerMaxTempSetpoint $default";;\
}\
\
if($cond_reset)\
{\
  $dbg_reason = "normal_reset";;\
  $dbg_action = "reset_default";;\
\
  $cmds .= ";;;;" if($cmds ne "");;\
  $cmds .= "set LambdaWP BoilerMaxTempSetpoint $default";;\
}\
\
fhem("setreading Lambda_DHW_vorab dbg_mode $hpmode");;\
fhem("setreading Lambda_DHW_vorab dbg_buffer $buffer");;\
fhem("setreading Lambda_DHW_vorab dbg_hc_target $hc_target");;\
fhem("setreading Lambda_DHW_vorab dbg_boilerLow $boilerLow");;\
fhem("setreading Lambda_DHW_vorab dbg_boilerHigh $boilerHigh");;\
fhem("setreading Lambda_DHW_vorab dbg_boilerSet $boilerSet");;\
fhem("setreading Lambda_DHW_vorab dbg_default $default");;\
fhem("setreading Lambda_DHW_vorab dbg_pv $pv");;\
\
fhem("setreading $SELF dbg_runtime_ok $cond_runtime");;\
fhem("setreading $SELF dbg_not_defrost $cond_not_defrost");;\
fhem("setreading $SELF dbg_dhw_to_ch $cond_dhw_to_ch");;\
fhem("setreading $SELF dbg_ch_to_dhw $cond_ch_to_dhw");;\
fhem("setreading $SELF dbg_high_limit $cond_high_limit");;\
fhem("setreading $SELF dbg_reset $cond_reset");;\
\
fhem("setreading $SELF dbg_lock_active $lock_active");;\
fhem("setreading $SELF dbg_lock_until $lock_until");;\
fhem("setreading $SELF dbg_runtime_sec ".($now-$lastSwitch));;\
\
fhem("setreading $SELF dbg_reason $dbg_reason");;\
fhem("setreading $SELF dbg_action $dbg_action");;\
fhem("setreading $SELF HP_mode $hpmode");;\
\
if($cmds ne "")\
{\
  fhem($cmds);;\
}\
}\
)
