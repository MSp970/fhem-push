my $age = ReadingsAge($src, "druck", 1e9);;\
my $druck = ReadingsVal($src, "druck", 0);;\
my $fraw = ReadingsVal($src, "durchfluss_aktiv", "off");;\
my $flowing = ($fraw =~ /^(on|1|true)$/i) ? 1 : 0;;\
my $cmd = ReadingsVal("DOIF_Brunnenpumpe_Komfort", "cmd", "off");;\
my $lock = ReadingsVal("DOIF_Brunnenpumpe_Komfort", "lock_until", 0);;\
my $drys = ReadingsVal("DOIF_Brunnenpumpe_Komfort", "dry_since", 0);;\
if ($status ne "online" or $age > 120) {\
  if ($cmd ne "off") { fhem("set $pumpe off");; fhem("setreading DOIF_Brunnenpumpe_Komfort cmd off");; }\
  if ($drys != 0) { fhem("setreading DOIF_Brunnenpumpe_Komfort dry_since 0");; }\
  fhem("setreading DOIF_Brunnenpumpe_Komfort mode offline_guard");;\
}\
elsif ($now < $lock) {\
  if ($cmd ne "off") { fhem("set $pumpe off");; fhem("setreading DOIF_Brunnenpumpe_Komfort cmd off");; }\
  if ($drys != 0) { fhem("setreading DOIF_Brunnenpumpe_Komfort dry_since 0");; }\
  fhem("setreading DOIF_Brunnenpumpe_Komfort mode lockout");;\
}\
else {\
  my $dry = ($cmd eq "on" and !$flowing and $druck < $p_dry) ? 1 : 0;;\
  if ($dry) {\
    if ($drys == 0) {\
      fhem("setreading DOIF_Brunnenpumpe_Komfort dry_since $now");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort mode dry_watch");;\
    }\
    elsif (($now - $drys) >= $t_dry) {\
      fhem("set $pumpe off");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort cmd off");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort lock_until " . ($now + $t_lock));;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort dry_since 0");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort mode dryrun_lock");;\
    }\
  }\
  else {\
    if ($drys != 0) { fhem("setreading DOIF_Brunnenpumpe_Komfort dry_since 0");; }\
    if ($cmd ne "on" and $druck < $p_on) {\
      fhem("set $pumpe on");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort cmd on");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort mode run");;\
    }\
    elsif ($cmd ne "off" and $druck >= $p_off) {\
      fhem("set $pumpe off");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort cmd off");;\
      fhem("setreading DOIF_Brunnenpumpe_Komfort mode idle");;\
    }\
  }\
}\
})
