attr openWB_Garage_links_Control stateFormat {\
  my $c = ReadingsNum($name,"chargecurrent",0);;\
  my $p = ReadingsNum($name,"power",0);;\
  my $mode = ReadingsVal($name,"chargemode","-");;\
  my $charging = ReadingsVal($name,"charging","idle");;\
  my $am = ReadingsVal("OpenWB_Garage_links","active_mode","");;\
\
  my %modeColor =\
  (\
    pv=>"green",\
    instant=>"dodgerblue",\
    eco=>"orange",\
    target=>"gold",\
    stop=>"lightgray"\
  );;\
  my $color = $modeColor{$mode} // "grey";;\
  my $status="⏸ wartet";;\
  $status="⚡ lädt" if($charging eq "charging");;\
  $status="⛔ stop" if($mode eq "stop");;\
  $status="🔌 ausgesteckt" if($am eq "unplugged");;\
  return "<span style='color:$color;;font-weight:bold'>\
  $status | Mode:$mode | Sollstrom ${c} A | ${p} kW\
  </span>";;\
}
attr openWB_Garage_links_Control userReadings charging {   ReadingsNum($name,"power",0) > 0.2 ? "charging" : "idle" }
define at_Tado_Refresh at +*00:05:00 get Tado_EG_HTTP RefreshToken
setuuid at_Tado_Refresh 6a88e60c-f33f-0e4e-d2a5-ecf5690d7251e43a
attr at_Tado_Refresh disable 0
attr at_Tado_Refresh verbose 2
define di_openWB_auto_links DOIF ([1s_2s_timer:tick] == 1)\
(\
{\
  my $now = time();;\
  my $DEV = "di_openWB_auto_links";;\
\
  my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
\
  my $grid = ReadingsNum("HA_SDM630M_Nergie","Power_Sum__W1",0);;\
\
  my $grid_prev = ReadingsNum($DEV,"grid_prev",$grid);;\
  my $grid_d    = abs($grid - $grid_prev);;\
  my $grid_vol  = ReadingsNum($DEV,"grid_vol",0);;\
  $grid_vol = (0.7 * $grid_vol) + (0.3 * $grid_d);;\
  fhem("setreading $DEV grid_prev ".int($grid));;\
  fhem("setreading $DEV grid_vol ".int($grid_vol));;\
\
  my $EVU_BEZUG_SCHWELLE = ReadingsNum("openWB_Garage_links_Control","evuBezugSchwelle",20);;\
  my $evu_bezug_erkannt = ($grid > $EVU_BEZUG_SCHWELLE) ? 1 : 0;;\
  fhem("setreading $DEV evu_bezug_erkannt $evu_bezug_erkannt");;\
\
  my $bat1      = ReadingsNum("GoodWe_Garage_Haus_West_5877","Power_Battery",0);;\
  my $bat2      = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Power_Battery",0);;\
  my $bat_total = $bat1 + $bat2;;\
\
  my $reserve     = ReadingsNum("openWB_Garage_links_Control","pvReserve",2000);;\
  my $stopReserve = ReadingsNum("openWB_Garage_links_Control","pvStopReserve",300);;\
\
  my $cm           = ReadingsVal("OpenWB_Garage_links","Ladepunkt_chargemode","stop");;\
  $cm = "instant" if($cm eq "instant_charging");;\
  $cm = "pv" if($cm eq "pv_charging");;\
  my $realCm = $cm;;\
  $realCm = "eco" if($realCm eq "eco_charging");;\
  $realCm = "target" if($realCm eq "target_charging");;\
  $realCm = "stop" if($realCm eq "standby");;\
  my $ctrlCm = ReadingsVal("openWB_Garage_links_Control","chargemode","pv");;\
  my $lockUntil = ReadingsVal("openWB_Garage_links_Control","manualStopLockUntil","");;\
  my @ltNow = localtime(time());;\
  my $nowStr = sprintf("%04d-%02d-%02d %02d:%02d:%02d",$ltNow[5]+1900,$ltNow[4]+1,$ltNow[3],$ltNow[2],$ltNow[1],$ltNow[0]);;\
  my $manualStopLockActive = ($lockUntil ne "" && $nowStr lt $lockUntil) ? 1 : 0;;\
  if($realCm ne "" && $realCm ne $ctrlCm)\
  {\
    my $cHash = $defs{"openWB_Garage_links_Control"};;\
    readingsSingleUpdate($cHash,"chargemode",$realCm,0) if($cHash);;\
    if($realCm eq "stop" && $ctrlCm ne "stop" && $cHash)\
    {\
      my $today8 = sprintf("%04d-%02d-%02d 08:00:00",$ltNow[5]+1900,$ltNow[4]+1,$ltNow[3]);;\
      my $lockTs = $today8;;\
      if($nowStr ge $today8)\
      {\
        my @ltTom = localtime(time()+86400);;\
        $lockTs = sprintf("%04d-%02d-%02d 08:00:00",$ltTom[5]+1900,$ltTom[4]+1,$ltTom[3]);;\
      }\
      readingsSingleUpdate($cHash,"manualStopLockUntil",$lockTs,0);;\
    }\
  }\
  my $charge_state = ReadingsVal("OpenWB_Garage_links","Ladepunkt_charge_state","False");;\
  my $power        = ReadingsNum("OpenWB_Garage_links","Ladeleistung_gesamt",0);;\
  fhem("setreading openWB_Garage_links_Control power ".sprintf("%.1f",$power/1000));;\
\
  my $ev_laedt_aktiv = ($charge_state eq "True" || $power > 50) ? 1 : 0;;\
\
  my $iL1 = ReadingsNum("OpenWB_Garage_links","Ladestrom_L1",0);;\
  my $iL2 = ReadingsNum("OpenWB_Garage_links","Ladestrom_L2",0);;\
  my $iL3 = ReadingsNum("OpenWB_Garage_links","Ladestrom_L3",0);;\
\
  my $phases_detected = 0;;\
  $phases_detected++ if($iL1 > 1);;\
  $phases_detected++ if($iL2 > 1);;\
  $phases_detected++ if($iL3 > 1);;\
\
  my $phases = ($phases_detected > 0)\
               ? $phases_detected\
               : ReadingsNum("OpenWB_Garage_links","Ladepunkt_Anzahl_Phasen",1);;\
  $phases = 1 if($phases < 1 || $phases > 3);;\
\
  my $minA       = ReadingsNum("openWB_Garage_links_Control","minCurrent",6);;\
  my $maxA       = ReadingsNum("openWB_Garage_links_Control","maxCurrent",32);;\
  my $phasePower = 230 * $phases;;\
\
  my $UP_GAIN     = ReadingsNum("openWB_Garage_links_Control","upGain",0.6);;\
  my $UP_STEP_MAX = ReadingsNum("openWB_Garage_links_Control","upStepMax",4);;\
  my $UP_DB       = ReadingsNum("openWB_Garage_links_Control","upDeadbandA",0.4);;\
  my $DN_STEP_MAX = ReadingsNum("openWB_Garage_links_Control","dnStepMax",8);;\
  my $DN_DB       = ReadingsNum("openWB_Garage_links_Control","dnDeadbandA",0.4);;\
  my $GRID_ALLOW  = ReadingsNum("openWB_Garage_links_Control","instantGridAllow",0);;\
\
  my $PL_SURPLUS_MAX = ReadingsNum("openWB_Garage_links_Control","phaseLockSurplusMax",2000);;\
  my $PL_VOL_MIN     = ReadingsNum("openWB_Garage_links_Control","phaseLockVolMin",400);;\
  my $PL_CUR_MIN     = ReadingsNum("openWB_Garage_links_Control","phaseLockCurrentMin",25);;\
  my $PL_MIN_SEC     = ReadingsNum("openWB_Garage_links_Control","phaseLockMinSec",900);;\
  my $PL_UNLOCK_EINS = ReadingsNum("openWB_Garage_links_Control","phaseUnlockEinspeis",5000);;\
\
  my $einspeis = ReadingsNum("HA_SDM630M_Nergie","Einspeiseleistung",0);;\
\
  my $limitW = ReadingsNum("openWB_Garage_links_Control","aktivFeedLimitW",99999);;\
my $bat_laden = ($bat_total < 0) ? -$bat_total : 0;;\
  my $abregelung = ($limitW < 99999\
    && ($einspeis + $bat_laden) >= 0.9 * $limitW) ? 1 : 0;;\
	fhem("setreading $DEV abregelung_aktiv $abregelung");;\
\
  my $eins_prev = ReadingsNum($DEV,"einspeis_prev",$einspeis);;\
  my $vol_ema   = ReadingsNum($DEV,"einspeis_vol",0);;\
  my $eins_d    = abs($einspeis - $eins_prev);;\
  $vol_ema = (0.7 * $vol_ema) + (0.3 * $eins_d);;\
  fhem("setreading $DEV einspeis_prev ".int($einspeis));;\
  fhem("setreading $DEV einspeis_vol ".int($vol_ema));;\
\
  my $VOL_PV_THRESH = ReadingsNum("openWB_Garage_links_Control","volPvThreshold",600);;\
  my $vol_kombi = ($vol_ema > $grid_vol) ? $vol_ema : $grid_vol;;\
  fhem("setreading $DEV vol_kombi ".int($vol_kombi));;\
  my $volatiler_pv_ertrag = ($vol_kombi > $VOL_PV_THRESH) ? 1 : 0;;\
  fhem("setreading $DEV volatiler_pv_ertrag $volatiler_pv_ertrag");;\
\
  my $VOL_RESERVE_FACTOR = ReadingsNum("openWB_Garage_links_Control","volReserveFactor",1.0);;\
  my $VOL_RELEASE_SEC    = ReadingsNum("openWB_Garage_links_Control","volReleaseSec",120);;\
\
  my $vol_zuschlag_roh = $vol_kombi - $VOL_PV_THRESH;;\
  $vol_zuschlag_roh = 0 if($vol_zuschlag_roh < 0);;\
  $vol_zuschlag_roh = $vol_zuschlag_roh * $VOL_RESERVE_FACTOR;;\
\
