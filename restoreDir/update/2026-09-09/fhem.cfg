define modbus_parser notify HA_Modbus_2_Slave:.* {\
  my $raw = ReadingsVal("HA_Modbus_2_Slave","response","");;\
  \
  # Register 71 = Adresse 71 * 2 = Byte-Offset 142 (weil jedes Register 2 Bytes)\
  # Float = 4 Bytes = 8 Hex-Zeichen\
  my $hex = substr($raw, 142, 8);;\
\
  # Float dekodieren (Big Endian)\
  my $float = unpack("f>", pack("H*", $hex));;\
\
  fhem("setreading gegm3000_dummy Register71_Float $float");;\
}\

