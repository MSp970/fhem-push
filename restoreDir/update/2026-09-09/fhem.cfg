define DOIF_Grundlast_Profil DOIF ([+00:01:00])\
({\
use POSIX qw(floor);;\
\
my $now  = time();;\
my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
\
my $DEV  = "DOIF_Grundlast_Profil";;\
\
my $NACHT_VON = 20;;\
my $NACHT_BIS =  8;;\
my $ist_nacht = ($hour >= $NACHT_VON || $hour < $NACHT_BIS);;\
\
my $gl_aktuell = ReadingsNum("HA_SDM630M_Nergie","Summe_Leistungsbezug_Haus_gesamt",0);;\
my $wp_aktuell = ReadingsNum("LambdaWP","HP_akt_elektr_Leistungsaufnahme",0) * 1000;;\
\
my $lade_5877  = abs(ReadingsNum("GoodWe_Garage_Haus_West_5877","Ladeleistung",0));;\
my $lade_5876  = abs(ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Ladeleistung",0));;\
my $entl_5877  = abs(ReadingsNum("GoodWe_Garage_Haus_West_5877","Entladeleistung",0));;\
my $entl_5876  = abs(ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Entladeleistung",0));;\
my $batt_netto = ($entl_5877 + $entl_5876) - ($lade_5877 + $lade_5876);;\
\
my $gl_bereinigt = $gl_aktuell + $batt_netto;;\
$gl_bereinigt = 0 if($gl_bereinigt < 0);;\
\
my $ev_leistung = ReadingsNum("OpenWB","Ladepunkt_Leistung",0);;\
my $ev_laedt    = (ReadingsVal("OpenWB","Ladepunkt_charge_state","False") eq "True"\
                   && $ev_leistung > 200) ? 1 : 0;;\
my $ev_w        = $ev_laedt ? $ev_leistung : 0;;\
\
my $gl_ohne_ev  = $gl_bereinigt - $ev_w;;\
$gl_ohne_ev     = 0 if($gl_ohne_ev < 0);;\
\
my $GL_MIN_W  = ReadingsNum("EMS_Control","grundlastMin",150);;\
my $ALPHA_7D  = 1.0 / (7 * 60);;\
\
my $hkey      = sprintf("h%02d_sum",    $hour);;\
my $nkey      = sprintf("h%02d_cnt",    $hour);;\
my $ekey      = sprintf("h%02d_ev_sum", $hour);;\
my $akey      = sprintf("gl_avg_h%02d", $hour);;\
my $eakey     = sprintf("grundlast_h%02d_ohne_ev", $hour);;\
my $vkey      = sprintf("gl_valid_h%02d", $hour);;\
\
my $sum     = ReadingsNum($DEV, $hkey, 0);;\
my $cnt     = ReadingsNum($DEV, $nkey, 0);;\
my $ev_sum  = ReadingsNum($DEV, $ekey, 0);;\
\
$sum    += $gl_bereinigt;;\
$cnt    += 1;;\
$ev_sum += $ev_w;;\
\
if($cnt > 7 * 60)\
{\
    $sum    = $gl_bereinigt;;\
    $cnt    = 1;;\
    $ev_sum = $ev_w;;\
}\
\
fhem("setreading $DEV $hkey ".sprintf("%.0f",$sum));;\
fhem("setreading $DEV $nkey $cnt");;\
fhem("setreading $DEV $ekey ".sprintf("%.0f",$ev_sum));;\
\
my $avg_raw    = ($cnt > 0) ? int($sum / $cnt)    : int($gl_bereinigt);;\
my $ev_avg_raw = ($cnt > 0) ? int($ev_sum / $cnt) : int($ev_w);;\
\
my $avg        = ($avg_raw >= $GL_MIN_W) ? $avg_raw : $GL_MIN_W;;\
my $avg_ohne_ev = $avg_raw - $ev_avg_raw;;\
$avg_ohne_ev    = $GL_MIN_W if($avg_ohne_ev < $GL_MIN_W);;\
\
my $avg_valid  = ($cnt >= 5) ? 1 : 0;;\
\
fhem("setreading $DEV $akey $avg")    if($avg_valid);;\
fhem("setreading $DEV $eakey $avg_ohne_ev") if($avg_valid);;\
fhem("setreading $DEV $vkey $avg_valid");;\
\
if($ist_nacht)\
{\
    if($avg_valid)\
    {\
        fhem("setreading DOIF_GoodWe_simple grundlast_profil_h $avg");;\
        fhem("setreading $DEV grundlast_profil_h $avg");;\
    }\
    fhem("setreading DOIF_GoodWe_simple grundlast_profil_stunde $hour");;\
}\
\
fhem("setreading $DEV gl_aktuell ".int($gl_aktuell));;\
fhem("setreading $DEV gl_bereinigt ".int($gl_bereinigt));;\
fhem("setreading $DEV gl_ohne_ev ".int($gl_ohne_ev));;\
fhem("setreading $DEV ev_aktuell ".int($ev_w));;\
fhem("setreading $DEV wp_aktuell ".int($wp_aktuell));;\
fhem("setreading $DEV last_update ".int($now));;\
})
