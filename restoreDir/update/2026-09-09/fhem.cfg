define DOIF_socMax_adaptiv DOIF ([12:00])\
({\
use Time::Local;;\
\
my $now = time();;\
my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
my $DEV = "DOIF_socMax_adaptiv";;\
\
my $SOCMAX_MIN       = 80;;\
my $SOCMAX_MAX       = 98;;\
my $SOCMAX_STEP      = 2;;\
my $SOCMIN_FEST      = 5;;\
my $TEMP_NEUTRAL     = 10;;\
my $TEMP_KALT        = -5;;\
my $PV_SOMMER_REF    = 25;;\
my $EINSPEIS_AB_SOC  = 90;;\
\
my $cap1     = ReadingsNum("EMS_Control","capacity1",10);;\
my $cap2     = ReadingsNum("EMS_Control","capacity2",5);;\
my $cap_ges  = $cap1 + $cap2;;\
\
my $soc1     = ReadingsNum("GoodWe_Garage_Haus_West_5877","SOC",0);;\
my $soc2     = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","SOC",0);;\
my $socMax1_alt = ReadingsNum("EMS_Control","socMax1",80);;\
my $socMax2_alt = ReadingsNum("EMS_Control","socMax2",80);;\
my $socMax_alt  = ($socMax1_alt + $socMax2_alt) / 2;;\
\
my $grundlast   = ReadingsNum("HA_SDM630M_Nergie","Summe_Leistungsbezug_Haus_gesamt",500);;\
my $aussentemp  = ReadingsNum("LambdaWP","AmbientTempAvg",10);;\
my $pv_bisher   = ReadingsNum("HA_SDM630M_PV_Erzeugung","Erz_PV_Energie_kWh_day",0);;\
\
my $pv_rest = 0;;\
for(my $i = $hour;; $i <= 22;; $i++)\
{\
    my $key = sprintf("charge_curve_%02d", $i);;\
    $pv_rest += ReadingsNum("DOIF_PV_forecast_Batterie_laden",$key,0);;\
}\
\
my $pv_gesamt_heute = $pv_bisher + $pv_rest;;\
\
my @pv_history = ();;\
for(my $d = 0;; $d <= 6;; $d++)\
{\
    my $key = sprintf("pv_ertrag_d%d", $d);;\
    my $val = ReadingsNum($DEV,$key,-1);;\
    push @pv_history, $val if($val >= 0);;\
}\
\
my $pv_avg_7d = 0;;\
if(@pv_history > 0)\
{\
    my $sum = 0;;\
    $sum += $_ for @pv_history;;\
    $pv_avg_7d = $sum / scalar(@pv_history);;\
}\
else\
{\
    $pv_avg_7d = $pv_gesamt_heute;;\
}\
\
for(my $d = 5;; $d >= 0;; $d--)\
{\
    my $from = sprintf("pv_ertrag_d%d", $d);;\
    my $to   = sprintf("pv_ertrag_d%d", $d+1);;\
    my $val  = ReadingsNum($DEV,$from,-1);;\
    fhem("setreading $DEV $to $val") if($val >= 0);;\
}\
fhem("setreading $DEV pv_ertrag_d0 ".sprintf("%.2f",$pv_gesamt_heute));;\
fhem("setreading $DEV pv_avg_7d ".sprintf("%.2f",$pv_avg_7d));;\
\
my $pv_faktor = 0;;\
if($PV_SOMMER_REF > 0)\
{\
    $pv_faktor = 1 - ($pv_avg_7d / $PV_SOMMER_REF);;\
    $pv_faktor = 0 if($pv_faktor < 0);;\
    $pv_faktor = 1 if($pv_faktor > 1);;\
}\
\
my $temp_faktor = 0;;\
if($aussentemp < $TEMP_NEUTRAL)\
{\
    $temp_faktor = ($TEMP_NEUTRAL - $aussentemp) / ($TEMP_NEUTRAL - $TEMP_KALT);;\
    $temp_faktor = 0 if($temp_faktor < 0);;\
    $temp_faktor = 1 if($temp_faktor > 1);;\
}\
\
my $kombi_faktor = $pv_faktor * 0.7 + $temp_faktor * 0.3;;\
\
my $socMax_ziel = $SOCMAX_MIN + ($SOCMAX_MAX - $SOCMAX_MIN) * $kombi_faktor;;\
$socMax_ziel = int($socMax_ziel + 0.5);;\
\
my $socMax_neu = $socMax_alt;;\
if($socMax_ziel > $socMax_alt + $SOCMAX_STEP)\
{\
    $socMax_neu = $socMax_alt + $SOCMAX_STEP;;\
}\
elsif($socMax_ziel < $socMax_alt - $SOCMAX_STEP)\
{\
    $socMax_neu = $socMax_alt - $SOCMAX_STEP;;\
}\
else\
{\
    $socMax_neu = $socMax_ziel;;\
}\
$socMax_neu = $SOCMAX_MIN if($socMax_neu < $SOCMAX_MIN);;\
$socMax_neu = $SOCMAX_MAX if($socMax_neu > $SOCMAX_MAX);;\
\
my $stunden_bis_sonnenaufgang = 0;;\
for(my $i = $hour + 1;; $i <= 30;; $i++)\
{\
    my $h = $i % 24;;\
    my $key = sprintf("charge_curve_%02d", $h);;\
    my $pv_h = ReadingsNum("DOIF_PV_forecast_Batterie_laden",$key,0);;\
    last if($pv_h > 0.3);;\
    $stunden_bis_sonnenaufgang++;;\
}\
\
my $nacht_verbrauch_est = ($grundlast / 1000) * $stunden_bis_sonnenaufgang;;\
\
my $soc_aktuell_avg = ($soc1 + $soc2) / 2;;\
my $energie_im_speicher = $cap_ges * $soc_aktuell_avg / 100;;\
my $energie_ueber_min   = $cap_ges * ($soc_aktuell_avg - $SOCMIN_FEST) / 100;;\
\
my $nacht_reserve_noetig = ($nacht_verbrauch_est > $energie_ueber_min) ? 1 : 0;;\
\
my $socMin_nacht_noetig = 0;;\
if($cap_ges > 0)\
{\
    $socMin_nacht_noetig = int($nacht_verbrauch_est / $cap_ges * 100 + 0.5) + $SOCMIN_FEST;;\
    $socMin_nacht_noetig = $SOCMIN_FEST if($socMin_nacht_noetig < $SOCMIN_FEST);;\
    $socMin_nacht_noetig = 95 if($socMin_nacht_noetig > 95);;\
}\
\
my $soc_ausreichend = ($soc_aktuell_avg >= $socMin_nacht_noetig) ? 1 : 0;;\
\
my $pv_rest_reicht = ($pv_rest >= ($socMin_nacht_noetig - $soc_aktuell_avg) / 100 * $cap_ges) ? 1 : 0;;\
\
my $entladen_erlaubt = ($soc_ausreichend || $pv_rest_reicht) ? 1 : 0;;\
\
my $einspeis_aktiv = ($socMax_neu < $EINSPEIS_AB_SOC) ? 1 : 0;;\
\
fhem("setreading EMS_Control socMax1 $socMax_neu");;\
fhem("setreading EMS_Control socMax2 $socMax_neu");;\
fhem("setreading DOIF_GoodWe_simple entladen_erlaubt $entladen_erlaubt");;\
fhem("setreading DOIF_GoodWe_simple einspeis_aktiv $einspeis_aktiv");;\
fhem("setreading DOIF_GoodWe_simple soc_nacht_noetig $socMin_nacht_noetig");;\
\
fhem("setreading $DEV socMax_alt $socMax_alt");;\
fhem("setreading $DEV socMax_neu $socMax_neu");;\
fhem("setreading $DEV socMax_ziel $socMax_ziel");;\
fhem("setreading $DEV pv_rest ".sprintf("%.2f",$pv_rest));;\
fhem("setreading $DEV pv_gesamt_heute ".sprintf("%.2f",$pv_gesamt_heute));;\
fhem("setreading $DEV nacht_verbrauch_est ".sprintf("%.2f",$nacht_verbrauch_est));;\
fhem("setreading $DEV stunden_bis_sa $stunden_bis_sonnenaufgang");;\
fhem("setreading $DEV soc_nacht_noetig $socMin_nacht_noetig");;\
fhem("setreading $DEV soc_ausreichend $soc_ausreichend");;\
fhem("setreading $DEV pv_rest_reicht $pv_rest_reicht");;\
fhem("setreading $DEV entladen_erlaubt $entladen_erlaubt");;\
fhem("setreading $DEV einspeis_aktiv $einspeis_aktiv");;\
fhem("setreading $DEV pv_faktor ".sprintf("%.2f",$pv_faktor));;\
fhem("setreading $DEV temp_faktor ".sprintf("%.2f",$temp_faktor));;\
fhem("setreading $DEV kombi_faktor ".sprintf("%.2f",$kombi_faktor));;\
fhem("setreading $DEV aussentemp ".sprintf("%.1f",$aussentemp));;\
fhem("setreading $DEV last_run ".int($now));;\
})\

