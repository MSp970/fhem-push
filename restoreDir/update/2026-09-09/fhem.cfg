attr EMS_Control comment Batterie-Grunddaten\
capacity1 / capacity2 — Nutzkapazität der beiden Speicher (5877/5876) in kWh. Basis für Restenergie-Berechnung und kapazitätsgewichtete Auf­teilung.\
socMax1 / socMax2 — Oberer Ladeschluss je Speicher in %. Bis hierhin wird geladen, darüber gilt die Batterie als voll.\
socMin1 / socMin2 — Untere Entladegrenze je Speicher in %. Darunter wird nicht mehr entladen (Reserve/Schutz).\
maxPower1 / maxPower2 — Maximale Ladeleistung je Wechselrichter in W. Deckel für die Ladeaufteilung.\
maxDischargePower1 / maxDischargePower2 — Maximale Entladeleistung je WR in W. Deckel für Master-Sollwert und Slave-Anteil in der Nacht.\
Bypass (BMS-Notfall)\
bypassBat5877 / bypassBat5876 — Schalter (0/1), nimmt einen Speicher aus der Logik und lädt ihn ungebremst voll. Für den Fall, dass ein BMS den SOC verliert (dein 5877-Problem).\
socMax-Automatik\
socMaxFloor / socMaxCeil — Unter-/Obergrenze, innerhalb derer die tägliche socMax-Anpassung bleibt. Verhindert, dass die Automatik zu tief oder zu hoch stellt.\
\
Laden – Leistung & Rampe\
ladeAnfahrW — Anfahrleistung beim Ladestart in W. Sanftes Einschalten statt Sprung.\
ladeStepW — Schrittweite, um die die Ladeleistung je Intervall hochrampt.\
ladeRampIntervall — Sekunden zwischen zwei Rampenschritten. Bestimmt, wie schnell die Ladung hochfährt.\
ladeMaxW5877 / ladeMaxW5876 — Maximale Ladeleistung pro Speicher in W (3000/2000). Deckel der Rampe je Batterie.\
ladeEinspeisReserve — Einspeise-Sockel beim Laden in W. So viel PV wird bewusst ins Netz gelassen, statt alles in die Batterie zu ziehen.\
Laden – Taper (Feinabschluss)\
ladeTaperHochProzent — Abstand zu socMax (%), ab dem die Ladeleistung halbiert wird (4 %).\
ladeTaperNiedProzent — Abstand zu socMax (%), ab dem nochmals geviertelt wird (2 %). Sanftes Vollladen ohne harten Stopp.\
\
Nacht – Netzziel & Deckung\
nachtEinspeisMaxW — Gewünschte Einspeisung in W bei voller Batterie (Sommer-Ende des Gleitbereichs).\
nachtBezugMaxW — Erlaubter Bezug in W bei knapper Batterie (Winter-Ende). Batterie wird bewusst gestreckt.\
nachtDeckungHoch / nachtDeckungNiedrig — Deckungsgrad-Schwellen (Reserve/Nachtbedarf), zwischen denen das Netzziel von Einspeisung nach Bezug gleitet.\
Nacht – Master/Slave-Regelung\
slaveLastAnteil — Anteil der Grundlast, den der Slave-WR konstant trägt (0.8). Höher = ruhiger, weil der Master weniger ausgleichen muss.\
slaveNachfuehrIntervall — Sekunden, nach denen der konstante Slave-Wert neu berechnet wird (900 = 15 min).\
masterEinspeisOffset — Fester Korrekturwert auf den Master-Sollwert in W. Gleicht systematische Soll-Ist-Abweichung des WR aus.\
masterOffsetAuto — Schalter (0/1), ob der Offset automatisch minütlich nachgeführt wird. Aus = fester Wert.\
masterOffsetTotband / masterOffsetStepW / masterOffsetMaxW — Totband, Schrittweite und Deckel der Auto-Offset-Nachführung. Nur aktiv bei masterOffsetAuto=1.\
masterSollMinW — Untergrenze des Master-Sollwerts in W. Auf 0 = keine Einspeisung minimal;; negativ setzen, falls der WR Bezug-Sollwerte annimmt (Winter).\
\
Modus-Schwellen (wann welcher Betrieb greift)\
beideMode1EinspeisMin — Einspeise-Schwelle, ab der beide WR in Mode 1 gehen (echter Mittagsüberschuss).\
einzelLadenEinspeisMin — Einspeise-Schwelle für den Einzel-Lademodus (mittlerer Überschuss, eine Batterie lädt).\
uebEinspeisMax — Obergrenze Einspeisung, bis zu der der uebergang-Modus gilt.\
minPvForExport — Mindest-PV-Leistung, ab der überhaupt Überschuss ins Netz/Batterie verteilt wird.\
pvLatchMinW — PV-Schwelle, ab der der „PV-war-heute-aktiv"-Latch setzt. Steuert Tag/Nacht-Umschaltung.\
clipLimit — Einspeise-Obergrenze (20000 W), ab der bei Überschuss extra in die Batterie geschoben wird (Abregelung vermeiden).\
\
Sommer-Einspeisung\
sommerVonMonat / sommerBisMonat — Monatsbereich (5–9), in dem die Sommer-Einspeisungslogik gilt.\
sommerEinspeisMaxW — Einspeise-Obergrenze, unter der im Sommer bei voller Batterie der uebergang-Modus greift.\
einspeisSockelSommer — Einspeise-Sockel in W für den Sommer-Nachtbetrieb bei komfortabler Reserve.\
einspeisZielNacht / einspeisZielUebergang — Einspeise-Sollwerte für die klassischen nacht-/uebergang-Fälle (Altbestand, vom Mode-3-Zweig genutzt).\
Sende-Steuerung (Modbus-Schonung)\
sendSchwelleEntlade — Mindeständerung in W, ab der ein neuer Entlade-Sollwert an den WR geht (jetzt 25). War der 150er-Bug.\
sendIntervallEntlade — Mindestabstand in s zwischen zwei Sends. Verhindert Modbus-Flut.\
sendHeartbeatEntlade — Intervall, nach dem der Sollwert auch ohne Änderung neu gesendet wird (0 = aus). Gegen „WR vergisst Wert".\
\
EV/PV-Reserve\
pvReserve — PV-Reserve in W, die beim EV-Laden bzw. Export freigehalten wird, bevor die Batterie dran ist.\
\
