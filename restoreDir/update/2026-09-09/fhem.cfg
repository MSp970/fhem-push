define n_Aktien_Config notify Aktien_Config:(add_isin|del_isin):.*|Aktien_Config:update|Aktien_Universum:(add_isin|del_isin):.*|Aktien_Universum:scan {\
  my $dev = $NAME;;;;\
  if ($EVENT =~ /^update/) {\
    AktienKurseUpdate();;;;\
    return;;;;\
  }\
  if ($EVENT =~ /^scan/) {\
    AktienUniversumNamen();;;;\
    AktienUniversumScan();;;;\
    return;;;;\
  }\
  my $rd = ($dev eq "Aktien_Universum")\
    ? "universe_list" : "isin_list";;;;\
  my $l = ReadingsVal($dev,$rd,"");;;;\
  my ($cmd,$v) = ($EVENT =~ /^(\w+): (\S+)$/);;;;\
  my %h = map {$_=>1} grep {$_ ne ""} split /,/, $l;;;;\
  if ($cmd eq "add_isin") { $h{$v} = 1 }\
  else { delete $h{$v} }\
  fhem("set $dev $rd " . join(",", sort keys %h));;;;\
}
