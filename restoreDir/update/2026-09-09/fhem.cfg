\
my $minA = ReadingsNum("openWB_Garage_rechts_Control","minCurrent",6);;\
my $maxA = ReadingsNum("openWB_Garage_rechts_Control","maxCurrent",32);;\
my $phasePower = 230 * $phases;;\
\
my $UP_GAIN = ReadingsNum("openWB_Garage_rechts_Control","upGain",0.6);;\
my $UP_STEP_MAX = ReadingsNum("openWB_Garage_rechts_Control","upStepMax",4);;\
my $UP_DB = ReadingsNum("openWB_Garage_rechts_Control","upDeadbandA",0.4);;\
my $DN_STEP_MAX = ReadingsNum("openWB_Garage_rechts_Control","dnStepMax",8);;\
my $DN_DB = ReadingsNum("openWB_Garage_rechts_Control","dnDeadbandA",0.4);;\
my $GRID_ALLOW = ReadingsNum("openWB_Garage_rechts_Control","instantGridAllow",0);;\
\
my $PL_SURPLUS_MAX = ReadingsNum("openWB_Garage_rechts_Control","phaseLockSurplusMax",2000);;\
