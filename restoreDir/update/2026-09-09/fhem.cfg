define DOIF_nacht_einspeis DOIF ([+00:15:00] or [DOIF_PV_forecast_Batterie_laden])\
({\
my $now = time();;\
my ($sec,$min,$hour,$mday,$mon,$year) = localtime($now);;\
my $month = $mon + 1;;\
\
my $DEV      = "DOIF_nacht_einspeis";;\
my $DEV_GW   = "DOIF_GoodWe_simple";;\
my $DEV_FC   = "DOIF_PV_forecast_Batterie_laden";;\
my $DEV_EMS  = "EMS_Control";;\
\
my $soc1     = ReadingsNum("GoodWe_Garage_Haus_West_5877","SOC",0);;\
my $soc2     = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","SOC",0);;\
my $cap1     = ReadingsNum($DEV_EMS,"capacity1",10);;\
my $cap2     = ReadingsNum($DEV_EMS,"capacity2",5);;\
my $socMin1  = ReadingsNum($DEV_EMS,"socMin1",10);;\
my $socMin2  = ReadingsNum($DEV_EMS,"socMin2",10);;\
my $socMax1  = ReadingsNum($DEV_EMS,"socMax1",80);;\
my $socMax2  = ReadingsNum($DEV_EMS,"socMax2",80);;\
\
my $master_dev      = ReadingsVal($DEV_GW,"master_discharger","GoodWe_Garage_Haus_West_5877");;\
my $master_is_5877  = ($master_dev eq "GoodWe_Garage_Haus_West_5877");;\
my $soc_master      = $master_is_5877 ? $soc1 : $soc2;;\
my $socMin_master   = $master_is_5877 ? $socMin1 : $socMin2;;\
\
my $soc_verfuegbar_wh =\
    ($cap1 * ($soc1 - $socMin1) / 100) +\
    ($cap2 * ($soc2 - $socMin2) / 100);;\
$soc_verfuegbar_wh = 0 if($soc_verfuegbar_wh < 0);;\
\
my $forecast_morgen_kwh      = ReadingsNum($DEV_FC,"forecast_tomorrow_kwh",0);;\
my $nacht_verbrauch_kwh      = ReadingsNum($DEV_FC,"nacht_verbrauch_forecast_kwh",0);;\
my $bat_leer_wh_global       =\
    (($socMax1 - $soc1) / 100 * $cap1 * 1000) +\
    (($socMax2 - $soc2) / 100 * $cap2 * 1000);;\
my $bat_leer_kwh = $bat_leer_wh_global / 1000;;\
\
my $temp_min = ReadingsNum("DWD","fc1_Tn",99);;\
\
my $ist_winter = ($month >= 11 || $month <= 2);;\
my $ist_uebergang = ($month == 3 || $month == 10);;\
my $ist_sommer = (!$ist_winter && !$ist_uebergang);;\
\
my $einspeis_ziel_nacht_sommer   = ReadingsNum($DEV_EMS,"einspeisZielNachtSommer",100);;\
my $einspeis_ziel_nacht_uebergang = ReadingsNum($DEV_EMS,"einspeisZielNachtUebergang",50);;\
my $einspeis_ziel_nacht_winter   = ReadingsNum($DEV_EMS,"einspeisZielNachtWinter",0);;\
\
my $grund_soc_grenze_sommer   = 50;;\
my $grund_soc_grenze_uebergang = 60;;\
my $grund_soc_grenze_winter   = 70;;\
\
my $grund_forecast_faktor_sommer   = 1.2;;\
my $grund_forecast_faktor_uebergang = 1.5;;\
my $grund_forecast_faktor_winter   = 2.0;;\
\
my $soc_grenze        = $ist_sommer ? $grund_soc_grenze_sommer\
                      : $ist_uebergang ? $grund_soc_grenze_uebergang\
                      : $grund_soc_grenze_winter;;\
\
my $forecast_faktor   = $ist_sommer ? $grund_forecast_faktor_sommer\
                      : $ist_uebergang ? $grund_forecast_faktor_uebergang\
                      : $grund_forecast_faktor_winter;;\
\
my $einspeis_ziel = $ist_sommer   ? $einspeis_ziel_nacht_sommer\
                  : $ist_uebergang ? $einspeis_ziel_nacht_uebergang\
                  : $einspeis_ziel_nacht_winter;;\
\
my $grund_morgen_ausreichend = ($forecast_morgen_kwh >= $bat_leer_kwh * $forecast_faktor) ? 1 : 0;;\
\
\
my $soc_gesamt = ($soc1 * $cap1 + $soc2 * $cap2) / ($cap1 + $cap2);;\
my $grund_soc_ausreichend    = ($soc_gesamt >= $soc_grenze) ? 1 : 0;;\
\
\
\
my $grund_nacht_gedeckt      = ($soc_verfuegbar_wh >= $nacht_verbrauch_kwh * 1.2) ? 1 : 0;;\
my $grund_kein_frost         = (!$ist_winter || $temp_min >= 2) ? 1 : 0;;\
\
my $erlaubt = (\
    $grund_morgen_ausreichend\
    && $grund_soc_ausreichend\
    && $grund_nacht_gedeckt\
    && $grund_kein_frost\
) ? 1 : 0;;\
\
fhem("setreading $DEV nacht_einspeis_erlaubt $erlaubt");;\
fhem("setreading $DEV einspeis_ziel_nacht $einspeis_ziel");;\
fhem("setreading $DEV dbg_monat $month");;\
fhem("setreading $DEV dbg_jahreszeit ".($ist_sommer ? "sommer" : $ist_uebergang ? "uebergang" : "winter"));;\
fhem("setreading $DEV dbg_soc_master $soc_master");;\
fhem("setreading $DEV dbg_soc_grenze $soc_grenze");;\
fhem("setreading $DEV dbg_soc_verfuegbar_wh ".sprintf("%.0f",$soc_verfuegbar_wh * 1000));;\
fhem("setreading $DEV dbg_forecast_morgen_kwh ".sprintf("%.2f",$forecast_morgen_kwh));;\
fhem("setreading $DEV dbg_bat_leer_kwh ".sprintf("%.2f",$bat_leer_kwh));;\
fhem("setreading $DEV dbg_forecast_faktor $forecast_faktor");;\
fhem("setreading $DEV dbg_nacht_verbrauch_kwh ".sprintf("%.2f",$nacht_verbrauch_kwh));;\
fhem("setreading $DEV dbg_temp_min $temp_min");;\
fhem("setreading $DEV dbg_morgen_ausreichend $grund_morgen_ausreichend");;\
fhem("setreading $DEV dbg_soc_ausreichend $grund_soc_ausreichend");;\
fhem("setreading $DEV dbg_nacht_gedeckt $grund_nacht_gedeckt");;\
fhem("setreading $DEV dbg_kein_frost $grund_kein_frost");;\
fhem("setreading $DEV last_update ".int($now));;\
fhem("setreading $DEV dbg_soc_master ".sprintf("%.1f",$soc_gesamt));;\
\
if($erlaubt)\
{\
    fhem("setreading $DEV_EMS einspeisZielNacht $einspeis_ziel");;\
}\
else\
{\
    fhem("setreading $DEV_EMS einspeisZielNacht 0");;\
}\
})
