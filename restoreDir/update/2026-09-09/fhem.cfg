define di_garage_eingaenge_gross DOIF (\
  [dingtian_relay84630:i1]\
  or [dingtian_relay84630:i2]\
  or [dingtian_relay84630:i3]\
  or [dingtian_relay84630:i4]\
  or [dingtian_relay84630:i5]\
  or [dingtian_relay84630:i6]\
)\
(\
  {\
    my $DEV = "dingtian_relay84630";;;;\
    my $i1 = ReadingsVal($DEV,"i1","OFF");;;;\
    my $i2 = ReadingsVal($DEV,"i2","OFF");;;;\
    my $i3 = ReadingsVal($DEV,"i3","OFF");;;;\
    my $i4 = ReadingsVal($DEV,"i4","OFF");;;;\
    my $l1 = ReadingsVal($DEV,"taster_last_i1","OFF");;;;\
    my $l2 = ReadingsVal($DEV,"taster_last_i2","OFF");;;;\
    my $l3 = ReadingsVal($DEV,"taster_last_i3","OFF");;;;\
    if($i2 eq "ON" and $l2 eq "OFF") {\
      my $cur = ReadingsVal($DEV,"r2","OFF");;;;\
      my $new = ($cur eq "ON") ? "OFF" : "ON";;;;\
      fhem("set $DEV Lampe_vorne $new");;;;\
    }\
    if($i3 eq "ON" and $l3 eq "OFF") {\
      my $cur = ReadingsVal($DEV,"r3","OFF");;;;\
      my $new = ($cur eq "ON") ? "OFF" : "ON";;;;\
      fhem("set $DEV Lampe_hinten $new");;;;\
    }\
    if($i1 eq "ON" and $l1 eq "OFF") {\
      fhem("set $DEV Torimpuls ON");;;;\
      RemoveInternalTimer("grg_gross_torimpuls_off");;;;\
      InternalTimer(gettimeofday()+0.5, sub { fhem("set dingtian_relay84630 Torimpuls OFF") }, "grg_gross_torimpuls_off");;;;\
    }\
    fhem("setreading $DEV taster_last_i1 $i1");;;;\
    fhem("setreading $DEV taster_last_i2 $i2");;;;\
    fhem("setreading $DEV taster_last_i3 $i3");;;;\
    if($i4 eq "ON") {\
      fhem("set Garagentuer_gross geschlossen");;;;\
    } else {\
      fhem("set Garagentuer_gross offen");;;;\
    }\
    my $travel_gross = 22;;;;\
    my $debounce_gross = 0.7;;;;\
    my $tmo_gross = sub {\
      my $a5 = ReadingsVal($DEV,"i5","OFF");;;;\
      my $a6 = ReadingsVal($DEV,"i6","OFF");;;;\
      if($a5 eq "ON" and $a6 eq "OFF") {\
        fhem("set Garagentor_gross geoeffnet");;;;\
      } elsif($a5 eq "OFF" and $a6 eq "ON") {\
        fhem("set Garagentor_gross geschlossen");;;;\
      } elsif($a5 eq "ON" and $a6 eq "ON") {\
        fhem("set Garagentor_gross Fehler");;;;\
      } else {\
        fhem("set Garagentor_gross Zwischenstellung");;;;\
      }\
    };;;;\
    my $confirm_gross = sub {\
      my $c5 = ReadingsVal($DEV,"i5","OFF");;;;\
      my $c6 = ReadingsVal($DEV,"i6","OFF");;;;\
      if($c5 eq "OFF" and $c6 eq "OFF") {\
        my $p = ReadingsVal("Garagentor_gross","state","");;;;\
        if($p eq "geschlossen") {\
          fhem("set Garagentor_gross wird_geoeffnet");;;;\
          RemoveInternalTimer("grg_gross_tmo");;;;\
          InternalTimer(gettimeofday()+$travel_gross, $tmo_gross, "grg_gross_tmo");;;;\
        } elsif($p eq "geoeffnet") {\
          fhem("set Garagentor_gross wird_geschlossen");;;;\
          RemoveInternalTimer("grg_gross_tmo");;;;\
          InternalTimer(gettimeofday()+$travel_gross, $tmo_gross, "grg_gross_tmo");;;;\
        }\
      }\
    };;;;\
    InternalTimer(gettimeofday()+0.2, sub {\
      my $a5 = ReadingsVal($DEV,"i5","OFF");;;;\
      my $a6 = ReadingsVal($DEV,"i6","OFF");;;;\
      my $p = ReadingsVal("Garagentor_gross","state","");;;;\
      if($a5 eq "ON" and $a6 eq "OFF") {\
        fhem("set Garagentor_gross geoeffnet");;;;\
        RemoveInternalTimer("grg_gross_tmo");;;;\
        RemoveInternalTimer("grg_gross_confirm");;;;\
      } elsif($a5 eq "OFF" and $a6 eq "ON") {\
        fhem("set Garagentor_gross geschlossen");;;;\
        RemoveInternalTimer("grg_gross_tmo");;;;\
        RemoveInternalTimer("grg_gross_confirm");;;;\
      } elsif($a5 eq "ON" and $a6 eq "ON") {\
        fhem("set Garagentor_gross Fehler");;;;\
        RemoveInternalTimer("grg_gross_tmo");;;;\
        RemoveInternalTimer("grg_gross_confirm");;;;\
      } else {\
        if($p eq "geschlossen" or $p eq "geoeffnet") {\
          RemoveInternalTimer("grg_gross_confirm");;;;\
          InternalTimer(gettimeofday()+$debounce_gross, $confirm_gross, "grg_gross_confirm");;;;\
        } elsif($p eq "wird_geoeffnet" or $p eq "wird_geschlossen") {\
        } else {\
          fhem("set Garagentor_gross Zwischenstellung");;;;\
        }\
      }\
    }, undef);;;;\
  }\
)
