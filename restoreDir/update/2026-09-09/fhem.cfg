define di_IstKurve_Log DOIF ([+00:05:00])\
{\
my $dev = "DOIF_GoodWe_simple";;\
my ($min,$h,$mday) = (localtime)[1,2,3];;\
\
my $b1 = ReadingsNum("GoodWe_Garage_Haus_West_5877","Power_Battery",0);;\
my $b2 = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","Power_Battery",0);;\
my $kw = 0;;\
$kw += -$b1 if($b1 < 0);;\
$kw += -$b2 if($b2 < 0);;\
$kw /= 1000;;\
\
my $lastday = ReadingsNum($dev,"ist_kw_day",-1);;\
if($lastday != $mday)\
{\
  for my $i (0..23)\
  {\
    fhem("setreading $dev ".sprintf("ist_kw_%02d",$i)." -1");;\
    fhem("setreading $dev ".sprintf("ist_kw_%02d_n",$i)." 0");;\
  }\
  fhem("setreading $dev ist_kw_day $mday");;\
}\
\
my $key = sprintf("ist_kw_%02d",$h);;\
my $alt = ReadingsNum($dev,$key,-1);;\
my $n   = ReadingsNum($dev,$key."_n",0);;\
my $avg = ($n > 0 && $alt >= 0) ? (($alt*$n + $kw)/($n+1)) : $kw;;\
fhem("setreading $dev $key ".sprintf("%.3f",$avg));;\
fhem("setreading $dev ${key}_n ".($n+1));;\
}
