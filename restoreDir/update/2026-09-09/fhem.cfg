  (ReadingsNum("LambdaWP","BoilerHighTemp",0)\
   - ReadingsNum("LambdaWP","Einschalttemp_VD_bei_DHW_Betrieb",0)) > 0\
  ? sprintf("%.1f",\
      ReadingsNum("LambdaWP","BoilerHighTemp",0)\
      - ReadingsNum("LambdaWP","Einschalttemp_VD_bei_DHW_Betrieb",0)\
    )\
