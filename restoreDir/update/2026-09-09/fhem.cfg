attr GoodWe_Garage_Haus_West_5877 comment Inbetriebname: 15.01.2025\
PV1: Garage Süd und Haus Süd westlicher Teil\
PV2: Garage Nord und Haus Nord westlicher Teil\
\
\
Marktstammdatenregister:\
gemeldet sind 55 Module mit je 450 Wp macht zusammen 24,8 kWp\
\
\
Anzahl der Module:	55	\
Bruttoleistung:	21,6 kWp	\
Nettonennleistung (Wert wird vom System ausgefüllt):	20 kW	\
Zugeordnete Wechselrichterleistung:	20 kW	\
\
Ausrichtung\
(überwiegende) Ausrichtung:	Süd	\
(überwiegender) Neigungswinkel:	41 - 60 Grad	\
weitere Ausrichtung:	Nord	\
weiterer Neigungswinkel:	41 - 60 Grad	\
\
\
Wenn alle 24,8 kWp nach Süden mit 45° Neigung ausgerichtet wären (im Marktstammdatenregistern\
ist die Hauptausrichtung mit Süd 41-60° angegeben), läge der technische Jahresertrag in Eckental\
– ohne nennenswerte Verschattung – grob bei:\
Für 24,8 kWp, komplett Süd, 45°, Eckental:\
ca. 25.500–27.500 kWh Jahresertrag\
realistischer Richtwert: rund 26.500 kWh/Jahr.\
\
Bei 24,8 kWp, davon:\
18,6 kWp Süd / 45°\
6,2 kWp Nord / 45°\
Wechselrichter: 21,6 kW\
liegt der erwartbare Jahresertrag in Eckental bei ungefähr:\
23.500–25.000 kWh/Jahr\
realistischer Richtwert: rund 24.300 kWh/Jahr.\
\
\
Die Einspeiseverguetung betraegt 7.45 ct/kWh\
\
N-Ergie hat fuer 2025 (Betrieb 14.04.25 - 31.12.25) eine \
Einspeisemenge von 11.319 kWh akzeptiert,\
hochgerechnet auf das Gesamtjahr sind das ca. 15.000 kWh,\
die Anlage war aber erst im Oktober vollständig montiert\
\
Bei einem theoretischen Ertrag von 26.000 kWh p.a. und \
einem Eigenverbrauch von 4.000 kWh ergibt sich eine jährliche\
Einspeisemenge von 22.000 kWh\
\
Annahme: die N-ergie akzeptiert eine Einspeisung p.a. bis ca. 22.000 kWh
