fhem("setreading $DEV active_mode ".($phase_lock ? "phase_lock_control" : "instant_control"));;\
return;;\
}\
\
if(ReadingsVal($DEV,"active_mode","") eq "stop_then_pv" && $cm eq "stop")\
{\
my $stop_since = ReadingsNum($DEV,"pv_stop_timer",0);;\
if(($now - $stop_since) >= 15 && $send_ok)\
{\
fhem("set openWB_Garage_rechts_Control chargemode pv") unless $manualStopLockActive;;\
fhem("setreading $DEV last_send_time ".int($now));;\
fhem("setreading $DEV pv_stop_timer 0");;\
fhem("setreading $DEV active_mode pv_restart");;\
}\
else\
{\
fhem("setreading $DEV active_mode stop_then_pv");;\
}\
return;;\
}\
\
fhem("setreading $DEV active_mode unknown_state");;\
return;;\
}\
)
