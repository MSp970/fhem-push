define Lambda_VD_slope_cooldown DOIF (\
[LambdaWP:HC_FlowTemp]\
)\
(\
{\
my $t_now = time();;\
\
my $flow   = ReadingsNum("LambdaWP","HC_FlowTemp",0);;\
my $target = ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0);;\
\
my $threshold = $target - 6.0;;\
my $start_slope_threshold = $target - 0.3;;\
\
my $active = ReadingsNum("$SELF","cool_active",0);;\
\
my $last_time = ReadingsNum("$SELF","cool_last_time",0);;\
my $last_flow = ReadingsNum("$SELF","cool_last_flow",$flow);;\
\
my $sum_dt = ReadingsNum("$SELF","cool_sum_dt",0);;\
my $sum_dT = ReadingsNum("$SELF","cool_sum_dT",0);;\
\
if($flow < $start_slope_threshold && $active == 0)\
{\
  fhem("setreading $SELF cool_active 1");;\
  fhem("setreading $SELF cool_start_time $t_now");;\
  fhem("setreading $SELF cool_sum_dt 0");;\
  fhem("setreading $SELF cool_sum_dT 0");;\
\
  $sum_dt = 0;;\
  $sum_dT = 0;;\
  $active = 1;;\
}\
\
if($flow >= $start_slope_threshold && $active == 1)\
{\
  fhem("setreading $SELF cool_active 0");;\
  fhem("setreading $SELF cool_stop_time $t_now");;\
  $active = 0;;\
}\
\
my $dt = ($last_time > 0) ? ($t_now - $last_time) : 0;;\
my $dT = $flow - $last_flow;;\
\
if($active == 1 && $dt > 0)\
{\
  my $dT_eff;;\
\
  if($dT < 0)\
  {\
    $dT_eff = $dT;;\
  }\
  elsif($dT < 0.5)\
  {\
    $dT_eff = $dT * 0.15;;\
  }\
  else\
  {\
    $dT_eff = $dT;;\
  }\
\
  $sum_dt += $dt;;\
  $sum_dT += $dT_eff;;\
\
  fhem("setreading $SELF cool_sum_dt $sum_dt");;\
  fhem("setreading $SELF cool_sum_dT $sum_dT");;\
}\
\
fhem("setreading $SELF cool_last_time $t_now");;\
fhem("setreading $SELF cool_last_flow $flow");;\
\
my $slope = 0;;\
\
if($sum_dt > 0)\
{\
  my $min = $sum_dt / 60;;\
  $slope = $sum_dT / $min;;\
}\
\
my $slope_avg = ReadingsNum("$SELF","cool_slope_avg",0);;\
my $alpha = 0.2;;\
$slope_avg = ($slope_avg == 0) ? $slope : ($alpha * $slope + (1-$alpha) * $slope_avg);;\
\
my $time_to_threshold_min = 0;;\
\
if($slope_avg < 0)\
{\
  my $delta = $threshold - $flow;;\
  $time_to_threshold_min = abs($delta / $slope_avg);;\
}\
\
my $time_sec = int($time_to_threshold_min * 60);;\
\
my $start_forecast_time = ($time_sec > 0) ? ($t_now + $time_sec) : 0;;\
\
fhem("setreading $SELF cool_dbg_flow $flow");;\
fhem("setreading $SELF cool_dbg_target $target");;\
fhem("setreading $SELF cool_dbg_sum_dt $sum_dt");;\
fhem("setreading $SELF cool_dbg_sum_dT $sum_dT");;\
fhem("setreading $SELF cool_dbg_slope ".sprintf("%.4f",$slope));;\
fhem("setreading $SELF cool_dbg_slope_avg ".sprintf("%.4f",$slope_avg));;\
fhem("setreading $SELF cool_dbg_time_min ".sprintf("%.2f",$time_to_threshold_min));;\
\
return unless ($active == 1);;\
return unless ($sum_dt > 60);;\
return unless ($slope_avg < 0);;\
\
my @t = localtime($start_forecast_time);;\
my $timeStr = ($start_forecast_time > 0)\
  ? sprintf("%02d:%02d:%02d",$t[2],$t[1],$t[0])\
  : "-";;\
\
fhem("setreading $SELF cool_slope ".sprintf("%.4f",$slope));;\
fhem("setreading $SELF cool_slope_avg ".sprintf("%.4f",$slope_avg));;\
\
fhem("setreading $SELF cool_time_to_start_min ".sprintf("%.2f",$time_to_threshold_min));;\
fhem("setreading $SELF cool_time_to_start_sec $time_sec");;\
\
fhem("setreading $SELF cool_start_forecast_ts $start_forecast_time");;\
fhem("setreading $SELF cool_start_forecast_time $timeStr");;\
fhem("setreading WP_Timer cool_start_forecast_time $timeStr");;\
fhem("setreading WP_Timer cool_start_forecast_ts $start_forecast_time");;\
\
}\
)
