define DOIF_PV_forecast_Batterie_laden DOIF ([DWD] or [+00:05:00])\
({\
my $now = time();;\
my $month = (localtime($now))[4] + 1;;\
\
my $kwp_pr_base =\
  17.55 * 0.98 +\
  2.25  * 1.00 +\
  2.25  * 0.60 +\
  2.25  * 0.60 +\
  15.30 * 0.32 +\
  3.60  * 0.42;;\
my $kwp_pr_corr = ReadingsNum("DOIF_PV_forecast_Batterie_laden","kwp_pr_corr",1.0);;\
$kwp_pr_corr = 0.6 if($kwp_pr_corr < 0.6);;\
$kwp_pr_corr = 1.6 if($kwp_pr_corr > 1.6);;\
my $kwp_pr = $kwp_pr_base * $kwp_pr_corr;;\
\
my $socMax1 = ReadingsNum("EMS_Control","socMax1",100);;\
my $socMax2 = ReadingsNum("EMS_Control","socMax2",100);;\
\
my $peak_hour = 13;;\
if($month == 4 || $month == 8) { $peak_hour = 12;; }\
if($month <= 3 || $month >= 9) { $peak_hour = 12;; }\
\
my $primary_target   = 15;;\
\
my %pv_today    = ();;\
my %pv_tomorrow = ();;\
my $sum_today    = 0;;\
my $sum_tomorrow = 0;;\
\
for(my $i=0;; $i<=23;; $i++)\
{\
  my $rad_today = ReadingsNum("DWD","fc0_".$i."_Rad1h",0);;\
  my $sun_today = ReadingsNum("DWD","fc0_".$i."_SunUp",0);;\
  my $pv_t = 0;;\
  if($sun_today && $rad_today >= 50)\
  {\
    my $pr = 0.72 + ($rad_today / 4000) * 0.20;;\
    $pr = 0.90 if($pr > 0.90);;\
    my $weather_factor = 1.0 + ($rad_today / 4000) * 0.04;;\
    $weather_factor = 1.04 if($weather_factor > 1.04);;\
    $pv_t = ($rad_today / 3600) * $kwp_pr * $pr * $weather_factor;;\
  }\
  $pv_today{$i} = $pv_t;;\
  $sum_today += $pv_t;;\
\
  my $rad_tomorrow = ReadingsNum("DWD","fc1_".$i."_Rad1h",0);;\
  my $sun_tomorrow = ReadingsNum("DWD","fc1_".$i."_SunUp",0);;\
  my $pv_m = 0;;\
  if($sun_tomorrow && $rad_tomorrow >= 50)\
  {\
    my $pr = 0.72 + ($rad_tomorrow / 4000) * 0.20;;\
    $pr = 0.90 if($pr > 0.90);;\
    my $weather_factor = 1.0 + ($rad_tomorrow / 4000) * 0.04;;\
    $weather_factor = 1.04 if($weather_factor > 1.04);;\
    $pv_m = ($rad_tomorrow / 3600) * $kwp_pr * $pr * $weather_factor;;\
  }\
  $pv_tomorrow{$i} = $pv_m;;\
  $sum_tomorrow += $pv_m;;\
}\
\
my $soc1 = ReadingsNum("GoodWe_Garage_Haus_West_5877","SOC",0);;\
my $soc2 = ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","SOC",0);;\
\
my $cap1 = ReadingsNum("EMS_Control","capacity1",10);;\
my $cap2 = ReadingsNum("EMS_Control","capacity2",5);;\
\
my $real_energy =\
  ($cap1 * ($socMax1 - $soc1) / 100) +\
  ($cap2 * ($socMax2 - $soc2) / 100);;\
\
$real_energy = 0 if($real_energy < 0);;\
\
my $max1   = ReadingsNum("EMS_Control","maxPower1",3000);;\
my $max2   = ReadingsNum("EMS_Control","maxPower2",2000);;\
my $max_kw = ($max1 + $max2) / 1000;;\
\
my $sun_start = 23;;\
my $sun_end   = 0;;\
\
for(my $i=0;; $i<=23;; $i++)\
{\
  if(($pv_today{$i} // 0) > 0.5)\
  {\
    $sun_start = $i if($i < $sun_start);;\
    $sun_end   = $i if($i > $sun_end);;\
  }\
}\
\
my $pv_bis_15 = 0;;\
for(my $i=$sun_start;; $i<=$primary_target;; $i++)\
{\
  $pv_bis_15 += ($pv_today{$i} // 0);;\
}\
\
my $schlechter_tag_raw = ($pv_bis_15 < $real_energy * 1.5) ? 1 : 0;;\
my $schlechter_tag_last = ReadingsNum("DOIF_PV_forecast_Batterie_laden","debug_schlechter_tag",1);;\
my $SCHLECHT_HOLD_S = ReadingsNum("EMS_Control","schlechterTagHoldS",900);;\
my $schlecht_flip_seit = ReadingsNum("DOIF_PV_forecast_Batterie_laden","schlecht_flip_seit",0);;\
my $schlechter_tag;;\
if($schlechter_tag_raw == $schlechter_tag_last)\
{\
$schlechter_tag = $schlechter_tag_last;;\
fhem("setreading DOIF_PV_forecast_Batterie_laden schlecht_flip_seit 0") if($schlecht_flip_seit != 0);;\
}\
else\
{\
$schlecht_flip_seit = $now if($schlecht_flip_seit == 0);;\
if(($now - $schlecht_flip_seit) >= $SCHLECHT_HOLD_S)\
{\
$schlechter_tag = $schlechter_tag_raw;;\
fhem("setreading DOIF_PV_forecast_Batterie_laden schlecht_flip_seit 0");;\
}\
else\
{\
$schlechter_tag = $schlechter_tag_last;;\
fhem("setreading DOIF_PV_forecast_Batterie_laden schlecht_flip_seit ".int($schlecht_flip_seit));;\
}\
}\
\
my $target_hour = $primary_target;;\
if($schlechter_tag && $sun_end > $primary_target)\
{\
  $target_hour = $sun_end;;\
}\
\
my $nacht_verbrauch_forecast = 0;;\
{\
  my $DEV_GW = "DOIF_GoodWe_simple";;\
  my $gl_5min_aktuell = ReadingsNum($DEV_GW,"grundlast_5min",0);;\
\
  my $nacht_start = 22;;\
  my $nacht_ende  = 6;;\
  my $nacht_stunden = (24 - $nacht_start) + $nacht_ende;;\
\
  my $gl_profil_sum = 0;;\
  my $gl_profil_count = 0;;\
  my $DEV_PROFIL = "DOIF_Grundlast_Profil";;\
\
  for(my $h = $nacht_start;; $h <= 23;; $h++)\
  {\
    my $key = sprintf("grundlast_h%02d_ohne_ev",$h);;\
    my $val = ReadingsNum($DEV_PROFIL,$key,0);;\
    if($val > 0) { $gl_profil_sum += $val;; $gl_profil_count++;; }\
  }\
  for(my $h = 0;; $h <= $nacht_ende;; $h++)\
  {\
    my $key = sprintf("grundlast_h%02d_ohne_ev",$h);;\
    my $val = ReadingsNum($DEV_PROFIL,$key,0);;\
    if($val > 0) { $gl_profil_sum += $val;; $gl_profil_count++;; }\
  }\
\
  my $ev_leistung = ReadingsNum("OpenWB","Ladepunkt_Leistung",0);;\
  my $ev_laedt    = (ReadingsVal("OpenWB","Ladepunkt_charge_state","False") eq "True" && $ev_leistung > 200) ? 1 : 0;;\
  my $ev_corr_w   = $ev_laedt ? $ev_leistung : 0;;\
\
  my $gl_nacht_avg_w;;\
  if($gl_profil_count > 0)\
  {\
    $gl_nacht_avg_w = $gl_profil_sum / $gl_profil_count;;\
  }\
  else\
  {\
    $gl_nacht_avg_w = $gl_5min_aktuell - $ev_corr_w;;\
  }\
  $gl_nacht_avg_w = 200 if($gl_nacht_avg_w < 200);;\
\
  $nacht_verbrauch_forecast = ($gl_nacht_avg_w / 1000) * $nacht_stunden;;\
}\
\
fhem("setreading DOIF_PV_forecast_Batterie_laden forecast_tomorrow_kwh ".sprintf("%.2f",$sum_tomorrow));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden nacht_verbrauch_forecast_kwh ".sprintf("%.2f",$nacht_verbrauch_forecast));;\
\
{\
  my $FC = "DOIF_PV_forecast_Batterie_laden";;\
  my ($ls,$lm,$lh,$lmd,$lmo,$lyr) = localtime($now);;\
  my $today_ymd = sprintf("%04d%02d%02d",$lyr+1900,$lmo+1,$lmd);;\
\
  if($lh >= 6 && ReadingsVal($FC,"kwp_learn_day","") ne $today_ymd)\
  {\
    fhem("setreading $FC kwp_fc_morning ".sprintf("%.2f",$sum_today));;\
    fhem("setreading $FC kwp_learn_day $today_ymd");;\
  }\
\
  if($lh >= 22 && ReadingsVal($FC,"kwp_learned_day","") ne $today_ymd)\
  {\
    my $real_today = ReadingsNum("GoodWe_Garage_Haus_West_5877","E_PV_Day",0)\
                   + ReadingsNum("GoodWe_Haus_Ost_Mitte_5876","E_PV_Day",0);;\
    my $fc_morning = ReadingsNum($FC,"kwp_fc_morning",0);;\
\
    if($real_today >= 3.0 && $fc_morning >= 3.0)\
    {\
      my $ratio = $real_today / $fc_morning;;\
      $ratio = 0.5 if($ratio < 0.5);;\
      $ratio = 2.0 if($ratio > 2.0);;\
\
      my $alpha    = 0.15;;\
      my $corr_old = ReadingsNum($FC,"kwp_pr_corr",1.0);;\
      my $corr_new = $corr_old * ($alpha * $ratio + (1 - $alpha));;\
      $corr_new = 0.6 if($corr_new < 0.6);;\
      $corr_new = 1.6 if($corr_new > 1.6);;\
\
      fhem("setreading $FC kwp_pr_corr ".sprintf("%.4f",$corr_new));;\
      fhem("setreading $FC kwp_learn_ratio ".sprintf("%.3f",$ratio));;\
      fhem("setreading $FC kwp_learn_real ".sprintf("%.2f",$real_today));;\
    }\
    fhem("setreading $FC kwp_learned_day $today_ymd");;\
  }\
}\
\
for(my $i=0;; $i<=23;; $i++)\
{\
  my $reading = sprintf("charge_curve_%02d",$i);;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden $reading 0.00");;\
}\
\
if($real_energy <= 0)\
{\
  fhem("setreading DOIF_PV_forecast_Batterie_laden charge_start_time 00:00:00");;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden forecast_today_kwh ".sprintf("%.2f",$sum_today));;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden debug_real_energy_kwh 0.00");;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden debug_charge_power_kw 0.00");;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden debug_peak_hour $peak_hour");;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden debug_sun_window ${sun_start}-${sun_end}");;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden debug_schlechter_tag $schlechter_tag");;\
  return;;\
}\
\
my $peak_kw  = ReadingsNum("EMS_Control","ladePeakKw",5.0);;\
my $step_kw  = ReadingsNum("EMS_Control","ladeStepKw",1.0);;\
my $reserve_kw = $schlechter_tag ? 0 : (ReadingsNum("EMS_Control","ladeEinspeisReserve",1000) / 1000);;\
\
my $MAX_HOUR = $schlechter_tag ? $sun_end : 15;;\
$MAX_HOUR = $sun_end if($MAX_HOUR > $sun_end);;\
\
my $block_lo = $peak_hour;;\
my $block_hi = $peak_hour;;\
my $ring = 0;;\
my $sum_block = 0;;\
\
while($ring <= 8)\
{\
  my $lo = $peak_hour - $ring;;\
  my $hi = $peak_hour + $ring;;\
  $hi = $MAX_HOUR  if($hi > $MAX_HOUR);;\
  $lo = $sun_start if($lo < $sun_start);;\
\
  my $s = 0;;\
  for(my $i=$lo;; $i<=$hi;; $i++)\
  {\
    my $d = abs($i - $peak_hour);;\
    my $b = $peak_kw - $d * $step_kw;;\
    $b = 0 if($b < 0);;\
    my $pv = ($pv_today{$i} // 0) - $reserve_kw;;\
    $b = $pv if($b > $pv);;\
    $b = 0 if($b < 0);;\
    $b = $max_kw if($b > $max_kw);;\
    $s += $b;;\
  }\
  $block_lo = $lo;;\
  $block_hi = $hi;;\
  $sum_block = $s;;\
  last if($s >= $real_energy);;\
  $ring++;;\
}\
\
my $first_h = 99;;\
for(my $i=$block_lo;; $i<=$block_hi;; $i++)\
{\
  my $d = abs($i - $peak_hour);;\
  my $b = $peak_kw - $d * $step_kw;;\
  $b = 0 if($b < 0);;\
  my $pv = ($pv_today{$i} // 0) - $reserve_kw;;\
  $b = $pv if($b > $pv);;\
  $b = 0 if($b < 0);;\
  $b = $max_kw if($b > $max_kw);;\
  next if($b <= 0.05);;\
  my $reading = sprintf("charge_curve_%02d",$i);;\
  fhem("setreading DOIF_PV_forecast_Batterie_laden $reading ".sprintf("%.2f",$b));;\
  $first_h = $i if($i < $first_h);;\
}\
\
my $start_time = ($first_h < 99) ? sprintf("%02d:00:00",$first_h) : "00:00:00";;\
\
fhem("setreading DOIF_PV_forecast_Batterie_laden charge_start_time $start_time");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden forecast_today_kwh ".sprintf("%.2f",$sum_today));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_real_energy_kwh ".sprintf("%.2f",$real_energy));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_charge_power_kw ".sprintf("%.2f",$peak_kw));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_peak_kw ".sprintf("%.2f",$peak_kw));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_reserve_kw ".sprintf("%.2f",$reserve_kw));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_charge_block ${block_lo}-${block_hi}");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_sum_block_kwh ".sprintf("%.2f",$sum_block));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_pv_bis_15 ".sprintf("%.2f",$pv_bis_15));;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_schlechter_tag $schlechter_tag");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_peak_hour $peak_hour");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_sun_window ${sun_start}-${sun_end}");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_target_hour $target_hour");;\
fhem("setreading DOIF_PV_forecast_Batterie_laden debug_kwp_pr_eff ".sprintf("%.2f",$kwp_pr));;\
})
