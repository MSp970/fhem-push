define Lambda_P_min_check DOIF (\
  (\
    [LambdaWP:HP_OperatingState] eq "CENTRAL_HEATING" and\
    [LambdaWP:Verdichter_aktiv] eq "on" and\
    [+00:05:00]\
  )\
)\
(\
{\
  return unless (\
    ReadingsVal("LambdaWP","HP_OperatingState","") eq "CENTRAL_HEATING" &&\
    ReadingsVal("LambdaWP","Verdichter_aktiv","") eq "on"\
  );;\
\
  my $now = time();;\
  my $min_on_time  = 600;;\
  my $min_off_time = 600;;\
  my $eval_zeit    = 3600;;\
\
  my $t_start = ReadingsNum("WP_Timer","HC_eval_start",0);;\
  if($t_start == 0)\
  {\
    $t_start = $now;;\
    fhem("setreading WP_Timer HC_eval_start $t_start");;\
  }\
  my $runtime_sec = $now - $t_start;;\
  fhem("setreading $SELF runtime_sec $runtime_sec");;\
\
  my $flow   = ReadingsNum("LambdaWP","HC_FlowTemp",0);;\
  my $target = ReadingsNum("LambdaWP","HC_Target_temp_flow_line",0);;\
\
  my $state = ReadingsVal("myShelly_Heizraum_miniswitch","state","off");;\
\
  my $last_on  = ReadingsNum($SELF,"shelly_last_on",0);;\
  my $last_off = ReadingsNum($SELF,"shelly_last_off",0);;\
\
  my $runtime_on  = ($last_on  > 0) ? ($now - $last_on)  : ($min_on_time  + 1);;\
  my $runtime_off = ($last_off > 0) ? ($now - $last_off) : ($min_off_time + 1);;\
\
  if($state ne "off")\
  {\
    if($flow >= $target && $runtime_on >= $min_on_time)\
    {\
      fhem("set myShelly_Heizraum_miniswitch off");;\
      fhem("setreading $SELF shelly_last_off $now");;\
      fhem("setreading $SELF dbg_aktion sperre_aktiviert");;\
    }\
    return;;\
  }\
\
  return if($runtime_sec < $eval_zeit);;\
\
  if($state eq "off")\
  {\
    if($flow < ($target - 1) && $runtime_off >= $min_off_time)\
    {\
      fhem("set myShelly_Heizraum_miniswitch on");;\
      fhem("setreading $SELF shelly_last_on $now");;\
      fhem("setreading $SELF dbg_aktion sperre_aufgehoben");;\
    }\
  }\
}\
)\
DOELSE\
(\
{\
  fhem("setreading WP_Timer HC_eval_start 0");;\
}\
)
