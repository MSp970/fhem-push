attr Lambda_P_min_check wait 2
define Erkennung_HC_ueberschwingen DOIF ([10s_20s_timer:tick])\
({\
my $now    = time();;\
my $DEV    = "Erkennung_HC_ueberschwingen";;\
\
my $flow   = ReadingsNum("LambdaWP","HC_FlowTemp",0);;\
my $target = ReadingsNum("LambdaWP","HC_Targettemp",0);;\
my $vd     = ReadingsVal("LambdaWP","Verdichter_aktiv","off");;\
my $state  = ReadingsVal("LambdaWP","HP_OperatingState","");;\
\
my $FENSTER_S        = 900;;\
my $VARIANZ_SCHWELLE = 2.5;;\
my $ZC_SCHWELLE      = 3;;\
my $ZYKLUS_KURZ_S    = 1200;;\
my $SCORE_SCHWELLE   = 2;;\
my $HYSTERESE_ON_S   = 120;;\
my $HYSTERESE_OFF_S  = 300;;\
\
return if($vd ne "on" || $state ne "CENTRAL_HEATING");;\
\
my $ringbuf_raw = ReadingsVal($DEV,"ringbuf","");;\
my @ring = $ringbuf_raw ? split(/,/, $ringbuf_raw) : ();;\
\
push @ring, sprintf("%.1f:%.0f", $flow, $now);;\
\
my $cutoff = $now - $FENSTER_S;;\
@ring = grep { (split(/:/,$_))[1] >= $cutoff } @ring;;\
\
if(@ring > 90) { @ring = @ring[-90..-1];; }\
\
fhem("setreading $DEV ringbuf ".join(",",@ring));;\
fhem("setreading $DEV ringbuf_cnt ".scalar(@ring));;\
\
my @vals = map { (split(/:/,$_))[0] } @ring;;\
\
my $score = 0;;\
\
if(@vals >= 6)\
{\
    my $n   = scalar(@vals);;\
    my $sum = 0;;\
    $sum += $_ for @vals;;\
    my $mean = $sum / $n;;\
\
    my $sq_sum = 0;;\
    $sq_sum += ($_ - $mean)**2 for @vals;;\
    my $varianz = $sq_sum / $n;;\
    my $stddev  = sqrt($varianz);;\
\
    fhem("setreading $DEV dbg_stddev ".sprintf("%.2f",$stddev));;\
    fhem("setreading $DEV dbg_mean ".sprintf("%.1f",$mean));;\
\
    if($stddev >= $VARIANZ_SCHWELLE)\
    {\
        $score += 1;;\
        fhem("setreading $DEV dbg_score_varianz 1");;\
    }\
    else\
    {\
        fhem("setreading $DEV dbg_score_varianz 0");;\
    }\
\
    my $zc = 0;;\
    for(my $i = 1;; $i < $n;; $i++)\
    {\
        if(($vals[$i-1] < $target && $vals[$i] >= $target) ||\
           ($vals[$i-1] >= $target && $vals[$i] < $target))\
        {\
            $zc++;;\
        }\
    }\
    fhem("setreading $DEV dbg_zero_crossings $zc");;\
\
    if($zc >= $ZC_SCHWELLE)\
    {\
        $score += 1;;\
        fhem("setreading $DEV dbg_score_zc 1");;\
    }\
    else\
    {\
        fhem("setreading $DEV dbg_score_zc 0");;\
    }\
}\
else\
{\
    fhem("setreading $DEV dbg_stddev 0");;\
    fhem("setreading $DEV dbg_score_varianz 0");;\
    fhem("setreading $DEV dbg_score_zc 0");;\
}\
\
my $zyklusdauer = ReadingsNum("DOIF_WP_Laufzeiten","vd_on_seit_sec",9999);;\
my $start_ts    = ReadingsNum("DOIF_WP_Laufzeiten","vd_last_start_ts",0);;\
my $start_cnt   = ReadingsNum("DOIF_WP_Laufzeiten","vd_start_counter",0);;\
my $last_cnt    = ReadingsNum($DEV,"last_vd_start_counter",0);;\
\
if($start_cnt != $last_cnt)\
{\
    fhem("setreading $DEV last_vd_start_counter $start_cnt");;\
    fhem("setreading $DEV last_vd_start_ts $start_ts");;\
}\
\
my $letzter_start = ReadingsNum($DEV,"last_vd_start_ts",0);;\
my $seit_start    = ($letzter_start > 0) ? ($now - $letzter_start) : 9999;;\
\
fhem("setreading $DEV dbg_zyklusdauer ".int($seit_start));;\
\
if($seit_start > 0 && $seit_start < $ZYKLUS_KURZ_S)\
{\
    $score += 1;;\
    fhem("setreading $DEV dbg_score_zyklus 1");;\
}\
else\
{\
    fhem("setreading $DEV dbg_score_zyklus 0");;\
}\
\
fhem("setreading $DEV dbg_score_gesamt $score");;\
\
my $aktuell = ReadingsVal($DEV,"Ueberschwingen_erkannt","off");;\
my $seit_on  = ReadingsNum($DEV,"ueber_on_since",0);;\
my $seit_off = ReadingsNum($DEV,"ueber_off_since",0);;\
\
if($score >= $SCORE_SCHWELLE)\
{\
    if($aktuell eq "off")\
    {\
        if($seit_on == 0)\
        {\
            fhem("setreading $DEV ueber_on_since ".int($now));;\
            $seit_on = $now;;\
        }\
        if(($now - $seit_on) >= $HYSTERESE_ON_S)\
        {\
            fhem("setreading $DEV Ueberschwingen_erkannt on");;\
            fhem("setreading $DEV ueber_off_since 0");;\
        }\
    }\
    else\
    {\
        fhem("setreading $DEV ueber_on_since 0");;\
        fhem("setreading $DEV ueber_off_since 0");;\
    }\
}\
else\
{\
    if($aktuell eq "on")\
    {\
        if($seit_off == 0)\
        {\
            fhem("setreading $DEV ueber_off_since ".int($now));;\
            $seit_off = $now;;\
        }\
        if(($now - $seit_off) >= $HYSTERESE_OFF_S)\
        {\
            fhem("setreading $DEV Ueberschwingen_erkannt off");;\
            fhem("setreading $DEV ueber_on_since 0");;\
        }\
    }\
    else\
    {\
        fhem("setreading $DEV ueber_on_since 0");;\
        fhem("setreading $DEV ueber_off_since 0");;\
    }\
}\
\
fhem("setreading $DEV dbg_flow ".sprintf("%.1f",$flow));;\
fhem("setreading $DEV dbg_target ".sprintf("%.1f",$target));;\
fhem("setreading $DEV dbg_vd $vd");;\
fhem("setreading $DEV dbg_state $state");;\
})\

