define di_Batterie_Entladewaechter DOIF DOIF ([+00:00:30])\
{\
  use POSIX qw(strftime);;\
  my $now = time();;\
  my $DEV = "di_Batterie_Entladewaechter";;\
  my $ENTL1_DEV = "GoodWe_Garage_Haus_West_5877";;\
  my $ENTL2_DEV = "GoodWe_Haus_Ost_Mitte_5876";;\
  my $ENTL_READING = "Batterie_Entladestrom_Max";;\
\
  my $ENTL1_NORMAL = ReadingsNum("openWB_Control","battDischargeMaxA5877",10.0);;\
  my $ENTL2_NORMAL = ReadingsNum("openWB_Control","battDischargeMaxA5876",10.0);;\
  $ENTL1_NORMAL = 10.0 if($ENTL1_NORMAL < 1);;\
  $ENTL2_NORMAL = 10.0 if($ENTL2_NORMAL < 1);;\
\
  my $EV_SPERRE_W = ReadingsNum("openWB_Control","battSperreLeistungW",1000);;\
  my $HALTE_S     = ReadingsNum("openWB_Control","waechterHalteS",15);;\
  my $RETRY_S     = ReadingsNum("openWB_Control","waechterRetryS",300);;\
\
  my $power = ReadingsNum("OpenWB","Ladeleistung_gesamt",0);;\
  my $ev_laedt_stark = ($power >= $EV_SPERRE_W) ? 1 : 0;;\
\
  my $soll1 = $ev_laedt_stark ? 0.0 : $ENTL1_NORMAL;;\
  my $soll2 = $ev_laedt_stark ? 0.0 : $ENTL2_NORMAL;;\
\
  my $ist1 = ReadingsNum($ENTL1_DEV,$ENTL_READING,-1);;\
  my $ist2 = ReadingsNum($ENTL2_DEV,$ENTL_READING,-1);;\
\
  my $abw = (abs($ist1 - $soll1) > 0.05 || abs($ist2 - $soll2) > 0.05) ? 1 : 0;;\
\
  my $abw_seit = ReadingsNum($DEV,"abweichung_seit",0);;\
  if($abw)\
  {\
    if($abw_seit == 0)\
    {\
      fhem("setreading $DEV abweichung_seit ".int($now));;\
      $abw_seit = $now;;\
    }\
  }\
  else\
  {\
    if($abw_seit != 0)\
    {\
      fhem("setreading $DEV abweichung_seit 0");;\
    }\
    $abw_seit = 0;;\
  }\
\
  my $eingreifen = ($abw && $abw_seit > 0 && ($now - $abw_seit) >= $HALTE_S) ? 1 : 0;;\
\
  my $letzter_soll1   = ReadingsNum($DEV,"letzter_soll_gesendet1",-999);;\
  my $letzter_soll2   = ReadingsNum($DEV,"letzter_soll_gesendet2",-999);;\
  my $letzter_send1_t = ReadingsNum($DEV,"letzter_send1_t",0);;\
  my $letzter_send2_t = ReadingsNum($DEV,"letzter_send2_t",0);;\
  my $gesendet = 0;;\
\
  if($eingreifen)\
  {\
    if(abs($ist1 - $soll1) > 0.05 && ($soll1 != $letzter_soll1 || ($now - $letzter_send1_t) >= $RETRY_S))\
    {\
      fhem("set $ENTL1_DEV $ENTL_READING ".sprintf("%.1f",$soll1));;\
      fhem("setreading $DEV letzter_soll_gesendet1 ".sprintf("%.1f",$soll1));;\
      fhem("setreading $DEV letzter_send1_t ".int($now));;\
      $gesendet = 1;;\
    }\
    if(abs($ist2 - $soll2) > 0.05 && ($soll2 != $letzter_soll2 || ($now - $letzter_send2_t) >= $RETRY_S))\
    {\
      fhem("set $ENTL2_DEV $ENTL_READING ".sprintf("%.1f",$soll2));;\
      fhem("setreading $DEV letzter_soll_gesendet2 ".sprintf("%.1f",$soll2));;\
      fhem("setreading $DEV letzter_send2_t ".int($now));;\
      $gesendet = 1;;\
    }\
    if($gesendet)\
    {\
      fhem("setreading $DEV last_korrektur ".int($now));;\
      fhem("setreading $DEV abweichung_seit 0");;\
    }\
  }\
\
  fhem("setreading $DEV ev_leistung ".int($power));;\
  fhem("setreading $DEV ev_laedt_stark $ev_laedt_stark");;\
  fhem("setreading $DEV soll_entladestrom ".sprintf("%.1f",$soll1));;\
  fhem("setreading $DEV ist_5877 ".sprintf("%.1f",$ist1));;\
  fhem("setreading $DEV ist_5876 ".sprintf("%.1f",$ist2));;\
  fhem("setreading $DEV korrigiert ".($gesendet ? 1 : 0));;\
\
  my @ts_readings = qw(abweichung_seit last_korrektur bat_entl_last_send letzter_send1_t letzter_send2_t);;\
  foreach my $tr (@ts_readings)\
  {\
    my $te = ReadingsNum($DEV,$tr,0);;\
    if($te > 0)\
    {\
      fhem("setreading $DEV ${tr}_hms ".POSIX::strftime("%d.%m. %H:%M:%S",localtime($te)));;\
    }\
  }\
}
